<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudHaux Dashboard</title>
    <link rel ="stylesheet" href="../static/css/dashboard.css">

</head>
<body>
    <header class="topbar">
        <div class="logo">
            CloudHaux
        </div>

        <div class="search_box">
            <input type="search" placeholder="Search files...">
        </div>

        <div class="profile">
            <svg xmlns="http://www.w3.org/2000/svg"
                width="22"
                height="22"
                fill="currentColor"
                viewBox="0 0 16 16">
                <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm0 1
                        c-2.33 0-7 1.17-7 3.5V14h14v-1.5
                        C15 10.17 10.33 9 8 9z"/>
            </svg>
        </div>
    </header>

    <nav class="left_nav_bar">

        <div class="all_files">
            All Files
        </div>

        <div class="recent">
            Recent
        </div>

        <div class="favorites">
            Favorites
        </div>

        <div class="trash">
            Trash
        </div>

    </nav>


</body>
</html>
