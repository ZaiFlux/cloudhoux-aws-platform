<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudHaux · Images</title>
    <link rel="stylesheet" href="../static/css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* ----- IMAGES PAGE SPECIFIC STYLES ----- */
        .images_viewer {
            width: 100%;
            min-height: 400px;
            padding: 30px;
            border: 1px solid #d9d9d9;
            border-radius: 16px;
            background: white;
            display: flex;
            flex-direction: column;
        }

        .images_header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: none;
            flex-wrap: wrap;
            gap: 12px;
        }

        .images_header h2 {
            font-size: 1.3rem;
            color: #111827;
            margin: 0;
        }

        /* ADD FOLDER BUTTON (icon only) */
        .add-folder-btn {
            background: transparent;
            border: none;
            font-size: 1.8rem;
            color: #1e293b;
            cursor: pointer;
            padding: 0 6px;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            width: 44px;
            height: 44px;
            background: #f1f5f9;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }

        .add-folder-btn i {
            font-size: 1.6rem;
            color: #334155;
        }

        .add-folder-btn:hover {
            background: #e2e8f0;
            transform: scale(1.04);
            color: #0f172a;
        }

        .add-folder-btn:active {
            transform: scale(0.94);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .images_grid {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: flex-start;
            justify-content: flex-start;
            background: #f9fafb;
            border-radius: 12px;
            padding: 24px;
            min-height: 400px;
            border: 1px solid #e5e7eb;
            transition: 0.2s;
            position: relative;
        }

        /* image card */
        .image-card {
            width: 140px;
            height: 140px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
            background: white;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: default;
        }

        .image-card:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 14px rgba(0,0,0,0.08);
        }

        .image-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* ----- FOLDER CARD — with drag support ----- */
        .folder-card {
            width: 125px;
            height: 100px;
            border-radius: 12px;
            background: #eef2f6;
            border: 1px solid #d1d9e6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #1e293b;
            font-size: 0.85rem;
            font-weight: 500;
            transition: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            cursor: grab;
            gap: 4px;
            position: relative;
            user-select: none;
            touch-action: none;
        }

        .folder-card.dragging {
            opacity: 0.8;
            transform: scale(1.05);
            z-index: 1000;
            cursor: grabbing;
            box-shadow: 0 12px 30px rgba(0,0,0,0.15);
            border-color: #3b82f6;
        }

        .folder-card.drag-over {
            border-color: #3b82f6;
            background: #dbeafe;
            transform: scale(1.03);
        }

        .folder-card i {
            font-size: 2.8rem;
            color: #475569;
            margin-bottom: 2px;
            pointer-events: none;
        }

        /* Folder name styling */
        .folder-name {
            background: #dce3ec;
            padding: 2px 14px;
            border-radius: 30px;
            font-size: 0.7rem;
            color: #1e293b;
            letter-spacing: 0.3px;
            cursor: pointer;
            transition: 0.2s;
            user-select: none;
            min-width: 40px;
            text-align: center;
            display: inline-block;
            pointer-events: auto;
        }

        .folder-name:hover {
            background: #c8d2e0;
            transform: scale(1.05);
        }

        /* Input for renaming */
        .folder-name-input {
            background: white;
            border: 2px solid #3b82f6;
            padding: 2px 10px;
            border-radius: 30px;
            font-size: 0.7rem;
            color: #1e293b;
            outline: none;
            min-width: 60px;
            text-align: center;
            font-family: inherit;
            font-weight: 500;
        }

        .folder-name-input:focus {
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .folder-card:hover {
            background: #e2e8f0;
            border-color: #94a3b8;
        }

        /* Drag ghost element */
        .drag-ghost {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.85;
            transform: scale(1.08);
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            border-color: #3b82f6;
            background: #eef2f6;
            border-radius: 12px;
            padding: 10px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .drag-ghost i {
            font-size: 2.8rem;
            color: #475569;
        }

        .drag-ghost span {
            background: #dce3ec;
            padding: 2px 14px;
            border-radius: 30px;
            font-size: 0.7rem;
            color: #1e293b;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .images_grid {
                min-height: 300px;
                padding: 16px;
            }
            .image-card {
                width: 100px;
                height: 100px;
            }
            .folder-card {
                width: 100px;
                height: 100px;
            }
            .add-folder-btn {
                width: 38px;
                height: 38px;
                font-size: 1.4rem;
            }
            .add-folder-btn i {
                font-size: 1.3rem;
            }
        }

        @media (max-width: 480px) {
            .images_grid {
                min-height: 200px;
                gap: 12px;
                padding: 12px;
            }
            .images_header h2 {
                font-size: 1rem;
            }
            .image-card {
                width: 80px;
                height: 80px;
            }
            .folder-card {
                width: 80px;
                height: 80px;
            }
            .folder-card i {
                font-size: 2rem;
            }
            .add-folder-btn {
                width: 34px;
                height: 34px;
            }
            .add-folder-btn i {
                font-size: 1.1rem;
            }
        }

        .custom-context-menu {
            position: fixed;
            z-index: 10000;
            min-width: 180px;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            padding: 6px;
            display: none;
        }
        .custom-context-menu.open { display: block; }
        .ccm-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 12px;
            border-radius: 7px;
            font-size: 0.85rem;
            color: #1f2937;
            cursor: pointer;
        }
        .ccm-item i { width: 16px; text-align: center; color: #475569; }
        .ccm-item:hover { background: #f1f5f9; }
        .ccm-item.ccm-danger { color: #dc2626; }
        .ccm-item.ccm-danger i { color: #dc2626; }
        .ccm-item.ccm-danger:hover { background: #fee2e2; }
        .ccm-separator { height: 1px; background: #eef0f3; margin: 5px 4px; }
    </style>
</head>
<body>
    <!-- ===== TOPBAR ===== -->
    <header class="topbar">
        <div class="logo">CloudHaux</div>
        <div class="search-container">
            <input type="search" placeholder="Search files...">
            <i class="fas fa-search search-icon"></i>
        </div>
        <div class="profile">
            <svg viewBox="0 0 24 24">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
        </div>
    </header>

    <!-- ===== LEFT NAV ===== -->
    <nav class="left_nav_bar">
        <button type="button" class="add_file_btn" id="addFileBtn">+ Add Files</button>
        <a href="#all_files">All Files</a>
        <a href="#recent_files">Recent</a>
        <a href="#favorites">Favorites</a>
        <a href="#trash">Trash</a>
    </nav>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="dashboard_content">
        <div class="main_content">
            <section class="images_viewer">
                <div class="images_header">
                    <div class="header-left">
                        <h2>Images</h2>
                    </div>
                    <div class="header-actions">
                        <button class="add-folder-btn" id="addFolderBtn" title="Create new folder">
                            <i class="fas fa-folder-plus"></i>
                        </button>
                    </div>
                </div>
                <div class="images_grid" id="imageGrid"></div>
            </section>
        </div>

        <!-- ===== RIGHT PANEL ===== -->
        <aside class="right_panel">
            <div class="button_group">
                <button class="category_btn images" onclick="window.location.href='images_page.html'">
                    <i class="fas fa-image"></i> Images
                </button>
                <button class="category_btn documents" onclick="window.location.href='documents_page.html'">
                    <i class="fas fa-file-alt"></i> Documents
                </button>
                <button class="category_btn media_files" onclick="window.location.href='media_page.html'">
                    <i class="fas fa-video"></i> Media
                </button>
                <button class="category_btn audio_files" onclick="window.location.href='audio_page.html'">
                    <i class="fas fa-music"></i> Audio
                </button>
                <button class="category_btn safe_vault" onclick="window.location.href='dashboard.html'">
                    <i class="fas fa-lock"></i> Safe Vault
                </button>
            </div>
        </aside>
    </main>

    <input type="file" id="fileInput" accept="image/*" multiple style="display:none;">

    <div class="custom-context-menu" id="customContextMenu">
        <div class="ccm-item" id="ccmShare"><i class="fas fa-share-alt"></i> Share</div>
        <div class="ccm-item" id="ccmMove"><i class="fas fa-folder-open"></i> Move to</div>
        <div class="ccm-separator"></div>
        <div class="ccm-item ccm-danger" id="ccmDelete"><i class="fas fa-trash"></i> Delete</div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        "use strict";

        const fileInput = document.getElementById("fileInput");
        const addBtn = document.getElementById("addFileBtn");
        const imageGrid = document.getElementById("imageGrid");
        const addFolderBtn = document.getElementById("addFolderBtn");

        if (!fileInput || !addBtn || !imageGrid || !addFolderBtn) {
            console.error('Elements not found');
            return;
        }

        let dragData = null;
        let ghostElement = null;

        const contextMenu = document.getElementById('customContextMenu');
        let contextTarget = null;
        const ccmDelete = document.getElementById('ccmDelete');

        function openContextMenu(x, y, targetCard) {
            contextTarget = targetCard;
            const maxX = window.innerWidth - 190;
            const maxY = window.innerHeight - 120;
            contextMenu.style.left = Math.min(x, maxX) + 'px';
            contextMenu.style.top = Math.min(y, maxY) + 'px';
            contextMenu.classList.add('open');
        }

        function closeContextMenu() {
            contextMenu.classList.remove('open');
            contextTarget = null;
        }

        function attachContextMenu(card) {
            card.addEventListener('contextmenu', function(e) {
                e.preventDefault();
                e.stopPropagation();
                openContextMenu(e.clientX, e.clientY, card);
            });
        }

        // DELETE action for images and folders
        ccmDelete.addEventListener('click', function(e) {
            e.stopPropagation();
            if (contextTarget) {
                // If it's an image card, revoke any object URLs if needed
                const img = contextTarget.querySelector('img');
                if (img && img.src && img.src.startsWith('blob:')) {
                    URL.revokeObjectURL(img.src);
                }
                contextTarget.style.transition = '0.2s';
                contextTarget.style.transform = 'scale(0.8)';
                contextTarget.style.opacity = '0';
                setTimeout(() => {
                    contextTarget.remove();
                }, 200);
            }
            closeContextMenu();
        });

        document.addEventListener('click', function(e) {
            if (!contextMenu.contains(e.target)) closeContextMenu();
        });
        document.addEventListener('scroll', closeContextMenu, true);
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeContextMenu();
        });

        // ----- render images (from FileList) -----
        function renderImages(files) {
            const imageFiles = Array.from(files).filter((file) =>
                file.type.startsWith("image/")
            );
            
            if (imageFiles.length === 0) {
                alert("Please select image files (JPEG, PNG, GIF, etc.)");
                return;
            }

            imageFiles.forEach((file) => {
                const reader = new FileReader();
                reader.onload = function (loadEvent) {
                    const imgSrc = loadEvent.target.result;
                    const card = document.createElement("div");
                    card.className = "image-card";
                    const img = document.createElement("img");
                    img.src = imgSrc;
                    img.alt = file.name || "image";
                    card.appendChild(img);
                    imageGrid.appendChild(card);
                    attachContextMenu(card);
                };
                reader.readAsDataURL(file);
            });
        }

        // ----- Drag and Drop Functions -----
        function createGhostElement(card) {
            const ghost = document.createElement('div');
            ghost.className = 'drag-ghost';
            ghost.style.position = 'fixed';
            ghost.style.pointerEvents = 'none';
            ghost.style.zIndex = '9999';
            
            const icon = document.createElement('i');
            icon.className = 'fas fa-folder';
            
            const nameSpan = document.createElement('span');
            const folderNameEl = card.querySelector('.folder-name');
            nameSpan.textContent = folderNameEl ? folderNameEl.textContent : 'Folder';
            
            ghost.appendChild(icon);
            ghost.appendChild(nameSpan);
            
            return ghost;
        }

        function isInsideGrid(grid, clientX, clientY) {
            const rect = grid.getBoundingClientRect();
            return clientX >= rect.left && clientX <= rect.right &&
                   clientY >= rect.top && clientY <= rect.bottom;
        }

        function findDropTarget(grid, clientX, clientY) {
            const cards = grid.querySelectorAll('.folder-card:not(.dragging)');
            for (let card of cards) {
                const rect = card.getBoundingClientRect();
                if (clientX >= rect.left && clientX <= rect.right &&
                    clientY >= rect.top && clientY <= rect.bottom) {
                    return card;
                }
            }
            return null;
        }

        function initDrag(card, e) {
            if (e.target.closest('.folder-name-input') || e.target.closest('.folder-name')) {
                return;
            }

            const startX = e.clientX || e.touches?.[0]?.clientX || 0;
            const startY = e.clientY || e.touches?.[0]?.clientY || 0;

            dragData = {
                card: card,
                startX: startX,
                startY: startY,
                offsetX: 0,
                offsetY: 0,
                isDragging: false
            };

            ghostElement = createGhostElement(card);
            document.body.appendChild(ghostElement);
            ghostElement.style.display = 'none';

            card.classList.add('dragging');
        }

        function moveDrag(e) {
            if (!dragData || !ghostElement) return;

            const clientX = e.clientX || e.touches?.[0]?.clientX || 0;
            const clientY = e.clientY || e.touches?.[0]?.clientY || 0;

            const dx = clientX - dragData.startX;
            const dy = clientY - dragData.startY;

            if (!dragData.isDragging && (Math.abs(dx) > 5 || Math.abs(dy) > 5)) {
                dragData.isDragging = true;
                const cardRect = dragData.card.getBoundingClientRect();
                ghostElement.style.display = 'flex';
                ghostElement.style.left = (clientX - cardRect.width / 2) + 'px';
                ghostElement.style.top = (clientY - 40) + 'px';
                
                document.querySelectorAll('.folder-card.drag-over').forEach(el => {
                    el.classList.remove('drag-over');
                });
            }

            if (dragData.isDragging) {
                ghostElement.style.left = (clientX - 62) + 'px';
                ghostElement.style.top = (clientY - 50) + 'px';

                if (isInsideGrid(imageGrid, clientX, clientY)) {
                    const target = findDropTarget(imageGrid, clientX, clientY);
                    document.querySelectorAll('.folder-card.drag-over').forEach(el => {
                        if (el !== target) el.classList.remove('drag-over');
                    });
                    if (target && target !== dragData.card) {
                        target.classList.add('drag-over');
                    }
                } else {
                    document.querySelectorAll('.folder-card.drag-over').forEach(el => {
                        el.classList.remove('drag-over');
                    });
                }
            }
        }

        function endDrag(e) {
            if (!dragData) return;

            const clientX = e.clientX || e.changedTouches?.[0]?.clientX || 0;
            const clientY = e.clientY || e.changedTouches?.[0]?.clientY || 0;

            document.querySelectorAll('.folder-card.drag-over').forEach(el => {
                el.classList.remove('drag-over');
            });

            if (dragData.isDragging) {
                const inside = isInsideGrid(imageGrid, clientX, clientY);
                const target = findDropTarget(imageGrid, clientX, clientY);

                if (inside && target && target !== dragData.card) {
                    const parent = imageGrid;
                    const card1 = dragData.card;
                    const card2 = target;
                    
                    const clone1 = card1.cloneNode(true);
                    const clone2 = card2.cloneNode(true);
                    
                    // Re-add event listeners for clone1
                    const nameSpan1 = clone1.querySelector('.folder-name');
                    if (nameSpan1) {
                        nameSpan1.addEventListener('click', function(e) {
                            e.stopPropagation();
                            makeFolderNameEditable(nameSpan1, clone1);
                        });
                    }
                    clone1.addEventListener('dblclick', function(e) {
                        const nameEl = this.querySelector('.folder-name');
                        if (nameEl) {
                            makeFolderNameEditable(nameEl, this);
                        }
                    });
                    
                    // Re-add drag events for clones
                    clone1.addEventListener('mousedown', function(e) {
                        initDrag(this, e);
                    });
                    clone1.addEventListener('touchstart', function(e) {
                        initDrag(this, e);
                    }, { passive: true });
                    
                    // Re-add event listeners for clone2
                    const nameSpan2 = clone2.querySelector('.folder-name');
                    if (nameSpan2) {
                        nameSpan2.addEventListener('click', function(e) {
                            e.stopPropagation();
                            makeFolderNameEditable(nameSpan2, clone2);
                        });
                    }
                    clone2.addEventListener('dblclick', function(e) {
                        const nameEl = this.querySelector('.folder-name');
                        if (nameEl) {
                            makeFolderNameEditable(nameEl, this);
                        }
                    });
                    
                    clone2.addEventListener('mousedown', function(e) {
                        initDrag(this, e);
                    });
                    clone2.addEventListener('touchstart', function(e) {
                        initDrag(this, e);
                    }, { passive: true });

                    // Re-attach context menu to clones
                    attachContextMenu(clone1);
                    attachContextMenu(clone2);
                    
                    const idx1 = Array.from(parent.children).indexOf(card1);
                    const idx2 = Array.from(parent.children).indexOf(card2);
                    
                    if (idx1 < idx2) {
                        parent.insertBefore(clone2, card1);
                        parent.insertBefore(clone1, card2);
                    } else {
                        parent.insertBefore(clone1, card2);
                        parent.insertBefore(clone2, card1);
                    }
                    
                    card1.remove();
                    card2.remove();
                }
            }

            if (ghostElement) {
                ghostElement.remove();
                ghostElement = null;
            }
            if (dragData.card) {
                dragData.card.classList.remove('dragging');
            }
            document.querySelectorAll('.folder-card.drag-over').forEach(el => {
                el.classList.remove('drag-over');
            });
            dragData = null;
        }

        // ----- Rename functionality -----
        function makeFolderNameEditable(folderNameSpan, folderCard) {
            const currentName = folderNameSpan.textContent;
            
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'folder-name-input';
            input.value = currentName;
            
            folderNameSpan.replaceWith(input);
            input.focus();
            input.select();

            function saveRename() {
                const newName = input.value.trim() || currentName;
                const newSpan = document.createElement('span');
                newSpan.className = 'folder-name';
                newSpan.textContent = newName;
                
                newSpan.addEventListener('click', function(e) {
                    e.stopPropagation();
                    makeFolderNameEditable(newSpan, folderCard);
                });
                
                folderCard.addEventListener('dblclick', function(e) {
                    const nameSpan = this.querySelector('.folder-name');
                    if (nameSpan) {
                        makeFolderNameEditable(nameSpan, this);
                    }
                });
                
                input.replaceWith(newSpan);
            }

            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    input.blur();
                } else if (e.key === 'Escape') {
                    const newSpan = document.createElement('span');
                    newSpan.className = 'folder-name';
                    newSpan.textContent = currentName;
                    
                    newSpan.addEventListener('click', function(e) {
                        e.stopPropagation();
                        makeFolderNameEditable(newSpan, folderCard);
                    });
                    
                    input.replaceWith(newSpan);
                }
            });

            input.addEventListener('blur', saveRename);
        }

        // ----- ADD FOLDER (creates a folder-card with rename and drag capability) -----
        function createFolderCard() {
            const folderCount = imageGrid.querySelectorAll('.folder-card').length + 1;
            const folderName = `Folder ${folderCount}`;

            const card = document.createElement('div');
            card.className = 'folder-card';
            
            const icon = document.createElement('i');
            icon.className = 'fas fa-folder';
            
            const nameSpan = document.createElement('span');
            nameSpan.className = 'folder-name';
            nameSpan.textContent = folderName;
            
            nameSpan.addEventListener('click', function(e) {
                e.stopPropagation();
                makeFolderNameEditable(nameSpan, card);
            });
            
            card.addEventListener('dblclick', function(e) {
                const nameEl = this.querySelector('.folder-name');
                if (nameEl) {
                    makeFolderNameEditable(nameEl, this);
                }
            });

            card.addEventListener('mousedown', function(e) {
                initDrag(this, e);
            });
            card.addEventListener('touchstart', function(e) {
                initDrag(this, e);
            }, { passive: true });

            card.appendChild(icon);
            card.appendChild(nameSpan);
            imageGrid.appendChild(card);
            attachContextMenu(card);
        }

        // Global drag event listeners
        document.addEventListener('mousemove', moveDrag);
        document.addEventListener('touchmove', moveDrag, { passive: true });
        document.addEventListener('mouseup', endDrag);
        document.addEventListener('touchend', endDrag);
        document.addEventListener('touchcancel', endDrag);

        // ----- event listeners -----
        addBtn.addEventListener("click", function (e) {
            e.stopPropagation();
            fileInput.click();
        });

        fileInput.addEventListener("change", function (e) {
            const files = e.target.files;
            if (!files || files.length === 0) return;
            renderImages(files);
            fileInput.value = "";
        });

        imageGrid.addEventListener("dragover", function (e) {
            e.preventDefault();
            this.style.backgroundColor = "#f0f4ff";
        });
        imageGrid.addEventListener("dragleave", function (e) {
            this.style.backgroundColor = "#f9fafb";
        });
        imageGrid.addEventListener("drop", function (e) {
            e.preventDefault();
            this.style.backgroundColor = "#f9fafb";
            const files = e.dataTransfer.files;
            if (files && files.length > 0) {
                renderImages(files);
            }
        });

        addFolderBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            createFolderCard();
        });

        // Seed with a sample folder
        setTimeout(() => { createFolderCard(); }, 100);
    });
    </script>
</body>
</html>
