<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudHaux · Documents</title>
    <link rel="stylesheet" href="../static/css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* ----- DOCUMENTS PAGE SPECIFIC STYLES ----- */
        .documents_viewer {
            width: 100%;
            min-height: 400px;
            padding: 30px;
            border: 1px solid #d9d9d9;
            border-radius: 16px;
            background: white;
            display: flex;
            flex-direction: column;
        }

        .documents_header {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: none;
        }

        .documents_header h2 {
            font-size: 1.3rem;
            color: #111827;
            text-align: center;
        }

        .documents_grid {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: flex-start;
            justify-content: flex-start;
            background: #f9fafb;
            border-radius: 12px;
            padding: 24px;
            min-height: 400px;
            border: 1px solid #e5e7eb;
            transition: 0.2s;
        }

        /* Empty state - NO TEXT */
        .documents_grid:empty {
            /* No content, just empty */
        }

        .document-card {
            width: 160px;
            padding: 16px;
            border-radius: 12px;
            background: white;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: default;
        }

        .document-card:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 14px rgba(0,0,0,0.08);
        }

        .document-card i {
            font-size: 48px;
            color: #7c3aed;
        }

        .document-card .doc-name {
            font-size: 12px;
            color: #374151;
            text-align: center;
            word-break: break-all;
            max-width: 140px;
        }

        .document-card .doc-size {
            font-size: 11px;
            color: #6b7280;
        }

        @media (max-width: 768px) {
            .documents_grid {
                min-height: 300px;
                padding: 16px;
            }
            .document-card {
                width: 130px;
                padding: 12px;
            }
            .document-card i {
                font-size: 36px;
            }
        }

        @media (max-width: 480px) {
            .documents_grid {
                min-height: 200px;
                gap: 12px;
                padding: 12px;
            }
            .documents_header h2 {
                font-size: 1rem;
            }
            .document-card {
                width: 100px;
                padding: 10px;
            }
            .document-card i {
                font-size: 28px;
            }
            .document-card .doc-name {
                font-size: 10px;
            }
        }
    </style>
</head>
<body>
    <!-- ===== TOPBAR ===== -->
    <header class="topbar">
        <div class="logo">CloudHaux</div>
        <div class="search-container">
            <input type="search" placeholder="Search files...">
            <i class="fas fa-search search-icon"></i>
        </div>
        <div class="profile">
            <svg viewBox="0 0 24 24">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
        </div>
    </header>

    <!-- ===== LEFT NAV ===== -->
    <nav class="left_nav_bar">
        <button type="button" class="add_file_btn" id="addFileBtn">+ Add Files</button>
        <a href="#all_files">All Files</a>
        <a href="#recent_files">Recent</a>
        <a href="#favorites">Favorites</a>
        <a href="#trash">Trash</a>
    </nav>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="dashboard_content">
        <div class="main_content">
            <section class="documents_viewer">
                <div class="documents_header">
                    <h2>Documents</h2>
                </div>
                <div class="documents_grid" id="documentsGrid"></div>
            </section>
        </div>

        <!-- ===== RIGHT PANEL ===== -->
        <aside class="right_panel">
            <div class="button_group">
                <button class="category_btn images" onclick="window.location.href='images_page.html'">
                    <i class="fas fa-image"></i> Images
                </button>
                <button class="category_btn documents" onclick="window.location.href='documents_page.html'">
                    <i class="fas fa-file-alt"></i> Documents
                </button>
                <button class="category_btn media_files" onclick="window.location.href='media_page.html'">
                    <i class="fas fa-video"></i> Media
                </button>
                <button class="category_btn audio_files" onclick="window.location.href='audio_page.html'">
                    <i class="fas fa-music"></i> Audio
                </button>
                <button class="category_btn safe_vault" onclick="window.location.href='dashboard.html'">
                    <i class="fas fa-lock"></i> Safe Vault
                </button>
            </div>
        </aside>
    </main>

    <!-- hidden file input -->
    <input type="file" id="fileInput" accept=".pdf,.doc,.docx,.txt,.xls,.xlsx,.ppt,.pptx" multiple style="display:none;">

    <!-- ===== JAVASCRIPT - Document upload functionality ===== -->
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        "use strict";

        const fileInput = document.getElementById("fileInput");
        const addBtn = document.getElementById("addFileBtn");
        const documentsGrid = document.getElementById("documentsGrid");

        if (!fileInput || !addBtn || !documentsGrid) {
            console.error('Elements not found');
            return;
        }

        // Function to format file size
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // Get icon for document type
        function getDocumentIcon(fileName) {
            const ext = fileName.split('.').pop().toLowerCase();
            const icons = {
                'pdf': 'fa-file-pdf',
                'doc': 'fa-file-word',
                'docx': 'fa-file-word',
                'txt': 'fa-file-alt',
                'xls': 'fa-file-excel',
                'xlsx': 'fa-file-excel',
                'ppt': 'fa-file-powerpoint',
                'pptx': 'fa-file-powerpoint',
                'zip': 'fa-file-archive',
                'rar': 'fa-file-archive',
                '7z': 'fa-file-archive'
            };
            return icons[ext] || 'fa-file';
        }

        function renderDocuments(files) {
            const documentFiles = Array.from(files);
            
            if (documentFiles.length === 0) {
                alert("Please select documents to upload");
                return;
            }

            documentFiles.forEach((file) => {
                const card = document.createElement("div");
                card.className = "document-card";
                
                const icon = document.createElement("i");
                icon.className = getDocumentIcon(file.name);
                
                const name = document.createElement("div");
                name.className = "doc-name";
                name.textContent = file.name;
                
                const size = document.createElement("div");
                size.className = "doc-size";
                size.textContent = formatFileSize(file.size);
                
                card.appendChild(icon);
                card.appendChild(name);
                card.appendChild(size);
                documentsGrid.appendChild(card);
            });
        }

        addBtn.addEventListener("click", function (e) {
            e.stopPropagation();
            fileInput.click();
        });

        fileInput.addEventListener("change", function (e) {
            const files = e.target.files;
            if (!files || files.length === 0) return;
            renderDocuments(files);
            fileInput.value = "";
        });

        documentsGrid.addEventListener("dragover", function (e) {
            e.preventDefault();
            this.style.backgroundColor = "#f0f4ff";
        });
        documentsGrid.addEventListener("dragleave", function (e) {
            this.style.backgroundColor = "#f9fafb";
        });
        documentsGrid.addEventListener("drop", function (e) {
            e.preventDefault();
            this.style.backgroundColor = "#f9fafb";
            const files = e.dataTransfer.files;
            if (files && files.length > 0) {
                renderDocuments(files);
            }
        });
    });
    </script>
</body>
</html>
