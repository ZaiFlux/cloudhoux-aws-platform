<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudHaux · Media</title>
    <link rel="stylesheet" href="../static/css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* ----- MEDIA PAGE SPECIFIC STYLES ----- */
        .media_viewer {
            width: 100%;
            min-height: 400px;
            padding: 30px;
            border: 1px solid #d9d9d9;
            border-radius: 16px;
            background: white;
            display: flex;
            flex-direction: column;
        }

        .media_header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: none;
            flex-wrap: wrap;
            gap: 12px;
        }

        .media_header h2 {
            font-size: 1.3rem;
            color: #111827;
            margin: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ADD FOLDER BUTTON (icon only) - matches images page */
        .add-folder-btn {
            background: transparent;
            border: none;
            font-size: 1.8rem;
            color: #1e293b;
            cursor: pointer;
            padding: 0 6px;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            width: 44px;
            height: 44px;
            background: #f1f5f9;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }

        .add-folder-btn i {
            font-size: 1.6rem;
            color: #334155;
        }

        .add-folder-btn:hover {
            background: #e2e8f0;
            transform: scale(1.04);
            color: #0f172a;
        }

        .add-folder-btn:active {
            transform: scale(0.94);
        }

        .media_grid {
            flex: 1;
            display: block;              /* free-position: cards are absolutely positioned */
            background: #f9fafb;
            border-radius: 12px;
            padding: 24px;
            min-height: 400px;
            border: 1px solid #e5e7eb;
            transition: 0.2s;
            position: relative;
            overflow: hidden;
        }

        /* ----- FOLDER CARD — free positioned ----- */
        .folder-card {
            position: absolute;
            width: 125px;
            height: 100px;
            border-radius: 12px;
            background: #eef2f6;
            border: 1px solid #d1d9e6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #1e293b;
            font-size: 0.85rem;
            font-weight: 500;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            cursor: grab;
            gap: 4px;
            user-select: none;
            touch-action: none;
            transition: box-shadow 0.2s, transform 0.2s, border-color 0.2s;
            z-index: 1;
        }

        .folder-card.dragging {
            opacity: 0.9;
            transform: scale(1.05);
            z-index: 1000;
            cursor: grabbing;
            box-shadow: 0 12px 30px rgba(0,0,0,0.15);
            border-color: #3b82f6;
        }

        .folder-card.drag-over {
            border-color: #3b82f6;
            background: #dbeafe;
        }

        .folder-card i {
            font-size: 2.8rem;
            color: #475569;
            margin-bottom: 2px;
            pointer-events: none;
        }

        .folder-name {
            background: #dce3ec;
            padding: 2px 14px;
            border-radius: 30px;
            font-size: 0.7rem;
            color: #1e293b;
            letter-spacing: 0.3px;
            cursor: pointer;
            transition: 0.2s;
            user-select: none;
            min-width: 40px;
            text-align: center;
            display: inline-block;
            pointer-events: auto;
        }

        .folder-name:hover {
            background: #c8d2e0;
            transform: scale(1.05);
        }

        .folder-name-input {
            background: white;
            border: 2px solid #3b82f6;
            padding: 2px 10px;
            border-radius: 30px;
            font-size: 0.7rem;
            color: #1e293b;
            outline: none;
            min-width: 60px;
            text-align: center;
            font-family: inherit;
            font-weight: 500;
        }

        .folder-name-input:focus {
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .folder-card:hover {
            background: #e2e8f0;
            border-color: #94a3b8;
        }

        /* ----- media card — free positioned ----- */
        .media-card {
            position: absolute;
            width: 220px;
            padding: 12px;
            border-radius: 12px;
            background: white;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: grab;
            user-select: none;
            touch-action: none;
            transition: box-shadow 0.2s, transform 0.2s, border-color 0.2s;
            z-index: 1;
        }

        .media-card:hover {
            box-shadow: 0 6px 14px rgba(0,0,0,0.08);
        }

        .media-card.dragging {
            opacity: 0.9;
            transform: scale(1.05);
            z-index: 1000;
            cursor: grabbing;
            box-shadow: 0 12px 30px rgba(0,0,0,0.15);
            border-color: #3b82f6;
        }

        .media-card.drag-over {
            border-color: #3b82f6;
            background: #dbeafe;
        }

        .media-card .media-icon {
            font-size: 56px;
            color: #dc2626;
        }

        .media-card .media-icon.audio-icon {
            color: #059669;
        }

        .media-card .media-icon.video-icon {
            color: #dc2626;
        }

        .media-card .media-video-wrapper {
            width: 100%;
            height: 130px;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .media-card .media-video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 8px;
        }

        .media-card .media-audio-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 8px 0;
        }

        .media-card .media-audio-wrapper audio {
            width: 100%;
            height: 36px;
            border-radius: 8px;
        }

        .media-card .media-name {
            font-size: 13px;
            color: #374151;
            text-align: center;
            word-break: break-all;
            max-width: 190px;
            font-weight: 500;
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 4px;
            transition: 0.2s;
        }

        .media-card .media-name:hover {
            background: #f1f5f9;
        }

        .media-name-input {
            font-size: 13px;
            color: #1e293b;
            text-align: center;
            width: 100%;
            max-width: 190px;
            font-weight: 500;
            padding: 4px 8px;
            border: 2px solid #3b82f6;
            border-radius: 6px;
            outline: none;
            font-family: inherit;
            box-sizing: border-box;
        }

        .media-name-input:focus {
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .media-card .media-size {
            font-size: 11px;
            color: #6b7280;
        }

        /* Drag ghost element */
        .drag-ghost {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.85;
            transform: scale(1.08);
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            border-color: #3b82f6;
            background: #eef2f6;
            border-radius: 12px;
            padding: 10px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .drag-ghost i {
            font-size: 2.8rem;
            color: #475569;
        }

        .drag-ghost span {
            background: #dce3ec;
            padding: 2px 14px;
            border-radius: 30px;
            font-size: 0.7rem;
            color: #1e293b;
        }

        .drag-ghost.media-ghost {
            background: white;
            border: 1px solid #3b82f6;
            padding: 8px 14px;
            border-radius: 10px;
            max-width: 180px;
            flex-direction: row;
            gap: 8px;
        }

        .drag-ghost.media-ghost i {
            font-size: 1.4rem;
            color: #dc2626;
        }

        .drag-ghost.media-ghost span {
            background: transparent;
            padding: 0;
            font-size: 0.7rem;
            border-radius: 0;
            color: #1e293b;
            max-width: 130px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        @media (max-width: 768px) {
            .media_grid {
                min-height: 300px;
                padding: 16px;
            }
            .media-card {
                width: 170px;
                padding: 10px;
            }
            .media-card .media-video-wrapper {
                height: 100px;
            }
            .folder-card {
                width: 100px;
                height: 100px;
            }
            .add-folder-btn {
                width: 38px;
                height: 38px;
                font-size: 1.4rem;
            }
            .add-folder-btn i {
                font-size: 1.3rem;
            }
        }

        @media (max-width: 480px) {
            .media_grid {
                min-height: 200px;
                padding: 12px;
            }
            .media_header h2 {
                font-size: 1rem;
            }
            .media-card {
                width: 140px;
                padding: 8px;
            }
            .media-card .media-video-wrapper {
                height: 80px;
            }
            .media-card .media-name {
                font-size: 11px;
                max-width: 120px;
            }
            .folder-card {
                width: 80px;
                height: 80px;
            }
            .folder-card i {
                font-size: 2rem;
            }
            .add-folder-btn {
                width: 34px;
                height: 34px;
            }
            .add-folder-btn i {
                font-size: 1.1rem;
            }
        }

        .custom-context-menu {
            position: fixed;
            z-index: 10000;
            min-width: 180px;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            padding: 6px;
            display: none;
        }
        .custom-context-menu.open { display: block; }
        .ccm-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 12px;
            border-radius: 7px;
            font-size: 0.85rem;
            color: #1f2937;
            cursor: pointer;
        }
        .ccm-item i { width: 16px; text-align: center; color: #475569; }
        .ccm-item:hover { background: #f1f5f9; }
        .ccm-item.ccm-danger { color: #dc2626; }
        .ccm-item.ccm-danger i { color: #dc2626; }
        .ccm-item.ccm-danger:hover { background: #fee2e2; }
        .ccm-separator { height: 1px; background: #eef0f3; margin: 5px 4px; }

        /* search highlight */
        .highlight-match {
            background-color: yellow !important;
            color: #000 !important;
            border-radius: 2px;
            padding: 0 2px;
        }
        .no-match-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 16px 32px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            border: 1px solid #e5e7eb;
            color: #6b7280;
            font-size: 1rem;
            font-weight: 500;
            display: none;
            z-index: 50;
            pointer-events: none;
        }
        .no-match-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <!-- ===== TOPBAR ===== -->
    <header class="topbar">
        <div class="logo">CloudHaux</div>
        <div class="search-container">
            <input type="search" placeholder="Search files..." id="globalSearch">
            <i class="fas fa-search search-icon"></i>
        </div>
        <div class="profile">
            <svg viewBox="0 0 24 24">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
        </div>
    </header>

    <!-- ===== LEFT NAV ===== -->
    <nav class="left_nav_bar">
        <button type="button" class="add_file_btn" id="addFileBtn">+ Add Files</button>
        <a href="#all_files">All Files</a>
        <a href="#recent_files">Recent</a>
        <a href="#favorites">Favorites</a>
        <a href="#trash">Trash</a>
    </nav>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="dashboard_content">
        <div class="main_content">
            <section class="media_viewer">
                <div class="media_header">
                    <div class="header-left">
                        <h2>Media</h2>
                    </div>
                    <div class="header-actions">
                        <button class="add-folder-btn" id="addFolderBtn" title="Create new folder">
                            <i class="fas fa-folder-plus"></i>
                        </button>
                    </div>
                </div>
                <div class="media_grid" id="mediaGrid">
                    <div class="no-match-message" id="noMatchMessage">No file match</div>
                </div>
            </section>
        </div>

        <!-- ===== RIGHT PANEL ===== -->
        <aside class="right_panel">
            <div class="button_group">
                <button class="category_btn images" onclick="window.location.href='images_page.html'">
                    <i class="fas fa-image"></i> Images
                </button>
                <button class="category_btn documents" onclick="window.location.href='documents_page.html'">
                    <i class="fas fa-file-alt"></i> Documents
                </button>
                <button class="category_btn media_files" onclick="window.location.href='media_page.html'">
                    <i class="fas fa-video"></i> Media
                </button>
                <button class="category_btn audio_files" onclick="window.location.href='audio_page.html'">
                    <i class="fas fa-music"></i> Audio
                </button>
                <button class="category_btn safe_vault" onclick="window.location.href='dashboard.html'">
                    <i class="fas fa-lock"></i> Safe Vault
                </button>
            </div>
        </aside>
    </main>

    <!-- hidden file input -->
    <input type="file" id="fileInput" accept=".mp4,.mov,.avi,.mkv,.mp3,.wav,.ogg,.m4a" multiple style="display:none;">

    <div class="custom-context-menu" id="customContextMenu">
        <div class="ccm-item" id="ccmShare"><i class="fas fa-share-alt"></i> Share</div>
        <div class="ccm-item" id="ccmMove"><i class="fas fa-folder-open"></i> Move to</div>
        <div class="ccm-separator"></div>
        <div class="ccm-item ccm-danger" id="ccmDelete"><i class="fas fa-trash"></i> Delete</div>
    </div>

    <!-- ===== JAVASCRIPT ===== -->
    <script>
document.addEventListener('DOMContentLoaded', function() {
    "use strict";

    const fileInput = document.getElementById("fileInput");
    const addBtn = document.getElementById("addFileBtn");
    const mediaGrid = document.getElementById("mediaGrid");
    const addFolderBtn = document.getElementById("addFolderBtn");
    const searchInput = document.getElementById("globalSearch");
    const noMatchMsg = document.getElementById("noMatchMessage");

    if (!fileInput || !addBtn || !mediaGrid || !addFolderBtn || !searchInput) {
        console.error('Elements not found');
        return;
    }

    let dragData = null;
    let ghostElement = null;

    const contextMenu = document.getElementById('customContextMenu');
    let contextTarget = null;
    const ccmDelete = document.getElementById('ccmDelete');

    // ---------- Free-position layout tracking ----------
    const GRID_PADDING = 24;
    const CARD_GAP = 20;

    // Rectangle overlap check
    function rectsOverlap(a, b) {
        return !(a.x + a.w <= b.x || a.x >= b.x + b.w ||
                 a.y + a.h <= b.y || a.y >= b.y + b.h);
    }

    // Get the actual current position/size of a card
    function cardRect(card) {
        return {
            x: parseFloat(card.style.left) || 0,
            y: parseFloat(card.style.top) || 0,
            w: card.offsetWidth,
            h: card.offsetHeight
        };
    }

    // Find a free spot that does NOT overlap any existing card, optionally ignoring a card
    function findFreeSpot(cardW, cardH, ignoreCard) {
        const gridRect = mediaGrid.getBoundingClientRect();
        const placed = Array.from(mediaGrid.querySelectorAll('.folder-card, .media-card'))
            .filter(el => el !== ignoreCard)
            .map(el => cardRect(el));

        const maxCols = Math.max(1, Math.floor((gridRect.width - GRID_PADDING * 2 + CARD_GAP) / (cardW + CARD_GAP)));
        const stepX = cardW + CARD_GAP;
        const stepY = cardH + CARD_GAP;
        const startX = GRID_PADDING;
        const startY = GRID_PADDING;

        for (let row = 0; row < 100; row++) {
            for (let col = 0; col < maxCols; col++) {
                const x = startX + col * stepX;
                const y = startY + row * stepY;
                const test = { x, y, w: cardW, h: cardH };
                const overlaps = placed.some(p => rectsOverlap(test, p));
                if (!overlaps) return { x, y };
            }
        }
        return { x: startX, y: startY };
    }

    // Find the nearest free spot to a given point (so pushed cards land close to where they were)
    function findNearestFreeSpot(cardW, cardH, preferredX, preferredY, ignoreCard) {
        const placed = Array.from(mediaGrid.querySelectorAll('.folder-card, .media-card'))
            .filter(el => el !== ignoreCard)
            .map(el => cardRect(el));

        // Try the preferred spot first
        const test0 = { x: preferredX, y: preferredY, w: cardW, h: cardH };
        if (!placed.some(p => rectsOverlap(test0, p))) {
            return { x: preferredX, y: preferredY };
        }

        // Otherwise spiral outward from the preferred position
        const step = 20;
        for (let radius = step; radius < 2000; radius += step) {
            // check cardinal + diagonal directions
            const candidates = [
                { x: preferredX + radius, y: preferredY },
                { x: preferredX - radius, y: preferredY },
                { x: preferredX, y: preferredY + radius },
                { x: preferredX, y: preferredY - radius },
                { x: preferredX + radius, y: preferredY + radius },
                { x: preferredX - radius, y: preferredY - radius },
                { x: preferredX + radius, y: preferredY - radius },
                { x: preferredX - radius, y: preferredY + radius }
            ];
            for (const c of candidates) {
                const x = Math.max(0, c.x);
                const y = Math.max(0, c.y);
                const test = { x, y, w: cardW, h: cardH };
                if (!placed.some(p => rectsOverlap(test, p))) {
                    return { x, y };
                }
            }
        }
        return { x: preferredX, y: preferredY };
    }

    function growGridToFit(bottomY) {
        const minH = Math.max(400, bottomY + GRID_PADDING);
        mediaGrid.style.minHeight = minH + 'px';
    }

    function placeCard(card, x, y) {
        card.style.left = x + 'px';
        card.style.top = y + 'px';
        const bottom = y + card.offsetHeight;
        if (bottom > mediaGrid.clientHeight) {
            growGridToFit(bottom);
        }
    }

    // ---------- Auto-push overlapping cards ----------
    // After a card lands at a position, any card that overlaps it gets pushed
    // to the nearest free spot.
    function pushOverlappingCards(movedCard) {
        const movedRect = cardRect(movedCard);
        const allCards = Array.from(mediaGrid.querySelectorAll('.folder-card, .media-card'))
            .filter(el => el !== movedCard);

        let anyPushed = false;
        allCards.forEach(other => {
            const otherRect = cardRect(other);
            if (rectsOverlap(movedRect, otherRect)) {
                // Find a new spot for this overlapping card, close to its current position,
                // and ignoring the moved card (so it doesn't re-collide with it)
                const spot = findNearestFreeSpot(
                    other.offsetWidth,
                    other.offsetHeight,
                    otherRect.x,
                    otherRect.y,
                    other  // ignore self when testing
                );
                placeCard(other, spot.x, spot.y);
                anyPushed = true;
            }
        });
        return anyPushed;
    }

    // ---------- Context menu ----------
    function openContextMenu(x, y, targetCard) {
        contextTarget = targetCard;
        const maxX = window.innerWidth - 190;
        const maxY = window.innerHeight - 120;
        contextMenu.style.left = Math.min(x, maxX) + 'px';
        contextMenu.style.top = Math.min(y, maxY) + 'px';
        contextMenu.classList.add('open');
    }

    function closeContextMenu() {
        contextMenu.classList.remove('open');
        contextTarget = null;
    }

    function attachContextMenu(card) {
        card.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            e.stopPropagation();
            openContextMenu(e.clientX, e.clientY, card);
        });
    }

    ccmDelete.addEventListener('click', function(e) {
        e.stopPropagation();
        if (contextTarget) {
            const video = contextTarget.querySelector('video');
            const audio = contextTarget.querySelector('audio');
            if (video && video.src && video.src.startsWith('blob:')) {
                URL.revokeObjectURL(video.src);
            }
            if (audio && audio.src && audio.src.startsWith('blob:')) {
                URL.revokeObjectURL(audio.src);
            }
            contextTarget.style.transition = '0.2s';
            contextTarget.style.transform = 'scale(0.8)';
            contextTarget.style.opacity = '0';
            setTimeout(() => {
                contextTarget.remove();
                performSearch(searchInput.value);
            }, 200);
        }
        closeContextMenu();
    });

    document.addEventListener('click', function(e) {
        if (!contextMenu.contains(e.target)) closeContextMenu();
    });
    document.addEventListener('scroll', closeContextMenu, true);
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeContextMenu();
    });

    // ---------- Helpers ----------
    function formatFileSize(bytes) {
        if (bytes === 0) return '0 Bytes';
        const k = 1024;
        const sizes = ['Bytes', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function getMediaIcon(fileName) {
        const ext = fileName.split('.').pop().toLowerCase();
        const videoExts = ['mp4', 'mov', 'avi', 'mkv', 'webm', 'flv', 'wmv'];
        const audioExts = ['mp3', 'wav', 'ogg', 'm4a', 'flac', 'aac', 'wma'];
        if (videoExts.includes(ext)) return { icon: 'fa-video', type: 'video', cssClass: 'video-icon' };
        if (audioExts.includes(ext)) return { icon: 'fa-music', type: 'audio', cssClass: 'audio-icon' };
        return { icon: 'fa-file-video', type: 'media', cssClass: '' };
    }

    // ---------- Rename ----------
    function makeMediaNameEditable(nameEl, mediaCard) {
        const currentName = nameEl.textContent;
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'media-name-input';
        input.value = currentName;
        nameEl.replaceWith(input);
        input.focus();
        input.select();

        function saveRename() {
            const newName = input.value.trim() || currentName;
            const newDiv = document.createElement('div');
            newDiv.className = 'media-name';
            newDiv.textContent = newName;
            newDiv.addEventListener('click', function(e) {
                e.stopPropagation();
                makeMediaNameEditable(newDiv, mediaCard);
            });
            input.replaceWith(newDiv);
            performSearch(searchInput.value);
        }

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
            else if (e.key === 'Escape') {
                const newDiv = document.createElement('div');
                newDiv.className = 'media-name';
                newDiv.textContent = currentName;
                newDiv.addEventListener('click', function(ev) {
                    ev.stopPropagation();
                    makeMediaNameEditable(newDiv, mediaCard);
                });
                input.replaceWith(newDiv);
            }
        });
        input.addEventListener('blur', saveRename);
    }

    function makeFolderNameEditable(folderNameSpan, folderCard) {
        const currentName = folderNameSpan.textContent;
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'folder-name-input';
        input.value = currentName;
        folderNameSpan.replaceWith(input);
        input.focus();
        input.select();

        function saveRename() {
            const newName = input.value.trim() || currentName;
            const newSpan = document.createElement('span');
            newSpan.className = 'folder-name';
            newSpan.textContent = newName;
            newSpan.addEventListener('click', function(e) {
                e.stopPropagation();
                makeFolderNameEditable(newSpan, folderCard);
            });
            input.replaceWith(newSpan);
            performSearch(searchInput.value);
        }

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
            else if (e.key === 'Escape') {
                const newSpan = document.createElement('span');
                newSpan.className = 'folder-name';
                newSpan.textContent = currentName;
                newSpan.addEventListener('click', function(ev) {
                    ev.stopPropagation();
                    makeFolderNameEditable(newSpan, folderCard);
                });
                input.replaceWith(newSpan);
            }
        });
        input.addEventListener('blur', saveRename);
    }

    // ---------- Drag ghosts ----------
    function createFolderGhostElement(card) {
        const ghost = document.createElement('div');
        ghost.className = 'drag-ghost';
        ghost.style.position = 'fixed';
        ghost.style.pointerEvents = 'none';
        ghost.style.zIndex = '9999';
        const icon = document.createElement('i');
        icon.className = 'fas fa-folder';
        const nameSpan = document.createElement('span');
        const folderNameEl = card.querySelector('.folder-name');
        nameSpan.textContent = folderNameEl ? folderNameEl.textContent : 'Folder';
        ghost.appendChild(icon);
        ghost.appendChild(nameSpan);
        return ghost;
    }

    function createMediaGhostElement(card) {
        const ghost = document.createElement('div');
        ghost.className = 'drag-ghost media-ghost';
        ghost.style.position = 'fixed';
        ghost.style.pointerEvents = 'none';
        ghost.style.zIndex = '9999';
        const nameEl = card.querySelector('.media-name');
        const nameText = nameEl ? nameEl.textContent : 'Media';
        let iconClass = 'fa-file-video';
        if (card.querySelector('.media-audio-wrapper')) iconClass = 'fa-music';
        const icon = document.createElement('i');
        icon.className = 'fas ' + iconClass;
        const nameSpan = document.createElement('span');
        nameSpan.textContent = nameText;
        ghost.appendChild(icon);
        ghost.appendChild(nameSpan);
        return ghost;
    }

    function createGhostElement(card) {
        if (card.classList.contains('folder-card')) return createFolderGhostElement(card);
        return createMediaGhostElement(card);
    }

    function isInsideGrid(grid, clientX, clientY) {
        const rect = grid.getBoundingClientRect();
        return clientX >= rect.left && clientX <= rect.right &&
               clientY >= rect.top && clientY <= rect.bottom;
    }

    // ---------- Drag lifecycle ----------
    function initDrag(card, e) {
        if (e.target.closest('.folder-name-input') || e.target.closest('.folder-name') ||
            e.target.closest('.media-name-input') || e.target.closest('.media-name')) {
            return;
        }
        if (e.target.closest('video') || e.target.closest('audio')) return;

        const startX = e.clientX || e.touches?.[0]?.clientX || 0;
        const startY = e.clientY || e.touches?.[0]?.clientY || 0;

        dragData = {
            card: card,
            startX: startX,
            startY: startY,
            startLeft: parseFloat(card.style.left) || 0,
            startTop: parseFloat(card.style.top) || 0,
            isDragging: false
        };

        ghostElement = createGhostElement(card);
        document.body.appendChild(ghostElement);
        ghostElement.style.display = 'none';

        card.classList.add('dragging');
        card.style.zIndex = '1000';
    }

    function moveDrag(e) {
        if (!dragData || !ghostElement) return;

        const clientX = e.clientX || e.touches?.[0]?.clientX || 0;
        const clientY = e.clientY || e.touches?.[0]?.clientY || 0;

        const dx = clientX - dragData.startX;
        const dy = clientY - dragData.startY;

        if (!dragData.isDragging && (Math.abs(dx) > 5 || Math.abs(dy) > 5)) {
            dragData.isDragging = true;
            ghostElement.style.display = 'flex';
            ghostElement.style.left = (clientX - 60) + 'px';
            ghostElement.style.top = (clientY - 50) + 'px';
        }

        if (dragData.isDragging) {
            ghostElement.style.left = (clientX - 60) + 'px';
            ghostElement.style.top = (clientY - 50) + 'px';

            const newLeft = dragData.startLeft + dx;
            const newTop  = dragData.startTop + dy;

            dragData.card.style.left = Math.max(0, newLeft) + 'px';
            dragData.card.style.top  = Math.max(0, newTop) + 'px';

            const cardH = dragData.card.offsetHeight;
            if (newTop + cardH + GRID_PADDING > mediaGrid.clientHeight) {
                growGridToFit(newTop + cardH);
            }
        }
    }

    function endDrag(e) {
        if (!dragData) return;

        const clientX = e.clientX || e.changedTouches?.[0]?.clientX || 0;
        const clientY = e.clientY || e.changedTouches?.[0]?.clientY || 0;

        if (dragData.isDragging) {
            const card = dragData.card;
            const inside = isInsideGrid(mediaGrid, clientX, clientY);

            if (inside) {
                // Clamp within grid horizontally
                const gridW = mediaGrid.clientWidth;
                const cardW = card.offsetWidth;
                let left = parseFloat(card.style.left) || 0;
                let top  = parseFloat(card.style.top)  || 0;

                left = Math.max(0, Math.min(left, gridW - cardW));
                top  = Math.max(0, top);

                card.style.left = left + 'px';
                card.style.top  = top  + 'px';

                // **Push any overlapping cards out of the way**
                pushOverlappingCards(card);

                growGridToFit(top + card.offsetHeight);
            } else {
                // Dropped outside → snap back
                card.style.left = dragData.startLeft + 'px';
                card.style.top  = dragData.startTop  + 'px';
            }
        }

        if (ghostElement) {
            ghostElement.remove();
            ghostElement = null;
        }
        if (dragData.card) {
            dragData.card.classList.remove('dragging');
            dragData.card.style.zIndex = '';
        }
        dragData = null;
    }

    // ---------- Render media files ----------
    function renderMediaFiles(files) {
        const mediaFiles = Array.from(files);
        if (mediaFiles.length === 0) {
            alert("Please select media files (videos or audio)");
            return;
        }

        mediaFiles.forEach((file) => {
            const card = document.createElement("div");
            card.className = "media-card";

            const mediaInfo = getMediaIcon(file.name);

            if (mediaInfo.type === 'video') {
                const videoWrapper = document.createElement("div");
                videoWrapper.className = "media-video-wrapper";
                const video = document.createElement("video");
                video.src = URL.createObjectURL(file);
                video.controls = true;
                video.preload = "metadata";
                video.muted = true;
                videoWrapper.appendChild(video);
                card.appendChild(videoWrapper);
            } else if (mediaInfo.type === 'audio') {
                const audioWrapper = document.createElement("div");
                audioWrapper.className = "media-audio-wrapper";
                const audioIcon = document.createElement("i");
                audioIcon.className = "fas fa-music";
                audioIcon.style.fontSize = "42px";
                audioIcon.style.color = "#059669";
                const audio = document.createElement("audio");
                audio.src = URL.createObjectURL(file);
                audio.controls = true;
                audio.preload = "metadata";
                audioWrapper.appendChild(audioIcon);
                audioWrapper.appendChild(audio);
                card.appendChild(audioWrapper);
            } else {
                const icon = document.createElement("div");
                icon.className = `media-icon ${mediaInfo.cssClass}`;
                icon.innerHTML = `<i class="fas ${mediaInfo.icon}"></i>`;
                card.appendChild(icon);
            }

            const name = document.createElement("div");
            name.className = "media-name";
            name.textContent = file.name;
            name.addEventListener('click', function(e) {
                e.stopPropagation();
                makeMediaNameEditable(name, card);
            });

            card.addEventListener('dblclick', function(e) {
                if (e.target.closest('video') || e.target.closest('audio')) return;
                const nameEl = this.querySelector('.media-name');
                if (nameEl) makeMediaNameEditable(nameEl, this);
            });

            const size = document.createElement("div");
            size.className = "media-size";
            size.textContent = formatFileSize(file.size);

            card.appendChild(name);
            card.appendChild(size);

            mediaGrid.appendChild(card);

            requestAnimationFrame(() => {
                const spot = findFreeSpot(card.offsetWidth, card.offsetHeight);
                placeCard(card, spot.x, spot.y);
            });

            card.addEventListener('mousedown', function(e) {
                initDrag(this, e);
            });
            card.addEventListener('touchstart', function(e) {
                initDrag(this, e);
            }, { passive: true });

            attachContextMenu(card);
        });

        performSearch(searchInput.value);
    }

    // ---------- Add folder ----------
    function createFolderCard() {
        const folderCount = mediaGrid.querySelectorAll('.folder-card').length + 1;
        const folderName = `Folder ${folderCount}`;

        const card = document.createElement('div');
        card.className = 'folder-card';

        const icon = document.createElement('i');
        icon.className = 'fas fa-folder';

        const nameSpan = document.createElement('span');
        nameSpan.className = 'folder-name';
        nameSpan.textContent = folderName;

        nameSpan.addEventListener('click', function(e) {
            e.stopPropagation();
            makeFolderNameEditable(nameSpan, card);
        });

        card.addEventListener('dblclick', function(e) {
            const nameEl = this.querySelector('.folder-name');
            if (nameEl) makeFolderNameEditable(nameEl, this);
        });

        card.appendChild(icon);
        card.appendChild(nameSpan);
        mediaGrid.appendChild(card);

        requestAnimationFrame(() => {
            const spot = findFreeSpot(card.offsetWidth || 125, card.offsetHeight || 100);
            placeCard(card, spot.x, spot.y);
        });

        card.addEventListener('mousedown', function(e) {
            initDrag(this, e);
        });
        card.addEventListener('touchstart', function(e) {
            initDrag(this, e);
        }, { passive: true });

        attachContextMenu(card);
        performSearch(searchInput.value);
    }

    // Global drag listeners
    document.addEventListener('mousemove', moveDrag);
    document.addEventListener('touchmove', moveDrag, { passive: true });
    document.addEventListener('mouseup', endDrag);
    document.addEventListener('touchend', endDrag);
    document.addEventListener('touchcancel', endDrag);

    // ---------- Search ----------
    function performSearch(query) {
        const cards = mediaGrid.querySelectorAll('.media-card, .folder-card');
        const normalizedQuery = query.trim().toLowerCase();
        let anyMatch = false;

        cards.forEach(card => {
            let nameEl = card.querySelector('.media-name') || card.querySelector('.folder-name');
            if (nameEl && nameEl.innerHTML.includes('highlight-match')) {
                nameEl.innerHTML = nameEl.textContent;
            }
            card.style.display = '';
        });

        if (normalizedQuery === '') {
            noMatchMsg.classList.remove('show');
            return;
        }

        cards.forEach(card => {
            let nameEl = card.querySelector('.media-name') || card.querySelector('.folder-name');
            if (!nameEl) return;
            const fileName = nameEl.textContent.toLowerCase();
            const match = fileName.includes(normalizedQuery);
            if (match) {
                anyMatch = true;
                const originalText = nameEl.textContent;
                const lowerText = originalText.toLowerCase();
                const startIdx = lowerText.indexOf(normalizedQuery);
                if (startIdx !== -1) {
                    const before = originalText.substring(0, startIdx);
                    const matchText = originalText.substring(startIdx, startIdx + normalizedQuery.length);
                    const after = originalText.substring(startIdx + normalizedQuery.length);
                    nameEl.innerHTML = `${before}<span class="highlight-match">${matchText}</span>${after}`;
                }
                card.style.display = '';
            } else {
                card.style.display = 'none';
            }
        });

        if (!anyMatch && normalizedQuery !== '') {
            noMatchMsg.classList.add('show');
        } else {
            noMatchMsg.classList.remove('show');
        }
    }

    // ---------- Event listeners ----------
    addBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        fileInput.click();
    });

    fileInput.addEventListener("change", function (e) {
        const files = e.target.files;
        if (!files || files.length === 0) return;
        renderMediaFiles(files);
        fileInput.value = "";
    });

    mediaGrid.addEventListener("dragover", function (e) {
        e.preventDefault();
        this.style.backgroundColor = "#f0f4ff";
    });
    mediaGrid.addEventListener("dragleave", function (e) {
        this.style.backgroundColor = "#f9fafb";
    });
    mediaGrid.addEventListener("drop", function (e) {
        e.preventDefault();
        this.style.backgroundColor = "#f9fafb";
        const files = e.dataTransfer.files;
        if (files && files.length > 0) {
            renderMediaFiles(files);
        }
    });

    addFolderBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        createFolderCard();
    });

    searchInput.addEventListener('input', function(e) {
        performSearch(e.target.value);
    });

    // Seed with a sample folder
    setTimeout(() => { createFolderCard(); }, 100);
});
</script>
