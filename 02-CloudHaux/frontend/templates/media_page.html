<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CloudHaux · Media</title>
  <!-- Font Awesome 6 (free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    /* ----- RESET & BASE ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      flex-direction: column;
    }

    /* ----- TOPBAR ----- */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 70px;
      display: flex;
      align-items: center;
      padding: 0 25px;
      background: white;
      z-index: 1000;
      border-bottom: 1px solid #e5e7eb;
    }

    .logo {
      width: 180px;
      font-size: 1.2rem;
      font-weight: 700;
      color: #2563eb;
      cursor: pointer;
    }

    .search_box {
      flex: 1;
      display: flex;
      justify-content: center;
      margin-right: 230px;
    }

    .search-container {
      position: relative;
      width: 450px;
    }

    .search-container input {
      width: 100%;
      padding: 10px 40px 10px 15px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      outline: none;
      font-size: 14px;
    }

    .search-container input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .search-icon {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #9ca3af;
      pointer-events: none;
      font-size: 16px;
    }

    .profile {
      width: 42px;
      height: 42px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-left: auto;
      border-radius: 50%;
      background: #d1d5db;
      cursor: pointer;
      transition: 0.2s;
    }

    .profile:hover {
      background: #b0b8c4;
    }

    .profile svg {
      width: 20px;
      height: 20px;
    }

    /* ----- LEFT NAV ----- */
    .left_nav_bar {
      position: fixed;
      top: 90px;
      left: 0;
      width: 220px;
      height: calc(100vh - 90px);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 25px;
      border-right: 1px solid #e5e7eb;
      background: white;
      overflow-y: auto;
    }

    .left_nav_bar a {
      display: block;
      padding: 12px 16px;
      border-radius: 10px;
      text-decoration: none;
      color: #111827;
      cursor: pointer;
      transition: 0.2s;
    }

    .left_nav_bar a:hover {
      background: #f3f4f6;
    }

    .add_file_btn {
      width: 60%;
      padding: 10px;
      background-color: #3b82f6;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: -20px;
      text-align: left;
      transition: 0.2s;
    }

    .add_file_btn:hover {
      background-color: #2563eb;
      transform: scale(1.02);
    }

    .add_file_btn:active {
      transform: scale(0.98);
    }

    /* ----- DASHBOARD LAYOUT ----- */
    .dashboard_content {
      margin-left: 220px;
      margin-top: 70px;
      padding: 30px;
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 40px;
      min-height: calc(100vh - 70px);
    }

    .main_content {
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    /* ----- MEDIA VIEWER ----- */
    .media_viewer {
      width: 100%;
      min-height: 80vh;
      background: white;
      border-radius: 16px;
      border: 1px solid #d9d9d9;
      padding: 30px;
      display: flex;
      flex-direction: column;
    }

    .media_header {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: none;
    }

    .media_header h2 {
      font-size: 1.3rem;
      color: #111827;
      text-align: center;
    }

    /* Media grid - dynamic gallery */
    .media_grid {
      flex: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      align-items: flex-start;
      justify-content: flex-start;
      background: #f9fafb;
      border-radius: 12px;
      padding: 24px;
      min-height: 400px;
      border: 1px solid #e5e7eb;
      transition: 0.2s;
    }

    /* empty state - NO TEXT, just empty */
    .media_grid:empty {
      /* No content, just empty */
    }

    /* media card */
    .media-card {
      width: 200px;
      padding: 12px;
      border-radius: 12px;
      background: white;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      transition: 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: default;
    }

    .media-card:hover {
      transform: scale(1.02);
      box-shadow: 0 6px 14px rgba(0,0,0,0.08);
    }

    .media-card .media-icon {
      font-size: 56px;
      color: #dc2626;
    }

    .media-card .media-icon.audio-icon {
      color: #059669;
    }

    .media-card .media-icon.video-icon {
      color: #dc2626;
    }

    .media-card .media-name {
      font-size: 13px;
      color: #374151;
      text-align: center;
      word-break: break-all;
      max-width: 180px;
      font-weight: 500;
    }

    .media-card .media-size {
      font-size: 11px;
      color: #6b7280;
    }

    .media-card .media-type {
      font-size: 10px;
      padding: 2px 12px;
      border-radius: 20px;
      background: #f1f5f9;
      color: #475569;
      font-weight: 600;
      text-transform: uppercase;
    }

    /* ----- RIGHT PANEL ----- */
    .right_panel {
      border-left: 1px solid #ddd;
      padding-left: 30px;
      display: flex;
      flex-direction: column;
    }

    .button_group {
      margin-top: 300px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .category_btn {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 16px;
      background: #f7f7f7;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.25s;
    }

    .category_btn:hover {
      background: #2563eb;
      color: white;
      transform: translateX(6px);
      box-shadow: 0 10px 20px rgba(37, 99, 235, 0.25);
    }

    .category_btn i {
      width: 24px;
      font-size: 20px;
    }

    .category_btn.images:hover {
      background: #2563eb;
    }
    .category_btn.documents:hover {
      background: #7c3aed;
    }
    .category_btn.media_files:hover {
      background: #dc2626;
    }
    .category_btn.audio_files:hover {
      background: #059669;
    }
    .category_btn.safe_vault:hover {
      background: #d97706;
    }

    /* ----- SCROLLBAR ----- */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }
    ::-webkit-scrollbar-thumb {
      background: #c1c7d0;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #a0a7b0;
    }

    /* ----- RESPONSIVE ----- */
    @media (max-width: 1024px) {
      .dashboard_content {
        grid-template-columns: 1fr 250px;
        gap: 30px;
      }
      .right_panel {
        padding-left: 20px;
      }
      .button_group {
        margin-top: 200px;
      }
    }

    @media (max-width: 768px) {
      .dashboard_content {
        grid-template-columns: 1fr;
        margin-left: 0;
        padding: 20px;
      }
      .left_nav_bar {
        display: none;
      }
      .topbar {
        padding: 0 15px;
      }
      .search-container {
        width: 100%;
      }
      .search_box {
        margin-right: 0;
      }
      .right_panel {
        border-left: none;
        border-top: 1px solid #ddd;
        padding: 20px 0 0 0;
      }
      .button_group {
        margin-top: 20px;
        flex-direction: row;
        flex-wrap: wrap;
      }
      .category_btn {
        width: auto;
        flex: 1;
        min-width: 120px;
        padding: 14px;
        font-size: 14px;
      }
      .media_grid {
        min-height: 300px;
        font-size: 1rem;
        padding: 16px;
      }
      .media-card {
        width: 150px;
        padding: 10px;
      }
      .media-card .media-icon {
        font-size: 40px;
      }
    }

    @media (max-width: 480px) {
      .media_grid {
        min-height: 200px;
        font-size: 0.9rem;
        gap: 12px;
        padding: 12px;
      }
      .media_header h2 {
        font-size: 1rem;
      }
      .media-card {
        width: 120px;
        padding: 8px;
      }
      .media-card .media-icon {
        font-size: 32px;
      }
      .media-card .media-name {
        font-size: 11px;
        max-width: 100px;
      }
    }
  </style>
</head>
<body>

  <!-- ===== TOPBAR ===== -->
  <header class="topbar">
    <div class="logo">CloudHaux</div>
    <div class="search_box">
      <div class="search-container">
        <input type="search" placeholder="Search files...">
        <i class="fas fa-search search-icon"></i>
      </div>
    </div>
    <div class="profile">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
      </svg>
    </div>
  </header>

  <!-- ===== LEFT NAV ===== -->
  <nav class="left_nav_bar">
    <button type="button" class="add_file_btn" id="addFileBtn">+ Add Files</button>
    <a href="#all_files">All Files</a>
    <a href="#recent_files">Recent</a>
    <a href="#favorites">Favorites</a>
    <a href="#trash">Trash</a>
  </nav>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="dashboard_content">
    <div class="main_content">

      <!-- MEDIA VIEWER -->
      <section class="media_viewer">
        <div class="media_header">
          <h2>Media</h2>
        </div>

        <!-- Media grid -->
        <div class="media_grid" id="mediaGrid"></div>
      </section>
    </div>

    <!-- ===== RIGHT PANEL ===== -->
    <aside class="right_panel">
      <div class="button_group">
        <button class="category_btn images" onclick="window.location.href='images_page.html'">
          <i class="fas fa-image"></i> Images
        </button>
        <button class="category_btn documents" onclick="window.location.href='documents_page.html'">
          <i class="fas fa-file-alt"></i> Documents
        </button>
        <button class="category_btn media_files" onclick="window.location.href='media_page.html'">
          <i class="fas fa-video"></i> Media
        </button>
        <button class="category_btn audio_files" onclick="window.location.href='audio_page.html'">
          <i class="fas fa-music"></i> Audio
        </button>
        <button class="category_btn safe_vault" onclick="window.location.href='dashboard.html'">
          <i class="fas fa-lock"></i> Safe Vault
        </button>
      </div>
    </aside>
  </main>

  <!-- hidden file input -->
  <input type="file" id="fileInput" accept=".mp4,.mov,.avi,.mkv,.mp3,.wav,.ogg,.m4a" multiple style="display:none;">

  <!-- ===== JAVASCRIPT - Media upload functionality ===== -->
  <script>
  document.addEventListener('DOMContentLoaded', function() {
    "use strict";

    const fileInput = document.getElementById("fileInput");
    const addBtn = document.getElementById("addFileBtn");
    const mediaGrid = document.getElementById("mediaGrid");

    if (!fileInput || !addBtn || !mediaGrid) {
      console.error('Elements not found');
      return;
    }

    // Function to format file size
    function formatFileSize(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    // Get icon for media type
    function getMediaIcon(fileName) {
      const ext = fileName.split('.').pop().toLowerCase();
      const videoExts = ['mp4', 'mov', 'avi', 'mkv', 'webm', 'flv', 'wmv'];
      const audioExts = ['mp3', 'wav', 'ogg', 'm4a', 'flac', 'aac', 'wma'];
      
      if (videoExts.includes(ext)) {
        return { icon: 'fa-video', type: 'video', cssClass: 'video-icon' };
      } else if (audioExts.includes(ext)) {
        return { icon: 'fa-music', type: 'audio', cssClass: 'audio-icon' };
      }
      return { icon: 'fa-file-video', type: 'media', cssClass: '' };
    }

    function renderMediaFiles(files) {
      const mediaFiles = Array.from(files);
      
      if (mediaFiles.length === 0) {
        alert("Please select media files (videos or audio)");
        return;
      }

      mediaFiles.forEach((file) => {
        const card = document.createElement("div");
        card.className = "media-card";
        
        const mediaInfo = getMediaIcon(file.name);
        
        // Icon
        const icon = document.createElement("div");
        icon.className = `media-icon ${mediaInfo.cssClass}`;
        icon.innerHTML = `<i class="fas ${mediaInfo.icon}"></i>`;
        
        // Name
        const name = document.createElement("div");
        name.className = "media-name";
        name.textContent = file.name;
        
        // Size
        const size = document.createElement("div");
        size.className = "media-size";
        size.textContent = formatFileSize(file.size);
        
        // Type badge
        const type = document.createElement("div");
        type.className = "media-type";
        type.textContent = mediaInfo.type;
        
        card.appendChild(icon);
        card.appendChild(name);
        card.appendChild(size);
        card.appendChild(type);
        mediaGrid.appendChild(card);
      });
    }

    addBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      fileInput.click();
    });

    fileInput.addEventListener("change", function (e) {
      const files = e.target.files;
      if (!files || files.length === 0) return;
      renderMediaFiles(files);
      fileInput.value = "";
    });

    mediaGrid.addEventListener("dragover", function (e) {
      e.preventDefault();
      this.style.backgroundColor = "#f0f4ff";
    });
    mediaGrid.addEventListener("dragleave", function (e) {
      this.style.backgroundColor = "#f9fafb";
    });
    mediaGrid.addEventListener("drop", function (e) {
      e.preventDefault();
      this.style.backgroundColor = "#f9fafb";
      const files = e.dataTransfer.files;
      if (files && files.length > 0) {
        renderMediaFiles(files);
      }
    });
  });
  </script>
</body>
</html>
