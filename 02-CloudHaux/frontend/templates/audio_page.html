<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudHaux · Audio</title>
    <link rel="stylesheet" href="../static/css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* ----- AUDIO PAGE SPECIFIC STYLES ----- */
        .audio_viewer {
            width: 100%;
            min-height: 400px;
            padding: 30px;
            border: 1px solid #d9d9d9;
            border-radius: 16px;
            background: white;
            display: flex;
            flex-direction: column;
        }

        .audio_header {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: none;
        }

        .audio_header h2 {
            font-size: 1.3rem;
            color: #111827;
            text-align: center;
        }

        .audio_grid {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: flex-start;
            justify-content: flex-start;
            background: #f9fafb;
            border-radius: 12px;
            padding: 24px;
            min-height: 400px;
            border: 1px solid #e5e7eb;
            transition: 0.2s;
        }

        /* Empty state - NO TEXT */
        .audio_grid:empty {
            /* No content, just empty */
        }

        .audio-card {
            width: 200px;
            padding: 16px;
            border-radius: 12px;
            background: white;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            cursor: default;
        }

        .audio-card:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 14px rgba(0,0,0,0.08);
        }

        .audio-card .audio-icon {
            font-size: 48px;
            color: #059669;
        }

        .audio-card .audio-name {
            font-size: 13px;
            color: #374151;
            text-align: center;
            word-break: break-all;
            max-width: 180px;
            font-weight: 500;
        }

        .audio-card .audio-size {
            font-size: 11px;
            color: #6b7280;
        }

        .audio-card .audio-player {
            width: 100%;
            margin-top: 8px;
        }

        .audio-card .audio-player audio {
            width: 100%;
            height: 36px;
            border-radius: 8px;
        }

        @media (max-width: 768px) {
            .audio_grid {
                min-height: 300px;
                padding: 16px;
            }
            .audio-card {
                width: 160px;
                padding: 12px;
            }
            .audio-card .audio-icon {
                font-size: 36px;
            }
        }

        @media (max-width: 480px) {
            .audio_grid {
                min-height: 200px;
                gap: 12px;
                padding: 12px;
            }
            .audio_header h2 {
                font-size: 1rem;
            }
            .audio-card {
                width: 130px;
                padding: 10px;
            }
            .audio-card .audio-icon {
                font-size: 28px;
            }
            .audio-card .audio-name {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <!-- ===== TOPBAR ===== -->
    <header class="topbar">
        <div class="logo">CloudHaux</div>
        <div class="search-container">
            <input type="search" placeholder="Search files...">
            <i class="fas fa-search search-icon"></i>
        </div>
        <div class="profile">
            <svg viewBox="0 0 24 24">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
        </div>
    </header>

    <!-- ===== LEFT NAV ===== -->
    <nav class="left_nav_bar">
        <button type="button" class="add_file_btn" id="addFileBtn">+ Add Files</button>
        <a href="#all_files">All Files</a>
        <a href="#recent_files">Recent</a>
        <a href="#favorites">Favorites</a>
        <a href="#trash">Trash</a>
    </nav>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="dashboard_content">
        <div class="main_content">
            <section class="audio_viewer">
                <div class="audio_header">
                    <h2>Audio</h2>
                </div>
                <div class="audio_grid" id="audioGrid"></div>
            </section>
        </div>

        <!-- ===== RIGHT PANEL ===== -->
        <aside class="right_panel">
            <div class="button_group">
                <button class="category_btn images" onclick="window.location.href='images_page.html'">
                    <i class="fas fa-image"></i> Images
                </button>
                <button class="category_btn documents" onclick="window.location.href='documents_page.html'">
                    <i class="fas fa-file-alt"></i> Documents
                </button>
                <button class="category_btn media_files" onclick="window.location.href='media_page.html'">
                    <i class="fas fa-video"></i> Media
                </button>
                <button class="category_btn audio_files" onclick="window.location.href='audio_page.html'">
                    <i class="fas fa-music"></i> Audio
                </button>
                <button class="category_btn safe_vault" onclick="window.location.href='dashboard.html'">
                    <i class="fas fa-lock"></i> Safe Vault
                </button>
            </div>
        </aside>
    </main>

    <!-- hidden file input -->
    <input type="file" id="fileInput" accept=".mp3,.wav,.ogg,.aac,.flac,.m4a" multiple style="display:none;">

    <!-- ===== JAVASCRIPT - Audio upload functionality ===== -->
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        "use strict";

        const fileInput = document.getElementById("fileInput");
        const addBtn = document.getElementById("addFileBtn");
        const audioGrid = document.getElementById("audioGrid");

        if (!fileInput || !addBtn || !audioGrid) {
            console.error('Elements not found');
            return;
        }

        // Function to format file size
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // Get icon for audio type
        function getAudioIcon(fileName) {
            const ext = fileName.split('.').pop().toLowerCase();
            const icons = {
                'mp3': 'fa-music',
                'wav': 'fa-wave-square',
                'ogg': 'fa-music',
                'aac': 'fa-music',
                'flac': 'fa-music',
                'm4a': 'fa-music'
            };
            return icons[ext] || 'fa-music';
        }

        function renderAudioFiles(files) {
            const audioFiles = Array.from(files);
            
            if (audioFiles.length === 0) {
                alert("Please select audio files (MP3, WAV, OGG, etc.)");
                return;
            }

            audioFiles.forEach((file) => {
                const card = document.createElement("div");
                card.className = "audio-card";
                
                // Icon
                const icon = document.createElement("div");
                icon.className = "audio-icon";
                icon.innerHTML = `<i class="fas ${getAudioIcon(file.name)}"></i>`;
                
                // Name
                const name = document.createElement("div");
                name.className = "audio-name";
                name.textContent = file.name;
                
                // Size
                const size = document.createElement("div");
                size.className = "audio-size";
                size.textContent = formatFileSize(file.size);
                
                // Audio player
                const playerWrapper = document.createElement("div");
                playerWrapper.className = "audio-player";
                
                const audio = document.createElement("audio");
                audio.controls = true;
                audio.preload = "metadata";
                
                const source = document.createElement("source");
                const objectURL = URL.createObjectURL(file);
                source.src = objectURL;
                source.type = file.type;
                
                audio.appendChild(source);
                playerWrapper.appendChild(audio);
                
                card.appendChild(icon);
                card.appendChild(name);
                card.appendChild(size);
                card.appendChild(playerWrapper);
                audioGrid.appendChild(card);
            });
        }

        addBtn.addEventListener("click", function (e) {
            e.stopPropagation();
            fileInput.click();
        });

        fileInput.addEventListener("change", function (e) {
            const files = e.target.files;
            if (!files || files.length === 0) return;
            renderAudioFiles(files);
            fileInput.value = "";
        });

        audioGrid.addEventListener("dragover", function (e) {
            e.preventDefault();
            this.style.backgroundColor = "#f0f4ff";
        });
        audioGrid.addEventListener("dragleave", function (e) {
            this.style.backgroundColor = "#f9fafb";
        });
        audioGrid.addEventListener("drop", function (e) {
            e.preventDefault();
            this.style.backgroundColor = "#f9fafb";
            const files = e.dataTransfer.files;
            if (files && files.length > 0) {
                renderAudioFiles(files);
            }
        });
    });
    </script>
</body>
</html>
