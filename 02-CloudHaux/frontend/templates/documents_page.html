<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudHaux · Documents</title>
    <link rel="stylesheet" href="../static/css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .documents_viewer {
            width: 100%;
            min-height: 400px;
            padding: 30px;
            border: 1px solid #d9d9d9;
            border-radius: 16px;
            background: white;
            display: flex;
            flex-direction: column;
        }

        .documents_header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: none;
            flex-wrap: wrap;
            gap: 12px;
        }

        .documents_header h2 {
            font-size: 1.3rem;
            color: #111827;
            margin: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .add-folder-btn {
            background: transparent;
            border: none;
            font-size: 1.8rem;
            color: #1e293b;
            cursor: pointer;
            padding: 0 6px;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            width: 44px;
            height: 44px;
            background: #f1f5f9;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }

        .add-folder-btn i {
            font-size: 1.6rem;
            color: #334155;
        }

        .add-folder-btn:hover {
            background: #e2e8f0;
            transform: scale(1.04);
            color: #0f172a;
        }

        .add-folder-btn:active {
            transform: scale(0.94);
        }

        .documents_grid {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: flex-start;
            justify-content: flex-start;
            background: #f9fafb;
            border-radius: 12px;
            padding: 24px;
            min-height: 400px;
            border: 1px solid #e5e7eb;
            transition: 0.2s;
            position: relative;
        }

        .folder-card {
            width: 125px;
            height: 100px;
            border-radius: 12px;
            background: #eef2f6;
            border: 1px solid #d1d9e6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #1e293b;
            font-size: 0.85rem;
            font-weight: 500;
            transition: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            cursor: grab;
            gap: 4px;
            position: relative;
            user-select: none;
            touch-action: none;
        }

        .folder-card.dragging {
            opacity: 0.8;
            transform: scale(1.05);
            z-index: 1000;
            cursor: grabbing;
            box-shadow: 0 12px 30px rgba(0,0,0,0.15);
            border-color: #3b82f6;
        }

        .folder-card.drag-over {
            border-color: #3b82f6;
            background: #dbeafe;
            transform: scale(1.03);
        }

        .folder-card i {
            font-size: 2.8rem;
            color: #475569;
            margin-bottom: 2px;
            pointer-events: none;
        }

        .folder-name {
            background: #dce3ec;
            padding: 2px 14px;
            border-radius: 30px;
            font-size: 0.7rem;
            color: #1e293b;
            letter-spacing: 0.3px;
            cursor: pointer;
            transition: 0.2s;
            user-select: none;
            min-width: 40px;
            text-align: center;
            display: inline-block;
            pointer-events: auto;
        }

        .folder-name:hover {
            background: #c8d2e0;
            transform: scale(1.05);
        }

        .folder-name-input {
            background: white;
            border: 2px solid #3b82f6;
            padding: 2px 10px;
            border-radius: 30px;
            font-size: 0.7rem;
            color: #1e293b;
            outline: none;
            min-width: 60px;
            text-align: center;
            font-family: inherit;
            font-weight: 500;
        }

        .folder-name-input:focus {
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .folder-card:hover {
            background: #e2e8f0;
            border-color: #94a3b8;
        }

        .folder-card .folder-remove {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            font-size: 12px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .folder-card:hover .folder-remove {
            display: flex;
        }

        .folder-card .folder-remove:hover {
            background: #dc2626;
            transform: scale(1.1);
        }

        .folder-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        .folder-overlay.active {
            display: flex;
        }

        .folder-modal {
            background: white;
            border-radius: 16px;
            padding: 30px;
            max-width: 700px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideUp 0.3s ease;
        }

        .folder-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e5e7eb;
        }

        .folder-modal-header h3 {
            font-size: 1.2rem;
            color: #111827;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .folder-modal-header h3 i {
            color: #f59e0b;
        }

        .folder-modal-close {
            background: none;
            border: none;
            font-size: 24px;
            color: #6b7280;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 8px;
            transition: 0.2s;
        }

        .folder-modal-close:hover {
            background: #f3f4f6;
            color: #111827;
        }

        .file-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            background: #f9fafb;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            margin-bottom: 8px;
            transition: 0.2s;
        }

        .file-item:hover {
            background: #f3f4f6;
            border-color: #7c3aed;
        }

        .file-item i {
            font-size: 18px;
            color: #6b7280;
            width: 24px;
            text-align: center;
        }

        .file-item .file-name {
            flex: 1;
            font-size: 13px;
            color: #374151;
        }

        .file-item .file-size {
            font-size: 12px;
            color: #6b7280;
            background: white;
            padding: 2px 10px;
            border-radius: 12px;
        }

        .uploading-indicator {
            display: none;
            padding: 20px;
            text-align: center;
            color: #6b7280;
            font-size: 14px;
        }

        .uploading-indicator.active {
            display: block;
        }

        .uploading-indicator i {
            font-size: 24px;
            color: #3b82f6;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        .drag-ghost {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.85;
            transform: scale(1.08);
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            border-color: #3b82f6;
            background: #eef2f6;
            border-radius: 12px;
            padding: 10px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .drag-ghost i {
            font-size: 2.8rem;
            color: #475569;
        }

        .drag-ghost span {
            background: #dce3ec;
            padding: 2px 14px;
            border-radius: 30px;
            font-size: 0.7rem;
            color: #1e293b;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @media (max-width: 768px) {
            .documents_grid {
                min-height: 300px;
                padding: 16px;
            }
            .folder-card {
                width: 100px;
                height: 100px;
            }
            .add-folder-btn {
                width: 38px;
                height: 38px;
                font-size: 1.4rem;
            }
            .add-folder-btn i {
                font-size: 1.3rem;
            }
            .folder-modal {
                padding: 20px;
                max-width: 95%;
            }
        }

        @media (max-width: 480px) {
            .documents_grid {
                min-height: 200px;
                gap: 12px;
                padding: 12px;
            }
            .documents_header h2 {
                font-size: 1rem;
            }
            .folder-card {
                width: 80px;
                height: 80px;
            }
            .folder-card i {
                font-size: 2rem;
            }
            .file-item {
                padding: 8px 10px;
                font-size: 12px;
            }
            .file-item .file-name {
                font-size: 11px;
            }
            .add-folder-btn {
                width: 34px;
                height: 34px;
            }
            .add-folder-btn i {
                font-size: 1.1rem;
            }
        }

        .custom-context-menu {
            position: fixed;
            z-index: 10000;
            min-width: 180px;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            padding: 6px;
            display: none;
        }
        .custom-context-menu.open { display: block; }
        .ccm-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 12px;
            border-radius: 7px;
            font-size: 0.85rem;
            color: #1f2937;
            cursor: pointer;
        }
        .ccm-item i { width: 16px; text-align: center; color: #475569; }
        .ccm-item:hover { background: #f1f5f9; }
        .ccm-item.ccm-danger { color: #dc2626; }
        .ccm-item.ccm-danger i { color: #dc2626; }
        .ccm-item.ccm-danger:hover { background: #fee2e2; }
        .ccm-separator { height: 1px; background: #eef0f3; margin: 5px 4px; }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="logo">CloudHaux</div>
        <div class="search-container">
            <input type="search" placeholder="Search files...">
            <i class="fas fa-search search-icon"></i>
        </div>
        <div class="profile">
            <svg viewBox="0 0 24 24">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
        </div>
    </header>

    <nav class="left_nav_bar">
        <button type="button" class="add_file_btn" id="addFileBtn">
            <i class="fas fa-plus" style="margin-right: 8px;"></i> Add Files
        </button>
        <input type="file" id="fileInput" webkitdirectory multiple style="display:none;">
        <a href="#all_files">All Files</a>
        <a href="#recent_files">Recent</a>
        <a href="#favorites">Favorites</a>
        <a href="#trash">Trash</a>
    </nav>

    <main class="dashboard_content">
        <div class="main_content">
            <section class="documents_viewer">
                <div class="documents_header">
                    <div class="header-left">
                        <h2>📄 Documents</h2>
                    </div>
                    <div class="header-actions">
                        <button class="add-folder-btn" id="addFolderBtn" title="Create new folder">
                            <i class="fas fa-folder-plus"></i>
                        </button>
                    </div>
                </div>
                <div class="uploading-indicator" id="uploadingIndicator">
                    <i class="fas fa-spinner"></i> Uploading files...
                </div>
                <div class="documents_grid" id="documentsGrid"></div>
            </section>
        </div>

        <aside class="right_panel">
            <div class="button_group">
                <button class="category_btn images" onclick="window.location.href='images_page.html'">
                    <i class="fas fa-image"></i> Images
                </button>
                <button class="category_btn documents" onclick="window.location.href='documents_page.html'">
                    <i class="fas fa-file-alt"></i> Documents
                </button>
                <button class="category_btn media_files" onclick="window.location.href='media_page.html'">
                    <i class="fas fa-video"></i> Media
                </button>
                <button class="category_btn audio_files" onclick="window.location.href='audio_page.html'">
                    <i class="fas fa-music"></i> Audio
                </button>
                <button class="category_btn safe_vault" onclick="window.location.href='dashboard.html'">
                    <i class="fas fa-lock"></i> Safe Vault
                </button>
            </div>
        </aside>
    </main>

    <div class="folder-overlay" id="folderOverlay">
        <div class="folder-modal">
            <div class="folder-modal-header">
                <h3><i class="fas fa-folder"></i> <span id="modalFolderName">Folder</span></h3>
                <button class="folder-modal-close" id="modalCloseBtn">&times;</button>
            </div>
            <div id="modalFileList"></div>
        </div>
    </div>

    <div class="custom-context-menu" id="customContextMenu">
        <div class="ccm-item" id="ccmShare"><i class="fas fa-share-alt"></i> Share</div>
        <div class="ccm-item" id="ccmMove"><i class="fas fa-folder-open"></i> Move to</div>
        <div class="ccm-separator"></div>
        <div class="ccm-item ccm-danger" id="ccmDelete"><i class="fas fa-trash"></i> Delete</div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        "use strict";

        const fileInput = document.getElementById("fileInput");
        const addBtn = document.getElementById("addFileBtn");
        const documentsGrid = document.getElementById("documentsGrid");
        const uploadIndicator = document.getElementById("uploadingIndicator");
        const addFolderBtn = document.getElementById("addFolderBtn");
        
        const folderOverlay = document.getElementById("folderOverlay");
        const modalCloseBtn = document.getElementById("modalCloseBtn");
        const modalFolderName = document.getElementById("modalFolderName");
        const modalFileList = document.getElementById("modalFileList");

        const folderStore = {};
        let dragData = null;
        let ghostElement = null;

        const contextMenu = document.getElementById('customContextMenu');
        let contextTarget = null;
        const ccmDelete = document.getElementById('ccmDelete');

        function openContextMenu(x, y, targetCard) {
            contextTarget = targetCard;
            const maxX = window.innerWidth - 190;
            const maxY = window.innerHeight - 120;
            contextMenu.style.left = Math.min(x, maxX) + 'px';
            contextMenu.style.top = Math.min(y, maxY) + 'px';
            contextMenu.classList.add('open');
        }

        function closeContextMenu() {
            contextMenu.classList.remove('open');
            contextTarget = null;
        }

        function attachContextMenu(card) {
            card.addEventListener('contextmenu', function(e) {
                e.preventDefault();
                e.stopPropagation();
                openContextMenu(e.clientX, e.clientY, card);
            });
        }

        ccmDelete.addEventListener('click', function(e) {
            e.stopPropagation();
            if (contextTarget) {
                const folderName = contextTarget.dataset.folderName;
                if (folderName && folderStore[folderName]) {
                    delete folderStore[folderName];
                }
                contextTarget.style.transition = '0.2s';
                contextTarget.style.transform = 'scale(0.8)';
                contextTarget.style.opacity = '0';
                setTimeout(() => {
                    contextTarget.remove();
                }, 200);
            }
            closeContextMenu();
        });

        document.addEventListener('click', function(e) {
            if (!contextMenu.contains(e.target)) closeContextMenu();
        });
        document.addEventListener('scroll', closeContextMenu, true);
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeContextMenu();
        });

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function getFileIcon(fileName) {
            const ext = fileName.split('.').pop().toLowerCase();
            const icons = {
                'pdf': 'fa-file-pdf',
                'doc': 'fa-file-word',
                'docx': 'fa-file-word',
                'txt': 'fa-file-alt',
                'xls': 'fa-file-excel',
                'xlsx': 'fa-file-excel',
                'csv': 'fa-file-csv',
                'ppt': 'fa-file-powerpoint',
                'pptx': 'fa-file-powerpoint',
                'js': 'fa-file-code',
                'html': 'fa-file-code',
                'htm': 'fa-file-code',
                'css': 'fa-file-code',
                'json': 'fa-file-code',
                'xml': 'fa-file-code',
                'py': 'fa-file-code',
                'java': 'fa-file-code',
                'cpp': 'fa-file-code',
                'c': 'fa-file-code',
                'php': 'fa-file-code',
                'rb': 'fa-file-code',
                'go': 'fa-file-code',
                'rs': 'fa-file-code',
                'swift': 'fa-file-code',
                'kt': 'fa-file-code',
                'md': 'fa-file-alt',
                'zip': 'fa-file-archive',
                'rar': 'fa-file-archive',
                '7z': 'fa-file-archive'
            };
            return icons[ext] || 'fa-file';
        }

        function createGhostElement(card) {
            const ghost = document.createElement('div');
            ghost.className = 'drag-ghost';
            ghost.style.position = 'fixed';
            ghost.style.pointerEvents = 'none';
            ghost.style.zIndex = '9999';
            
            const icon = document.createElement('i');
            icon.className = 'fas fa-folder';
            
            const nameSpan = document.createElement('span');
            const folderNameEl = card.querySelector('.folder-name');
            nameSpan.textContent = folderNameEl ? folderNameEl.textContent : 'Folder';
            
            ghost.appendChild(icon);
            ghost.appendChild(nameSpan);
            
            return ghost;
        }

        function isInsideGrid(grid, clientX, clientY) {
            const rect = grid.getBoundingClientRect();
            return clientX >= rect.left && clientX <= rect.right &&
                   clientY >= rect.top && clientY <= rect.bottom;
        }

        function findDropTarget(grid, clientX, clientY) {
            const cards = grid.querySelectorAll('.folder-card:not(.dragging)');
            for (let card of cards) {
                const rect = card.getBoundingClientRect();
                if (clientX >= rect.left && clientX <= rect.right &&
                    clientY >= rect.top && clientY <= rect.bottom) {
                    return card;
                }
            }
            return null;
        }

        function initDrag(card, e) {
            if (e.target.closest('.folder-name-input') || e.target.closest('.folder-name')) {
                return;
            }

            const startX = e.clientX || e.touches?.[0]?.clientX || 0;
            const startY = e.clientY || e.touches?.[0]?.clientY || 0;

            dragData = {
                card: card,
                startX: startX,
                startY: startY,
                offsetX: 0,
                offsetY: 0,
                isDragging: false
            };

            ghostElement = createGhostElement(card);
            document.body.appendChild(ghostElement);
            ghostElement.style.display = 'none';

            card.classList.add('dragging');
        }

        function moveDrag(e) {
            if (!dragData || !ghostElement) return;

            const clientX = e.clientX || e.touches?.[0]?.clientX || 0;
            const clientY = e.clientY || e.touches?.[0]?.clientY || 0;

            const dx = clientX - dragData.startX;
            const dy = clientY - dragData.startY;

            if (!dragData.isDragging && (Math.abs(dx) > 5 || Math.abs(dy) > 5)) {
                dragData.isDragging = true;
                const cardRect = dragData.card.getBoundingClientRect();
                ghostElement.style.display = 'flex';
                ghostElement.style.left = (clientX - cardRect.width / 2) + 'px';
                ghostElement.style.top = (clientY - 40) + 'px';
                
                document.querySelectorAll('.folder-card.drag-over').forEach(el => {
                    el.classList.remove('drag-over');
                });
            }

            if (dragData.isDragging) {
                ghostElement.style.left = (clientX - 62) + 'px';
                ghostElement.style.top = (clientY - 50) + 'px';

                if (isInsideGrid(documentsGrid, clientX, clientY)) {
                    const target = findDropTarget(documentsGrid, clientX, clientY);
                    document.querySelectorAll('.folder-card.drag-over').forEach(el => {
                        if (el !== target) el.classList.remove('drag-over');
                    });
                    if (target && target !== dragData.card) {
                        target.classList.add('drag-over');
                    }
                } else {
                    document.querySelectorAll('.folder-card.drag-over').forEach(el => {
                        el.classList.remove('drag-over');
                    });
                }
            }
        }

        function endDrag(e) {
            if (!dragData) return;

            const clientX = e.clientX || e.changedTouches?.[0]?.clientX || 0;
            const clientY = e.clientY || e.changedTouches?.[0]?.clientY || 0;

            document.querySelectorAll('.folder-card.drag-over').forEach(el => {
                el.classList.remove('drag-over');
            });

            if (dragData.isDragging) {
                const inside = isInsideGrid(documentsGrid, clientX, clientY);
                const target = findDropTarget(documentsGrid, clientX, clientY);

                if (inside && target && target !== dragData.card) {
                    const parent = documentsGrid;
                    const card1 = dragData.card;
                    const card2 = target;
                    
                    const clone1 = card1.cloneNode(true);
                    const clone2 = card2.cloneNode(true);
                    
                    const nameSpan1 = clone1.querySelector('.folder-name');
                    if (nameSpan1) {
                        nameSpan1.addEventListener('click', function(e) {
                            e.stopPropagation();
                            makeFolderNameEditable(nameSpan1, clone1);
                        });
                    }
                    clone1.addEventListener('dblclick', function(e) {
                        const nameEl = this.querySelector('.folder-name');
                        if (nameEl) {
                            makeFolderNameEditable(nameEl, this);
                        }
                    });
                    
                    const removeBtn1 = clone1.querySelector('.folder-remove');
                    if (removeBtn1) {
                        removeBtn1.addEventListener('click', function(e) {
                            e.stopPropagation();
                            removeItem(clone1);
                        });
                    }
                    
                    clone1.addEventListener('click', function(e) {
                        if (e.target.closest('.folder-remove') || e.target.closest('.folder-name-input')) {
                            return;
                        }
                        const folderName = this.dataset.folderName;
                        if (folderStore[folderName]) {
                            openFolder(folderName, folderStore[folderName]);
                        }
                    });
                    attachContextMenu(clone1);
                    
                    const nameSpan2 = clone2.querySelector('.folder-name');
                    if (nameSpan2) {
                        nameSpan2.addEventListener('click', function(e) {
                            e.stopPropagation();
                            makeFolderNameEditable(nameSpan2, clone2);
                        });
                    }
                    clone2.addEventListener('dblclick', function(e) {
                        const nameEl = this.querySelector('.folder-name');
                        if (nameEl) {
                            makeFolderNameEditable(nameEl, this);
                        }
                    });
                    
                    const removeBtn2 = clone2.querySelector('.folder-remove');
                    if (removeBtn2) {
                        removeBtn2.addEventListener('click', function(e) {
                            e.stopPropagation();
                            removeItem(clone2);
                        });
                    }
                    attachContextMenu(clone2);
                    clone2.addEventListener('click', function(e) {
                        if (e.target.closest('.folder-remove') || e.target.closest('.folder-name-input')) {
                            return;
                        }
                        const folderName = this.dataset.folderName;
                        if (folderStore[folderName]) {
                            openFolder(folderName, folderStore[folderName]);
                        }
                    });
                    
                    clone1.addEventListener('mousedown', function(e) {
                        initDrag(this, e);
                    });
                    clone1.addEventListener('touchstart', function(e) {
                        initDrag(this, e);
                    }, { passive: true });
                    
                    clone2.addEventListener('mousedown', function(e) {
                        initDrag(this, e);
                    });
                    clone2.addEventListener('touchstart', function(e) {
                        initDrag(this, e);
                    }, { passive: true });
                    
                    const idx1 = Array.from(parent.children).indexOf(card1);
                    const idx2 = Array.from(parent.children).indexOf(card2);
                    
                    if (idx1 < idx2) {
                        parent.insertBefore(clone2, card1);
                        parent.insertBefore(clone1, card2);
                    } else {
                        parent.insertBefore(clone1, card2);
                        parent.insertBefore(clone2, card1);
                    }
                    
                    card1.remove();
                    card2.remove();
                }
            }

            if (ghostElement) {
                ghostElement.remove();
                ghostElement = null;
            }
            if (dragData.card) {
                dragData.card.classList.remove('dragging');
            }
            document.querySelectorAll('.folder-card.drag-over').forEach(el => {
                el.classList.remove('drag-over');
            });
            dragData = null;
        }

        function makeFolderNameEditable(folderNameSpan, folderCard) {
            const currentName = folderNameSpan.textContent;
            
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'folder-name-input';
            input.value = currentName;
            
            folderNameSpan.replaceWith(input);
            input.focus();
            input.select();

            function saveRename() {
                const newName = input.value.trim() || currentName;
                
                const oldName = folderCard.dataset.folderName;
                if (oldName && folderStore[oldName]) {
                    folderStore[newName] = folderStore[oldName];
                    delete folderStore[oldName];
                }
                folderCard.dataset.folderName = newName;
                
                const newSpan = document.createElement('span');
                newSpan.className = 'folder-name';
                newSpan.textContent = newName;
                
                newSpan.addEventListener('click', function(e) {
                    e.stopPropagation();
                    makeFolderNameEditable(newSpan, folderCard);
                });
                
                folderCard.addEventListener('dblclick', function(e) {
                    const nameSpan = this.querySelector('.folder-name');
                    if (nameSpan) {
                        makeFolderNameEditable(nameSpan, this);
                    }
                });
                
                input.replaceWith(newSpan);
            }

            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    input.blur();
                } else if (e.key === 'Escape') {
                    const newSpan = document.createElement('span');
                    newSpan.className = 'folder-name';
                    newSpan.textContent = currentName;
                    
                    newSpan.addEventListener('click', function(e) {
                        e.stopPropagation();
                        makeFolderNameEditable(newSpan, folderCard);
                    });
                    
                    input.replaceWith(newSpan);
                }
            });

            input.addEventListener('blur', saveRename);
        }

        function removeItem(card) {
            const folderName = card.dataset.folderName;
            if (folderName && folderStore[folderName]) {
                delete folderStore[folderName];
            }
            card.style.transition = '0.2s';
            card.style.transform = 'scale(0.8)';
            card.style.opacity = '0';
            setTimeout(() => {
                card.remove();
            }, 200);
        }

        function openFolder(folderName, files) {
            modalFolderName.textContent = folderName;
            modalFileList.innerHTML = '';
            
            const sortedFiles = [...files].sort((a, b) => a.name.localeCompare(b.name));
            
            if (sortedFiles.length === 0) {
                const emptyMsg = document.createElement('div');
                emptyMsg.style.cssText = 'text-align: center; padding: 40px 20px; color: #6b7280;';
                emptyMsg.innerHTML = '<i class="fas fa-folder-open" style="font-size: 48px; display: block; margin-bottom: 12px; color: #d1d5db;"></i> This folder is empty';
                modalFileList.appendChild(emptyMsg);
            } else {
                sortedFiles.forEach(file => {
                    const fileItem = document.createElement("div");
                    fileItem.className = "file-item";
                    
                    const icon = document.createElement("i");
                    icon.className = 'fas ' + getFileIcon(file.name);
                    
                    const name = document.createElement("span");
                    name.className = "file-name";
                    name.textContent = file.name;
                    
                    const size = document.createElement("span");
                    size.className = "file-size";
                    size.textContent = formatFileSize(file.size);
                    
                    fileItem.appendChild(icon);
                    fileItem.appendChild(name);
                    fileItem.appendChild(size);
                    modalFileList.appendChild(fileItem);
                });
            }
            
            folderOverlay.classList.add('active');
        }

        function closeModal() {
            folderOverlay.classList.remove('active');
        }

        function createFolderCard(folderName, files) {
            const card = document.createElement("div");
            card.className = "folder-card";
            card.dataset.folderName = folderName;
            
            const removeBtn = document.createElement("button");
            removeBtn.className = "folder-remove";
            removeBtn.innerHTML = '<i class="fas fa-times"></i>';
            removeBtn.title = "Remove folder";
            removeBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                removeItem(card);
            });
            
            const icon = document.createElement("i");
            icon.className = "fas fa-folder";
            
            const nameSpan = document.createElement("span");
            nameSpan.className = "folder-name";
            nameSpan.textContent = folderName;
            
            nameSpan.addEventListener('click', function(e) {
                e.stopPropagation();
                makeFolderNameEditable(nameSpan, card);
            });
            
            card.addEventListener('dblclick', function(e) {
                const nameEl = this.querySelector('.folder-name');
                if (nameEl) {
                    makeFolderNameEditable(nameEl, this);
                }
            });
            
            card.addEventListener('click', function(e) {
                if (e.target.closest('.folder-remove') || e.target.closest('.folder-name-input')) {
                    return;
                }
                const folderName = this.dataset.folderName;
                if (folderStore[folderName]) {
                    openFolder(folderName, folderStore[folderName]);
                }
            });
            
            card.addEventListener('mousedown', function(e) {
                initDrag(this, e);
            });
            card.addEventListener('touchstart', function(e) {
                initDrag(this, e);
            }, { passive: true });

            card.appendChild(removeBtn);
            card.appendChild(icon);
            card.appendChild(nameSpan);
            documentsGrid.appendChild(card);
            attachContextMenu(card);
        }

            document.addEventListener('mousemove', moveDrag);
        document.addEventListener('touchmove', moveDrag, { passive: true });
        document.addEventListener('mouseup', endDrag);
        document.addEventListener('touchend', endDrag);
        document.addEventListener('touchcancel', endDrag);

        function processFiles(files) {
            const fileArray = Array.from(files);
            const folders = {};
            
            fileArray.forEach(file => {
                if (file.webkitRelativePath) {
                    const pathParts = file.webkitRelativePath.split('/');
                    const folderName = pathParts[0];
                    
                    if (!folders[folderName]) {
                        folders[folderName] = [];
                    }
                    folders[folderName].push(file);
                }
            });
            
            Object.keys(folders).forEach(folderName => {
                folderStore[folderName] = folders[folderName];
                const folderCard = createFolderCard(folderName, folders[folderName]);
                documentsGrid.appendChild(folderCard);
            });
        }

        function createEmptyFolder() {
            const folderCount = documentsGrid.querySelectorAll('.folder-card').length + 1;
            const folderName = `Folder ${folderCount}`;
            
            const emptyFiles = [];
            folderStore[folderName] = emptyFiles;
            const folderCard = createFolderCard(folderName, emptyFiles);
            documentsGrid.appendChild(folderCard);
        }

        modalCloseBtn.addEventListener('click', closeModal);
        folderOverlay.addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        addBtn.addEventListener("click", function(e) {
            e.stopPropagation();
            fileInput.click();
        });

        addFolderBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            createEmptyFolder();
        });

        fileInput.addEventListener("change", function(e) {
            const files = e.target.files;
            if (!files || files.length === 0) return;
            
            uploadIndicator.classList.add('active');
            
            setTimeout(() => {
                processFiles(files);
                uploadIndicator.classList.remove('active');
                fileInput.value = "";
            }, 300);
        });

        documentsGrid.addEventListener("dragover", function(e) {
            e.preventDefault();
            this.style.backgroundColor = "#f0f4ff";
        });
        documentsGrid.addEventListener("dragleave", function(e) {
            this.style.backgroundColor = "#f9fafb";
        });
        documentsGrid.addEventListener("drop", function(e) {
            e.preventDefault();
            this.style.backgroundColor = "#f9fafb";
            const files = e.dataTransfer.files;
            if (files && files.length > 0) {
                uploadIndicator.classList.add('active');
                setTimeout(() => {
                    processFiles(files);
                    uploadIndicator.classList.remove('active');
                }, 300);
            }
        });
    });
    </script>
</body>
