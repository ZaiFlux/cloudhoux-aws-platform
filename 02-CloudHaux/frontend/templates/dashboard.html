<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudHaux Dashboard</title>
    <link rel ="stylesheet" href="../static/css/dashboard.css">

</head>
<body>
    <header class="topbar">

        <div class="logo">
            CloudHaux
        </div>

        <div class="search_box">
            <input type="search" placeholder="Search files...">
        </div>

        <div class="profile">
            <!-- SVG -->
        </div>

    </header>

    <nav class="left_nav_bar">

        <div>All Files</div>
        <div>Recent</div>
        <div>Favorites</div>
        <div>Trash</div>

    </nav>

    <main class="dashboard_content">

        <div class="main_content">

            <section class="recent_files">
                <h2>Recent Files</h2>
            </section>

            <section class="favorites">
                <h2>Favorites</h2>
            </section>

            <section class="all_files">
                <h2>All Files</h2>
            </section>

            <section class="trash">
                <h2>Trash</h2>
            </section>

        </div>

        <aside class="right_panel">


        </aside>

    </main>

</body>

</body>
</html>
