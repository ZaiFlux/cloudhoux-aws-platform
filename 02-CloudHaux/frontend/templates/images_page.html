<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudHaux · Images</title>
    <link rel="stylesheet" href="../static/css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .images_viewer {
            width: 100%;
            min-height: 400px;
            padding: 30px;
            border: 1px solid #d9d9d9;
            border-radius: 16px;
            background: white;
            display: flex;
            flex-direction: column;
        }

        .images_header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: none;
            flex-wrap: wrap;
            gap: 12px;
        }

        .images_header h2 {
            font-size: 1.3rem;
            color: #111827;
            margin: 0;
        }

        .add-folder-btn {
            background: transparent;
            border: none;
            font-size: 1.8rem;
            color: #1e293b;
            cursor: pointer;
            padding: 0 6px;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            width: 44px;
            height: 44px;
            background: #f1f5f9;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }

        .add-folder-btn i { font-size: 1.6rem; color: #334155; }
        .add-folder-btn:hover { background: #e2e8f0; transform: scale(1.04); color: #0f172a; }
        .add-folder-btn:active { transform: scale(0.94); }

        .header-left { display: flex; align-items: center; gap: 12px; }
        .header-actions { display: flex; align-items: center; gap: 8px; }

        .images_grid {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: flex-start;
            align-content: flex-start;
            justify-content: flex-start;
            background: #f9fafb;
            border-radius: 12px;
            padding: 24px;
            min-height: 400px;
            border: 1px solid #e5e7eb;
            transition: 0.2s;
            position: relative;
            overflow-y: auto;
        }

        /* ===== IMAGE CARD ===== */
        .image-card {
            width: 140px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
            background: white;
            transition: 0.2s;
            cursor: grab;
            display: flex;
            flex-direction: column;
            align-self: flex-start;
            flex-shrink: 0;
            user-select: none;
            touch-action: none;
        }

        .image-card:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 14px rgba(0,0,0,0.08);
        }

        .image-card.dragging { opacity: 0.35; cursor: grabbing; }

        .image-card .image-wrapper {
            width: 100%;
            height: 140px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
        }

        .image-card .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            -webkit-user-drag: none;
            user-select: none;
            pointer-events: none;
        }

        .image-card .image-name {
            padding: 6px 8px;
            font-size: 11px;
            color: #374151;
            text-align: center;
            word-break: break-all;
            font-weight: 500;
            background: #f8fafc;
            border-top: 1px solid #eef2f6;
            min-height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .image-card .image-name:hover { background: #eef2f6; }

        .image-name-input {
            background: white;
            border: 2px solid #3b82f6;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            color: #1e293b;
            outline: none;
            min-width: 80px;
            text-align: center;
            font-family: inherit;
            font-weight: 500;
            width: 100%;
            box-sizing: border-box;
        }

        .image-name-input:focus { box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }

        /* ===== FOLDER CARD ===== */
        .folder-card {
            width: 125px;
            height: 100px;
            border-radius: 12px;
            background: #eef2f6;
            border: 1px solid #d1d9e6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #1e293b;
            font-size: 0.85rem;
            font-weight: 500;
            transition: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            cursor: grab;
            gap: 4px;
            position: relative;
            user-select: none;
            touch-action: none;
            align-self: flex-start;
            flex-shrink: 0;
        }

        .folder-card.dragging {
            opacity: 0.35;
            cursor: grabbing;
            border-color: #3b82f6;
        }

        .folder-card i {
            font-size: 2.8rem;
            color: #475569;
            margin-bottom: 2px;
            pointer-events: none;
        }

        .folder-name {
            background: #dce3ec;
            padding: 2px 14px;
            border-radius: 30px;
            font-size: 0.7rem;
            color: #1e293b;
            letter-spacing: 0.3px;
            cursor: pointer;
            transition: 0.2s;
            user-select: none;
            min-width: 40px;
            text-align: center;
            display: inline-block;
            pointer-events: auto;
        }

        .folder-name:hover { background: #c8d2e0; transform: scale(1.05); }

        .folder-name-input {
            background: white;
            border: 2px solid #3b82f6;
            padding: 2px 10px;
            border-radius: 30px;
            font-size: 0.7rem;
            color: #1e293b;
            outline: none;
            min-width: 60px;
            text-align: center;
            font-family: inherit;
            font-weight: 500;
        }

        .folder-name-input:focus { box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }
        .folder-card:hover { background: #e2e8f0; border-color: #94a3b8; }

        /* ===== DRAG GHOST ===== */
        .drag-ghost {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.85;
            transform: scale(1.08);
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            border-color: #3b82f6;
            background: #eef2f6;
            border-radius: 12px;
            padding: 10px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .drag-ghost i { font-size: 2.8rem; color: #475569; }
        .drag-ghost span {
            background: #dce3ec;
            padding: 2px 14px;
            border-radius: 30px;
            font-size: 0.7rem;
            color: #1e293b;
        }

        /* ===== INSERTION INDICATOR ===== */
        .insert-indicator {
            position: absolute;
            width: 4px;
            background: #3b82f6;
            border-radius: 2px;
            pointer-events: none;
            z-index: 100;
            transition: left 0.06s ease, top 0.06s ease, height 0.06s ease;
            display: none;
            box-shadow: 0 0 8px rgba(59, 130, 246, 0.6);
        }
        .insert-indicator.show { display: block; }

        @media (max-width: 768px) {
            .images_grid { min-height: 300px; padding: 16px; gap: 15px; }
            .image-card { width: 100px; }
            .image-card .image-wrapper { height: 100px; }
            .image-card .image-name { font-size: 10px; padding: 4px 6px; min-height: 28px; }
            .folder-card { width: 100px; height: 100px; }
            .add-folder-btn { width: 38px; height: 38px; font-size: 1.4rem; }
            .add-folder-btn i { font-size: 1.3rem; }
        }

        @media (max-width: 480px) {
            .images_grid { min-height: 200px; gap: 12px; padding: 12px; }
            .images_header h2 { font-size: 1rem; }
            .image-card { width: 80px; }
            .image-card .image-wrapper { height: 80px; }
            .image-card .image-name { font-size: 9px; padding: 3px 4px; min-height: 24px; }
            .folder-card { width: 80px; height: 80px; }
            .folder-card i { font-size: 2rem; }
            .add-folder-btn { width: 34px; height: 34px; }
            .add-folder-btn i { font-size: 1.1rem; }
        }

        .custom-context-menu {
            position: fixed;
            z-index: 10000;
            min-width: 180px;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            padding: 6px;
            display: none;
        }
        .custom-context-menu.open { display: block; }
        .ccm-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 12px;
            border-radius: 7px;
            font-size: 0.85rem;
            color: #1f2937;
            cursor: pointer;
        }
        .ccm-item i { width: 16px; text-align: center; color: #475569; }
        .ccm-item:hover { background: #f1f5f9; }
        .ccm-item.ccm-danger { color: #dc2626; }
        .ccm-item.ccm-danger i { color: #dc2626; }
        .ccm-item.ccm-danger:hover { background: #fee2e2; }
        .ccm-separator { height: 1px; background: #eef0f3; margin: 5px 4px; }

        .highlight-match {
            background-color: yellow !important;
            color: #000 !important;
            border-radius: 2px;
            padding: 0 2px;
        }
        .no-match-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 16px 32px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            border: 1px solid #e5e7eb;
            color: #6b7280;
            font-size: 1rem;
            font-weight: 500;
            display: none;
            z-index: 50;
            pointer-events: none;
        }
        .no-match-message.show { display: block; }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="logo">CloudHaux</div>
        <div class="search-container">
            <input type="search" placeholder="Search files..." id="globalSearch">
            <i class="fas fa-search search-icon"></i>
        </div>
        <div class="profile">
            <svg viewBox="0 0 24 24">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
        </div>
    </header>

    <nav class="left_nav_bar">
        <button type="button" class="add_file_btn" id="addFileBtn">+ Add Files</button>
        <a href="#all_files">All Files</a>
        <a href="#recent_files">Recent</a>
        <a href="#favorites">Favorites</a>
        <a href="#trash">Trash</a>
    </nav>

    <main class="dashboard_content">
        <div class="main_content">
            <section class="images_viewer">
                <div class="images_header">
                    <div class="header-left"><h2>Images</h2></div>
                    <div class="header-actions">
                        <button class="add-folder-btn" id="addFolderBtn" title="Create new folder">
                            <i class="fas fa-folder-plus"></i>
                        </button>
                    </div>
                </div>
                <div class="images_grid" id="imageGrid">
                    <div class="no-match-message" id="noMatchMessage">No file match</div>
                </div>
            </section>
        </div>

        <aside class="right_panel">
            <div class="button_group">
                <button class="category_btn images" onclick="window.location.href='images_page.html'">
                    <i class="fas fa-image"></i> Images
                </button>
                <button class="category_btn documents" onclick="window.location.href='documents_page.html'">
                    <i class="fas fa-file-alt"></i> Documents
                </button>
                <button class="category_btn media_files" onclick="window.location.href='media_page.html'">
                    <i class="fas fa-video"></i> Media
                </button>
                <button class="category_btn audio_files" onclick="window.location.href='audio_page.html'">
                    <i class="fas fa-music"></i> Audio
                </button>
                <button class="category_btn safe_vault" onclick="window.location.href='dashboard.html'">
                    <i class="fas fa-lock"></i> Safe Vault
                </button>
            </div>
        </aside>
    </main>

    <input type="file" id="fileInput" accept="image/*" multiple style="display:none;">

    <div class="custom-context-menu" id="customContextMenu">
        <div class="ccm-item" id="ccmShare"><i class="fas fa-share-alt"></i> Share</div>
        <div class="ccm-item" id="ccmMove"><i class="fas fa-folder-open"></i> Move to</div>
        <div class="ccm-separator"></div>
        <div class="ccm-item ccm-danger" id="ccmDelete"><i class="fas fa-trash"></i> Delete</div>
    </div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    "use strict";

    const fileInput = document.getElementById("fileInput");
    const addBtn = document.getElementById("addFileBtn");
    const imageGrid = document.getElementById("imageGrid");
    const addFolderBtn = document.getElementById("addFolderBtn");
    const searchInput = document.getElementById("globalSearch");
    const noMatchMsg = document.getElementById("noMatchMessage");

    if (!fileInput || !addBtn || !imageGrid || !addFolderBtn || !searchInput) {
        console.error('Elements not found');
        return;
    }

    let dragData = null;
    let ghostElement = null;
    let indicatorEl = null;

    const contextMenu = document.getElementById('customContextMenu');
    let contextTarget = null;
    const ccmDelete = document.getElementById('ccmDelete');

    function openContextMenu(x, y, targetCard) {
        contextTarget = targetCard;
        const maxX = window.innerWidth - 190;
        const maxY = window.innerHeight - 120;
        contextMenu.style.left = Math.min(x, maxX) + 'px';
        contextMenu.style.top = Math.min(y, maxY) + 'px';
        contextMenu.classList.add('open');
    }

    function closeContextMenu() {
        contextMenu.classList.remove('open');
        contextTarget = null;
    }

    function attachContextMenu(card) {
        card.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            e.stopPropagation();
            openContextMenu(e.clientX, e.clientY, card);
        });
    }

    ccmDelete.addEventListener('click', function(e) {
        e.stopPropagation();
        if (contextTarget) {
            const img = contextTarget.querySelector('img');
            if (img && img.src && img.src.startsWith('blob:')) {
                URL.revokeObjectURL(img.src);
            }
            contextTarget.style.transition = '0.2s';
            contextTarget.style.transform = 'scale(0.8)';
            contextTarget.style.opacity = '0';
            setTimeout(() => {
                contextTarget.remove();
                performSearch(searchInput.value);
            }, 200);
        }
        closeContextMenu();
    });

    document.addEventListener('click', function(e) {
        if (!contextMenu.contains(e.target)) closeContextMenu();
    });
    document.addEventListener('scroll', closeContextMenu, true);
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeContextMenu();
    });

    // ----- Rename image -----
    function makeImageNameEditable(nameSpan, imageCard) {
        const currentName = nameSpan.textContent;
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'image-name-input';
        input.value = currentName;

        nameSpan.replaceWith(input);
        input.focus();
        input.select();

        function saveRename() {
            const newName = input.value.trim() || currentName;
            const newSpan = document.createElement('div');
            newSpan.className = 'image-name';
            newSpan.textContent = newName;

            newSpan.addEventListener('click', function(e) {
                e.stopPropagation();
                makeImageNameEditable(newSpan, imageCard);
            });

            input.replaceWith(newSpan);
            imageCard.dataset.filename = newName;
            performSearch(searchInput.value);
        }

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
            else if (e.key === 'Escape') {
                const newSpan = document.createElement('div');
                newSpan.className = 'image-name';
                newSpan.textContent = currentName;
                newSpan.addEventListener('click', function(e) {
                    e.stopPropagation();
                    makeImageNameEditable(newSpan, imageCard);
                });
                input.replaceWith(newSpan);
            }
        });
        input.addEventListener('blur', saveRename);
    }

    // ----- Rename folder -----
    function makeFolderNameEditable(folderNameSpan, folderCard) {
        const currentName = folderNameSpan.textContent;
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'folder-name-input';
        input.value = currentName;

        folderNameSpan.replaceWith(input);
        input.focus();
        input.select();

        function saveRename() {
            const newName = input.value.trim() || currentName;
            const newSpan = document.createElement('span');
            newSpan.className = 'folder-name';
            newSpan.textContent = newName;
            newSpan.addEventListener('click', function(e) {
                e.stopPropagation();
                makeFolderNameEditable(newSpan, folderCard);
            });
            input.replaceWith(newSpan);
            performSearch(searchInput.value);
        }

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
            else if (e.key === 'Escape') {
                const newSpan = document.createElement('span');
                newSpan.className = 'folder-name';
                newSpan.textContent = currentName;
                newSpan.addEventListener('click', function(e) {
                    e.stopPropagation();
                    makeFolderNameEditable(newSpan, folderCard);
                });
                input.replaceWith(newSpan);
            }
        });
        input.addEventListener('blur', saveRename);
    }

    // ----- render images -----
    function renderImages(files) {
        const imageFiles = Array.from(files).filter((file) =>
            file.type.startsWith("image/")
        );

        if (imageFiles.length === 0) {
            alert("Please select image files (JPEG, PNG, GIF, etc.)");
            return;
        }

        imageFiles.forEach((file) => {
            const reader = new FileReader();
            reader.onload = function (loadEvent) {
                const imgSrc = loadEvent.target.result;

                const card = document.createElement("div");
                card.className = "image-card";
                card.dataset.filename = file.name;

                const wrapper = document.createElement("div");
                wrapper.className = "image-wrapper";

                const img = document.createElement("img");
                img.src = imgSrc;
                img.alt = file.name || "image";

                wrapper.appendChild(img);

                const nameLabel = document.createElement("div");
                nameLabel.className = "image-name";
                nameLabel.textContent = file.name;

                nameLabel.addEventListener('click', function(e) {
                    e.stopPropagation();
                    makeImageNameEditable(nameLabel, card);
                });

                card.addEventListener('dblclick', function(e) {
                    const nameEl = this.querySelector('.image-name');
                    if (nameEl && !e.target.closest('.image-wrapper')) {
                        makeImageNameEditable(nameEl, this);
                    }
                });

                card.appendChild(wrapper);
                card.appendChild(nameLabel);

                card.addEventListener('mousedown', function(e) {
                    initDrag(this, e);
                });
                card.addEventListener('touchstart', function(e) {
                    initDrag(this, e);
                }, { passive: true });

                imageGrid.appendChild(card);
                attachContextMenu(card);
                performSearch(searchInput.value);
            };
            reader.readAsDataURL(file);
        });
    }

    // ----- Drag helpers -----
    function createGhostElement(card) {
        const ghost = document.createElement('div');
        ghost.className = 'drag-ghost';

        const isFolder = card.classList.contains('folder-card');
        const icon = document.createElement('i');
        icon.className = isFolder ? 'fas fa-folder' : 'fas fa-image';

        const nameEl = card.querySelector('.folder-name') || card.querySelector('.image-name');
        const nameSpan = document.createElement('span');
        nameSpan.textContent = nameEl ? nameEl.textContent : (isFolder ? 'Folder' : 'Image');

        ghost.appendChild(icon);
        ghost.appendChild(nameSpan);
        return ghost;
    }

    function isInsideGrid(grid, clientX, clientY) {
        const rect = grid.getBoundingClientRect();
        return clientX >= rect.left && clientX <= rect.right &&
               clientY >= rect.top && clientY <= rect.bottom;
    }

    // closest-card + side detection
    function getInsertReference(cursorX, cursorY, draggedCard) {
        const allCards = Array.from(
            imageGrid.querySelectorAll('.folder-card, .image-card')
        ).filter(c => c !== draggedCard && c.style.display !== 'none');

        if (allCards.length === 0) return { before: null, after: false, rect: null };

        let closest = null;
        let closestDist = Infinity;
        let closestRect = null;

        for (const c of allCards) {
            const rect = c.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const dx = cursorX - cx;
            const dy = cursorY - cy;
            const dist = dx * dx + dy * dy;
            if (dist < closestDist) {
                closestDist = dist;
                closest = c;
                closestRect = rect;
            }
        }

        if (!closest) return { before: null, after: false, rect: null };

        const midX = closestRect.left + closestRect.width / 2;
        return { before: closest, after: cursorX >= midX, rect: closestRect };
    }

    function showInsertIndicator(cursorX, cursorY) {
        if (!indicatorEl) {
            indicatorEl = document.createElement('div');
            indicatorEl.className = 'insert-indicator';
            imageGrid.appendChild(indicatorEl);
        }

        const gridRect = imageGrid.getBoundingClientRect();
        const scrollLeft = imageGrid.scrollLeft;
        const scrollTop = imageGrid.scrollTop;
        const { before, after, rect } = getInsertReference(cursorX, cursorY, dragData.card);

        if (before && rect) {
            if (after) {
                indicatorEl.style.left = (rect.right - gridRect.left + scrollLeft + 8) + 'px';
            } else {
                indicatorEl.style.left = (rect.left - gridRect.left + scrollLeft - 12) + 'px';
            }
            indicatorEl.style.top  = (rect.top - gridRect.top + scrollTop) + 'px';
            indicatorEl.style.height = rect.height + 'px';
            indicatorEl.classList.add('show');
        } else {
            indicatorEl.classList.remove('show');
        }
    }

    function hideInsertIndicator() {
        if (indicatorEl) indicatorEl.classList.remove('show');
    }

    function initDrag(card, e) {
        if (e.target.closest('.folder-name-input') || e.target.closest('.folder-name') ||
            e.target.closest('.image-name-input') || e.target.closest('.image-name')) {
            return;
        }

        const startX = e.clientX || e.touches?.[0]?.clientX || 0;
        const startY = e.clientY || e.touches?.[0]?.clientY || 0;

        dragData = {
            card: card,
            startX: startX,
            startY: startY,
            isDragging: false
        };

        ghostElement = createGhostElement(card);
        document.body.appendChild(ghostElement);
        ghostElement.style.display = 'none';

        card.classList.add('dragging');
    }

    function moveDrag(e) {
        if (!dragData || !ghostElement) return;

        const clientX = e.clientX || e.touches?.[0]?.clientX || 0;
        const clientY = e.clientY || e.touches?.[0]?.clientY || 0;

        const dx = clientX - dragData.startX;
        const dy = clientY - dragData.startY;

        if (!dragData.isDragging && (Math.abs(dx) > 5 || Math.abs(dy) > 5)) {
            dragData.isDragging = true;
            ghostElement.style.display = 'flex';
        }

        if (dragData.isDragging) {
            ghostElement.style.left = (clientX - 62) + 'px';
            ghostElement.style.top = (clientY - 50) + 'px';

            if (isInsideGrid(imageGrid, clientX, clientY)) {
                showInsertIndicator(clientX, clientY);
            } else {
                hideInsertIndicator();
            }
        }
    }

    // ✅ FIXED: detach first, then reinsert — no stale sibling refs
    function endDrag(e) {
        if (!dragData) return;

        const clientX = e.clientX || e.changedTouches?.[0]?.clientX || 0;
        const clientY = e.clientY || e.changedTouches?.[0]?.clientY || 0;

        if (dragData.isDragging) {
            const inside = isInsideGrid(imageGrid, clientX, clientY);

            if (inside) {
                const card1 = dragData.card;

                // 1. Compute the insert reference WHILE card1 is still in the DOM.
                //    getInsertReference filters out card1, so `before` is a different card.
                const { before, after } = getInsertReference(clientX, clientY, card1);

                if (before) {
                    // 2. Detach card1 first so any `before.nextSibling` won't be card1.
                    if (card1.parentNode) card1.parentNode.removeChild(card1);

                    // 3. Now insert cleanly
                    if (after) {
                        const ref = before.nextSibling;
                        if (ref) {
                            imageGrid.insertBefore(card1, ref);
                        } else {
                            imageGrid.appendChild(card1);
                        }
                    } else {
                        imageGrid.insertBefore(card1, before);
                    }
                }
                // else: no other cards exist — leave card1 where it was (still attached)

                performSearch(searchInput.value);
            }
        }

        hideInsertIndicator();

        if (ghostElement) {
            ghostElement.remove();
            ghostElement = null;
        }
        if (dragData.card) {
            dragData.card.classList.remove('dragging');
        }
        dragData = null;
    }

    // ----- Add folder -----
    function createFolderCard() {
        const folderCount = imageGrid.querySelectorAll('.folder-card').length + 1;
        const folderName = `Folder ${folderCount}`;

        const card = document.createElement('div');
        card.className = 'folder-card';

        const icon = document.createElement('i');
        icon.className = 'fas fa-folder';

        const nameSpan = document.createElement('span');
        nameSpan.className = 'folder-name';
        nameSpan.textContent = folderName;

        nameSpan.addEventListener('click', function(e) {
            e.stopPropagation();
            makeFolderNameEditable(nameSpan, card);
        });

        card.addEventListener('dblclick', function(e) {
            const nameEl = this.querySelector('.folder-name');
            if (nameEl) makeFolderNameEditable(nameEl, this);
        });

        card.addEventListener('mousedown', function(e) {
            initDrag(this, e);
        });
        card.addEventListener('touchstart', function(e) {
            initDrag(this, e);
        }, { passive: true });

        card.appendChild(icon);
        card.appendChild(nameSpan);
        imageGrid.appendChild(card);
        attachContextMenu(card);
        performSearch(searchInput.value);
    }

    // Global drag listeners
    document.addEventListener('mousemove', moveDrag);
    document.addEventListener('touchmove', moveDrag, { passive: true });
    document.addEventListener('mouseup', endDrag);
    document.addEventListener('touchend', endDrag);
    document.addEventListener('touchcancel', endDrag);

    // ----- Search -----
    function performSearch(query) {
        const cards = imageGrid.querySelectorAll('.image-card, .folder-card');
        const normalizedQuery = query.trim().toLowerCase();
        let anyMatch = false;

        cards.forEach(card => {
            let nameEl = card.querySelector('.folder-name') || card.querySelector('.image-name');
            if (nameEl && nameEl.innerHTML.includes('highlight-match')) {
                nameEl.innerHTML = nameEl.textContent;
            }
            card.style.display = '';
        });

        if (normalizedQuery === '') {
            noMatchMsg.classList.remove('show');
            return;
        }

        cards.forEach(card => {
            let nameEl = card.querySelector('.folder-name') || card.querySelector('.image-name');
            if (!nameEl) return;
            const fileName = nameEl.textContent.toLowerCase();
            const match = fileName.includes(normalizedQuery);
            if (match) {
                anyMatch = true;
                const originalText = nameEl.textContent;
                const lowerText = originalText.toLowerCase();
                const startIdx = lowerText.indexOf(normalizedQuery);
                if (startIdx !== -1) {
                    const before = originalText.substring(0, startIdx);
                    const matchText = originalText.substring(startIdx, startIdx + normalizedQuery.length);
                    const after = originalText.substring(startIdx + normalizedQuery.length);
                    nameEl.innerHTML = `${before}<span class="highlight-match">${matchText}</span>${after}`;
                }
                card.style.display = '';
            } else {
                card.style.display = 'none';
            }
        });

        if (!anyMatch && normalizedQuery !== '') {
            noMatchMsg.classList.add('show');
        } else {
            noMatchMsg.classList.remove('show');
        }
    }

    // ----- Event listeners -----
    addBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        fileInput.click();
    });

    fileInput.addEventListener("change", function (e) {
        const files = e.target.files;
        if (!files || files.length === 0) return;
        renderImages(files);
        fileInput.value = "";
    });

    imageGrid.addEventListener("dragover", function (e) {
        e.preventDefault();
        this.style.backgroundColor = "#f0f4ff";
    });
    imageGrid.addEventListener("dragleave", function (e) {
        this.style.backgroundColor = "#f9fafb";
    });

    imageGrid.addEventListener("drop", function (e) {
        e.preventDefault();
        this.style.backgroundColor = "#f9fafb";
        if (dragData && dragData.isDragging) return;

        const files = e.dataTransfer.files;
        if (files && files.length > 0) {
            renderImages(files);
        }
    });

    addFolderBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        createFolderCard();
    });

    searchInput.addEventListener('input', function(e) {
        performSearch(e.target.value);
    });

    setTimeout(() => { createFolderCard(); }, 100);
});
</script>
</body>
