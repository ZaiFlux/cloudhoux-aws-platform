<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CloudHaux · Images</title>
  <!-- Font Awesome 6 (free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    /* ----- RESET & BASE ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      flex-direction: column;
    }

    /* ----- TOPBAR ----- */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 70px;
      display: flex;
      align-items: center;
      padding: 0 25px;
      background: white;
      z-index: 1000;
      border-bottom: 1px solid #e5e7eb;
    }

    .logo {
      width: 180px;
      font-size: 1.2rem;
      font-weight: 700;
      color: #2563eb;
      cursor: pointer;
    }

    .search_box {
      flex: 1;
      display: flex;
      justify-content: center;
      margin-right: 230px;
    }

    .search-container {
      position: relative;
      width: 450px;
    }

    .search-container input {
      width: 100%;
      padding: 10px 40px 10px 15px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      outline: none;
      font-size: 14px;
    }

    .search-container input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .search-icon {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #9ca3af;
      pointer-events: none;
      font-size: 16px;
    }

    .profile {
      width: 42px;
      height: 42px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-left: auto;
      border-radius: 50%;
      background: #d1d5db;
      cursor: pointer;
      transition: 0.2s;
    }

    .profile:hover {
      background: #b0b8c4;
    }

    .profile svg {
      width: 20px;
      height: 20px;
    }

    /* ----- LEFT NAV (RETAINED) ----- */
    .left_nav_bar {
      position: fixed;
      top: 90px;
      left: 0;
      width: 220px;
      height: calc(100vh - 90px);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 25px;
      border-right: 1px solid #e5e7eb;
      background: white;
      overflow-y: auto;
    }

    .left_nav_bar a {
      display: block;
      padding: 12px 16px;
      border-radius: 10px;
      text-decoration: none;
      color: #111827;
      cursor: pointer;
      transition: 0.2s;
    }

    .left_nav_bar a:hover {
      background: #f3f4f6;
    }

    .add_file_btn {
      width: 60%;
      padding: 10px;
      background-color: #3b82f6;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: -20px;
      text-align: left;
      transition: 0.2s;
    }

    .add_file_btn:hover {
      background-color: #2563eb;
      transform: scale(1.02);
    }

    .add_file_btn:active {
      transform: scale(0.98);
    }

    /* ----- DASHBOARD LAYOUT (with right panel) ----- */
    .dashboard_content {
      margin-left: 220px;
      margin-top: 70px;
      padding: 30px;
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 40px;
      min-height: calc(100vh - 70px);
    }

    .main_content {
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    /* ----- AUDIO VIEWER – empty state ----- */
    .audio_viewer {
      width: 100%;
      min-height: 80vh;
      background: white;
      border-radius: 16px;
      border: 1px solid #d9d9d9;
      padding: 30px;
      display: flex;
      flex-direction: column;
    }

    .audio_header {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 25px;
      padding-bottom: 15px;
      /* remove bottom border so no horizontal line under "Audio" */
      border-bottom: none;
    }

    .audio_header h2 {
      font-size: 1.3rem;
      color: #111827;
      text-align: center;
    }

    /* hide back button, action buttons */
    .back_btn,
    .audio_actions {
      display: none !important;
    }

    /* hide metadata footer (horizontal line) */
    .image_info {
      display: none !important;
    }

    /* audio grid – empty state with message */
    .audio_grid {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f9fafb;
      border-radius: 12px;
      padding: 20px;
      min-height: 400px;
      border: 1px solid #e5e7eb;
      color: #6b7280;
      font-size: 1.2rem;
    }

    .audio_grid::before {
      content: "No audio files";
      font-weight: 400;
      letter-spacing: 0.3px;
      opacity: 0.7;
    }

    /* hide any leftover audio items */
    .audio_item {
      display: none;
    }

    /* ----- RIGHT PANEL (RETAINED) ----- */
    .right_panel {
      border-left: 1px solid #ddd;
      padding-left: 30px;
      display: flex;
      flex-direction: column;
    }

    .button_group {
      margin-top: 300px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .category_btn {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 16px;
      background: #f7f7f7;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.25s;
    }

    .category_btn:hover {
      background: #2563eb;
      color: white;
      transform: translateX(6px);
      box-shadow: 0 10px 20px rgba(37, 99, 235, 0.25);
    }

    .category_btn i {
      width: 24px;
      font-size: 20px;
    }

    .category_btn.images:hover {
      background: #2563eb;
    }
    .category_btn.documents:hover {
      background: #7c3aed;
    }
    .category_btn.media_files:hover {
      background: #dc2626;
    }
    .category_btn.audio_files:hover {
      background: #059669;
    }
    .category_btn.safe_vault:hover {
      background: #d97706;
    }

    /* ----- SCROLLBAR ----- */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }
    ::-webkit-scrollbar-thumb {
      background: #c1c7d0;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #a0a7b0;
    }

    /* ----- RESPONSIVE ----- */
    @media (max-width: 1024px) {
      .dashboard_content {
        grid-template-columns: 1fr 250px;
        gap: 30px;
      }
      .right_panel {
        padding-left: 20px;
      }
      .button_group {
        margin-top: 200px;
      }
    }

    @media (max-width: 768px) {
      .dashboard_content {
        grid-template-columns: 1fr;
        margin-left: 0;
        padding: 20px;
      }
      .left_nav_bar {
        display: none;
      }
      .topbar {
        padding: 0 15px;
      }
      .search-container {
        width: 100%;
      }
      .search_box {
        margin-right: 0;
      }
      .right_panel {
        border-left: none;
        border-top: 1px solid #ddd;
        padding: 20px 0 0 0;
      }
      .button_group {
        margin-top: 20px;
        flex-direction: row;
        flex-wrap: wrap;
      }
      .category_btn {
        width: auto;
        flex: 1;
        min-width: 120px;
        padding: 14px;
        font-size: 14px;
      }
      .audio_header {
        flex-wrap: wrap;
        gap: 10px;
      }
      .audio_header h2 {
        order: 3;
        width: 100%;
        text-align: center;
      }
      .audio_grid {
        min-height: 300px;
        font-size: 1rem;
      }
    }

    @media (max-width: 480px) {
      .audio_grid {
        min-height: 200px;
        font-size: 0.9rem;
      }
      .audio_header h2 {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <!-- ===== TOPBAR ===== -->
  <header class="topbar">
    <div class="logo">CloudHaux</div>
    <div class="search_box">
      <div class="search-container">
        <input type="search" placeholder="Search files...">
        <i class="fas fa-search search-icon"></i>
      </div>
    </div>
    <div class="profile">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
      </svg>
    </div>
  </header>

  <!-- ===== LEFT NAV (RETAINED) ===== -->
  <nav class="left_nav_bar">
    <button type="button" class="add_file_btn">+ Add Files</button>
    <a href="#all_files">All Files</a>
    <a href="#recent_files">Recent</a>
    <a href="#favorites">Favorites</a>
    <a href="#trash">Trash</a>
  </nav>

  <!-- ===== MAIN CONTENT (empty body, but both side panels retained) ===== -->
  <main class="dashboard_content">
    <div class="main_content">

      <!-- AUDIO VIEWER – empty state, no back button, no actions, no horizontal line -->
      <section class="audio_viewer">
        <div class="audio_header">
          <h2>Images</h2>
        </div>

        <!-- empty audio grid (no sample files) -->
        <div class="audio_grid">
          <!-- all .audio_item removed, grid shows "No audio files" via pseudo-element -->
        </div>
      </section>
    </div>

    <!-- ===== RIGHT PANEL (RETAINED) ===== -->
    <aside class="right_panel">
      <div class="button_group">
        <button class="category_btn images"><i class="fas fa-image"></i> Images</button>
        <button class="category_btn documents"><i class="fas fa-file-alt"></i> Documents</button>
        <button class="category_btn media_files"><i class="fas fa-video"></i> Media</button>
        <button class="category_btn audio_files"><i class="fas fa-music"></i> Audio</button>
        <button class="category_btn safe_vault"><i class="fas fa-lock"></i> Safe Vault</button>
      </div>
    </aside>
  </main>

</body>
</html>
