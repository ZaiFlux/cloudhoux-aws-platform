<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudHaux - Image Viewer</title>
    <link rel="stylesheet" href="../static/css/image_page.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!-- TOPBAR -->
    <header class="topbar">
        <div class="logo">
            CloudHaux
        </div>
        <div class="search_box">
            <div class="search-container">
                <input type="search" placeholder="Search files...">
                <i class="fas fa-search search-icon"></i>
            </div>
        </div>
        <div class="profile">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
        </div>
    </header>

    <!-- LEFT NAV -->
    <nav class="left_nav_bar">
        <button type="button" class="add_file_btn">
            + Add Files
        </button>
        <a href="#all_files">All Files</a>
        <a href="#recent_files">Recent</a>
        <a href="#favorites">Favorites</a>
        <a href="#trash">Trash</a>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="dashboard_content">
        <div class="main_content">
            <!-- Image Viewer Section -->
            <section class="image_viewer">
                <div class="image_header">
                    <button class="back_btn">
                        <i class="fas fa-arrow-left"></i> Back
                    </button>
                    <h2>Image Viewer</h2>
                    <div class="image_actions">
                        <button class="action_btn" title="Download">
                            <i class="fas fa-download"></i>
                        </button>
                        <button class="action_btn" title="Favorite">
                            <i class="fas fa-star"></i>
                        </button>
                        <button class="action_btn" title="Share">
                            <i class="fas fa-share-alt"></i>
                        </button>
                        <button class="action_btn" title="Delete">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
                
                <div class="image_container">
                    <img src="https://via.placeholder.com/800x600/3b82f6/ffffff?text=Sample+Image" alt="Sample Image" class="displayed_image">
                </div>
                
                <div class="image_info">
                    <div class="info_left">
                        <h3>sample_image.jpg</h3>
                        <div class="image_meta">
                            <span><i class="far fa-calendar-alt"></i> Dec 15, 2026</span>
                            <span><i class="far fa-file"></i> 2.4 MB</span>
                            <span><i class="fas fa-expand"></i> 1920 x 1080</span>
                        </div>
                    </div>
                    <div class="info_right">
                        <span class="file_type_badge">Image</span>
                        <span class="file_status">Public</span>
                    </div>
                </div>
            </section>
        </div>

        <!-- RIGHT PANEL -->
        <aside class="right_panel">
            <div class="button_group">
                <button class="category_btn images">
                    <i class="fas fa-image"></i> Images
                </button>
                <button class="category_btn documents">
                    <i class="fas fa-file-alt"></i> Documents
                </button>
                <button class="category_btn media_files">
                    <i class="fas fa-video"></i> Media
                </button>
                <button class="category_btn audio_files">
                    <i class="fas fa-music"></i> Audio
                </button>
                <button class="category_btn safe_vault">
                    <i class="fas fa-lock"></i> Safe Vault
                </button>
            </div>
        </aside>
    </main>
</body>
</html>
