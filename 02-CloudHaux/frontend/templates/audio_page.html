<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudHaux · Audio</title>
    <link rel="stylesheet" href="../static/css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* Audio specific styles */
        .audio_viewer {
            width: 100%;
            min-height: 400px;
            padding: 20px;
            border: 1px solid #d9d9d9;
            border-radius: 16px;
            background: white;
            display: flex;
            flex-direction: column;
        }

        .audio_header {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: none;
        }

        .audio_header h2 {
            font-size: 1.3rem;
            color: #111827;
            text-align: center;
        }

        .audio_grid {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f9fafb;
            border-radius: 12px;
            padding: 20px;
            min-height: 300px;
            border: 1px solid #e5e7eb;
            color: #6b7280;
            font-size: 1.2rem;
        }

        .audio_grid::before {
            content: "No audio files";
            font-weight: 400;
            letter-spacing: 0.3px;
            opacity: 0.7;
        }

        .back-to-dashboard {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            text-align: center;
            width: fit-content;
        }

        .back-to-dashboard:hover {
            background: #2563eb;
            transform: scale(1.02);
        }

        .category_btn i {
            width: 24px;
            font-size: 20px;
        }

        .category_btn.images:hover {
            background: #2563eb;
            color: white;
        }
        .category_btn.documents:hover {
            background: #7c3aed;
            color: white;
        }
        .category_btn.media_files:hover {
            background: #dc2626;
            color: white;
        }
        .category_btn.audio_files:hover {
            background: #059669;
            color: white;
        }
        .category_btn.safe_vault:hover {
            background: #d97706;
            color: white;
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="logo">CloudHaux</div>
        <div class="search-container">
            <input type="search" placeholder="Search files...">
            <i class="fas fa-search search-icon"></i>
        </div>
        <div class="profile">
            <svg viewBox="0 0 24 24">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
        </div>
    </header>

    <nav class="left_nav_bar">
        <button type="button" class="add_file_btn">+ Add Files</button>
        <a href="#all_files">All Files</a>
        <a href="#recent_files">Recent</a>
        <a href="#favorites">Favorites</a>
        <a href="#trash">Trash</a>
    </nav>

    <main class="dashboard_content">
        <div class="main_content">
            <section class="audio_viewer">
                <div class="audio_header">
                    <h2>Audio</h2>
                </div>
                <div class="audio_grid"></div>
                
                <a href="dashboard.html" class="back-to-dashboard">
                    <i class="fas fa-arrow-left"></i> Back to Dashboard
                </a>
            </section>
        </div>

        <aside class="right_panel">
            <div class="button_group">
                <button class="category_btn images" onclick="window.location.href='dashboard.html'">
                    <i class="fas fa-image"></i> Images
                </button>
                <button class="category_btn documents" onclick="window.location.href='dashboard.html'">
                    <i class="fas fa-file-alt"></i> Documents
                </button>
                <button class="category_btn media_files" onclick="window.location.href='dashboard.html'">
                    <i class="fas fa-video"></i> Media
                </button>
                <button class="category_btn audio_files" onclick="window.location.href='dashboard.html'">
                    <i class="fas fa-music"></i> Audio
                </button>
                <button class="category_btn safe_vault" onclick="window.location.href='dashboard.html'">
                    <i class="fas fa-lock"></i> Safe Vault
                </button>
            </div>
        </aside>
    </main>
</body>
</html>
