<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudHaux · Images</title>
    <link rel="stylesheet" href="../static/css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* ----- IMAGES PAGE SPECIFIC STYLES ----- */
        .images_viewer {
            width: 100%;
            min-height: 400px;
            padding: 30px;
            border: 1px solid #d9d9d9;
            border-radius: 16px;
            background: white;
            display: flex;
            flex-direction: column;
        }

        .images_header {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: none;
        }

        .images_header h2 {
            font-size: 1.3rem;
            color: #111827;
            text-align: center;
        }

        .images_grid {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: flex-start;
            justify-content: flex-start;
            background: #f9fafb;
            border-radius: 12px;
            padding: 24px;
            min-height: 400px;
            border: 1px solid #e5e7eb;
            transition: 0.2s;
        }

        /* Empty state - NO TEXT */
        .images_grid:empty {
            /* No content, just empty */
        }

        /* image card */
        .image-card {
            width: 140px;
            height: 140px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
            background: white;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: default;
        }

        .image-card:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 14px rgba(0,0,0,0.08);
        }

        .image-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .images_grid {
                min-height: 300px;
                padding: 16px;
            }
            .image-card {
                width: 100px;
                height: 100px;
            }
        }

        @media (max-width: 480px) {
            .images_grid {
                min-height: 200px;
                gap: 12px;
                padding: 12px;
            }
            .images_header h2 {
                font-size: 1rem;
            }
            .image-card {
                width: 80px;
                height: 80px;
            }
        }
    </style>
</head>
<body>
    <!-- ===== TOPBAR ===== -->
    <header class="topbar">
        <div class="logo">CloudHaux</div>
        <div class="search-container">
            <input type="search" placeholder="Search files...">
            <i class="fas fa-search search-icon"></i>
        </div>
        <div class="profile">
            <svg viewBox="0 0 24 24">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
        </div>
    </header>

    <!-- ===== LEFT NAV ===== -->
    <nav class="left_nav_bar">
        <button type="button" class="add_file_btn" id="addFileBtn">+ Add Files</button>
        <a href="#all_files">All Files</a>
        <a href="#recent_files">Recent</a>
        <a href="#favorites">Favorites</a>
        <a href="#trash">Trash</a>
    </nav>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="dashboard_content">
        <div class="main_content">
            <section class="images_viewer">
                <div class="images_header">
                    <h2>Images</h2>
                </div>
                <div class="images_grid" id="imageGrid"></div>
            </section>
        </div>

        <!-- ===== RIGHT PANEL ===== -->
        <aside class="right_panel">
            <div class="button_group">
                <button class="category_btn images" onclick="window.location.href='images_page.html'">
                    <i class="fas fa-image"></i> Images
                </button>
                <button class="category_btn documents" onclick="window.location.href='documents_page.html'">
                    <i class="fas fa-file-alt"></i> Documents
                </button>
                <button class="category_btn media_files" onclick="window.location.href='media_page.html'">
                    <i class="fas fa-video"></i> Media
                </button>
                <button class="category_btn audio_files" onclick="window.location.href='audio_page.html'">
                    <i class="fas fa-music"></i> Audio
                </button>
                <button class="category_btn safe_vault" onclick="window.location.href='dashboard.html'">
                    <i class="fas fa-lock"></i> Safe Vault
                </button>
            </div>
        </aside>
    </main>

    <!-- hidden file input -->
    <input type="file" id="fileInput" accept="image/*" multiple style="display:none;">

    <!-- ===== JAVASCRIPT - Image upload functionality ===== -->
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        "use strict";

        const fileInput = document.getElementById("fileInput");
        const addBtn = document.getElementById("addFileBtn");
        const imageGrid = document.getElementById("imageGrid");

        if (!fileInput || !addBtn || !imageGrid) {
            console.error('Elements not found');
            return;
        }

        function renderImages(files) {
            const imageFiles = Array.from(files).filter((file) =>
                file.type.startsWith("image/")
            );
            
            if (imageFiles.length === 0) {
                alert("Please select image files (JPEG, PNG, GIF, etc.)");
                return;
            }

            imageFiles.forEach((file) => {
                const reader = new FileReader();
                reader.onload = function (loadEvent) {
                    const imgSrc = loadEvent.target.result;
                    const card = document.createElement("div");
                    card.className = "image-card";
                    const img = document.createElement("img");
                    img.src = imgSrc;
                    img.alt = file.name || "image";
                    card.appendChild(img);
                    imageGrid.appendChild(card);
                };
                reader.readAsDataURL(file);
            });
        }

        addBtn.addEventListener("click", function (e) {
            e.stopPropagation();
            fileInput.click();
        });

        fileInput.addEventListener("change", function (e) {
            const files = e.target.files;
            if (!files || files.length === 0) return;
            renderImages(files);
            fileInput.value = "";
        });

        imageGrid.addEventListener("dragover", function (e) {
            e.preventDefault();
            this.style.backgroundColor = "#f0f4ff";
        });
        imageGrid.addEventListener("dragleave", function (e) {
            this.style.backgroundColor = "#f9fafb";
        });
        imageGrid.addEventListener("drop", function (e) {
            e.preventDefault();
            this.style.backgroundColor = "#f9fafb";
            const files = e.dataTransfer.files;
            if (files && files.length > 0) {
                renderImages(files);
            }
        });
    });
    </script>
</body>
</html>
