<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudHaux · Media</title>
    <link rel="stylesheet" href="../static/css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* ----- MEDIA PAGE SPECIFIC STYLES ----- */
        .media_viewer {
            width: 100%;
            min-height: 400px;
            padding: 30px;
            border: 1px solid #d9d9d9;
            border-radius: 16px;
            background: white;
            display: flex;
            flex-direction: column;
        }

        .media_header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: none;
            flex-wrap: wrap;
            gap: 12px;
        }

        .media_header h2 {
            font-size: 1.3rem;
            color: #111827;
            margin: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ADD FOLDER BUTTON (icon only) - matches images page */
        .add-folder-btn {
            background: transparent;
            border: none;
            font-size: 1.8rem;
            color: #1e293b;
            cursor: pointer;
            padding: 0 6px;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            width: 44px;
            height: 44px;
            background: #f1f5f9;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }

        .add-folder-btn i {
            font-size: 1.6rem;
            color: #334155;
        }

        .add-folder-btn:hover {
            background: #e2e8f0;
            transform: scale(1.04);
            color: #0f172a;
        }

        .add-folder-btn:active {
            transform: scale(0.94);
        }

        .media_grid {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: flex-start;
            justify-content: flex-start;
            background: #f9fafb;
            border-radius: 12px;
            padding: 24px;
            min-height: 400px;
            border: 1px solid #e5e7eb;
            transition: 0.2s;
        }

        /* ----- FOLDER CARD — same as images page ----- */
        .folder-card {
            width: 125px;
            height: 100px;
            border-radius: 12px;
            background: #eef2f6;
            border: 1px solid #d1d9e6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #1e293b;
            font-size: 0.85rem;
            font-weight: 500;
            transition: 0.2s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            cursor: default;
            gap: 4px;
        }

        .folder-card i {
            font-size: 2.8rem;
            color: #475569;
            margin-bottom: 2px;
        }

        .folder-card span {
            background: #dce3ec;
            padding: 2px 14px;
            border-radius: 30px;
            font-size: 0.7rem;
            color: #1e293b;
            letter-spacing: 0.3px;
        }

        .folder-card:hover {
            background: #e2e8f0;
            border-color: #94a3b8;
        }

        /* media card */
        .media-card {
            width: 200px;
            padding: 12px;
            border-radius: 12px;
            background: white;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: default;
        }

        .media-card:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 14px rgba(0,0,0,0.08);
        }

        .media-card .media-icon {
            font-size: 56px;
            color: #dc2626;
        }

        .media-card .media-icon.audio-icon {
            color: #059669;
        }

        .media-card .media-icon.video-icon {
            color: #dc2626;
        }

        .media-card .media-name {
            font-size: 13px;
            color: #374151;
            text-align: center;
            word-break: break-all;
            max-width: 180px;
            font-weight: 500;
        }

        .media-card .media-size {
            font-size: 11px;
            color: #6b7280;
        }

        .media-card .media-type {
            font-size: 10px;
            padding: 2px 12px;
            border-radius: 20px;
            background: #f1f5f9;
            color: #475569;
            font-weight: 600;
            text-transform: uppercase;
        }

        @media (max-width: 768px) {
            .media_grid {
                min-height: 300px;
                padding: 16px;
            }
            .media-card {
                width: 150px;
                padding: 10px;
            }
            .media-card .media-icon {
                font-size: 40px;
            }
            .folder-card {
                width: 100px;
                height: 100px;
            }
            .add-folder-btn {
                width: 38px;
                height: 38px;
                font-size: 1.4rem;
            }
            .add-folder-btn i {
                font-size: 1.3rem;
            }
        }

        @media (max-width: 480px) {
            .media_grid {
                min-height: 200px;
                gap: 12px;
                padding: 12px;
            }
            .media_header h2 {
                font-size: 1rem;
            }
            .media-card {
                width: 120px;
                padding: 8px;
            }
            .media-card .media-icon {
                font-size: 32px;
            }
            .media-card .media-name {
                font-size: 11px;
                max-width: 100px;
            }
            .folder-card {
                width: 80px;
                height: 80px;
            }
            .folder-card i {
                font-size: 2rem;
            }
            .add-folder-btn {
                width: 34px;
                height: 34px;
            }
            .add-folder-btn i {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <!-- ===== TOPBAR ===== -->
    <header class="topbar">
        <div class="logo">CloudHaux</div>
        <div class="search-container">
            <input type="search" placeholder="Search files...">
            <i class="fas fa-search search-icon"></i>
        </div>
        <div class="profile">
            <svg viewBox="0 0 24 24">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
        </div>
    </header>

    <!-- ===== LEFT NAV ===== -->
    <nav class="left_nav_bar">
        <button type="button" class="add_file_btn" id="addFileBtn">+ Add Files</button>
        <a href="#all_files">All Files</a>
        <a href="#recent_files">Recent</a>
        <a href="#favorites">Favorites</a>
        <a href="#trash">Trash</a>
    </nav>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="dashboard_content">
        <div class="main_content">
            <section class="media_viewer">
                <div class="media_header">
                    <div class="header-left">
                        <h2>Media</h2>
                    </div>
                    <div class="header-actions">
                        <button class="add-folder-btn" id="addFolderBtn" title="Create new folder">
                            <i class="fas fa-folder-plus"></i>
                        </button>
                    </div>
                </div>
                <div class="media_grid" id="mediaGrid"></div>
            </section>
        </div>

        <!-- ===== RIGHT PANEL ===== -->
        <aside class="right_panel">
            <div class="button_group">
                <button class="category_btn images" onclick="window.location.href='images_page.html'">
                    <i class="fas fa-image"></i> Images
                </button>
                <button class="category_btn documents" onclick="window.location.href='documents_page.html'">
                    <i class="fas fa-file-alt"></i> Documents
                </button>
                <button class="category_btn media_files" onclick="window.location.href='media_page.html'">
                    <i class="fas fa-video"></i> Media
                </button>
                <button class="category_btn audio_files" onclick="window.location.href='audio_page.html'">
                    <i class="fas fa-music"></i> Audio
                </button>
                <button class="category_btn safe_vault" onclick="window.location.href='dashboard.html'">
                    <i class="fas fa-lock"></i> Safe Vault
                </button>
            </div>
        </aside>
    </main>

    <!-- hidden file input -->
    <input type="file" id="fileInput" accept=".mp4,.mov,.avi,.mkv,.mp3,.wav,.ogg,.m4a" multiple style="display:none;">

    <!-- ===== JAVASCRIPT - Media upload + folder creation ===== -->
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        "use strict";

        const fileInput = document.getElementById("fileInput");
        const addBtn = document.getElementById("addFileBtn");
        const mediaGrid = document.getElementById("mediaGrid");
        const addFolderBtn = document.getElementById("addFolderBtn");

        if (!fileInput || !addBtn || !mediaGrid || !addFolderBtn) {
            console.error('Elements not found');
            return;
        }

        // Function to format file size
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // Get icon for media type
        function getMediaIcon(fileName) {
            const ext = fileName.split('.').pop().toLowerCase();
            const videoExts = ['mp4', 'mov', 'avi', 'mkv', 'webm', 'flv', 'wmv'];
            const audioExts = ['mp3', 'wav', 'ogg', 'm4a', 'flac', 'aac', 'wma'];
            
            if (videoExts.includes(ext)) {
                return { icon: 'fa-video', type: 'video', cssClass: 'video-icon' };
            } else if (audioExts.includes(ext)) {
                return { icon: 'fa-music', type: 'audio', cssClass: 'audio-icon' };
            }
            return { icon: 'fa-file-video', type: 'media', cssClass: '' };
        }

        // ----- render media files -----
        function renderMediaFiles(files) {
            const mediaFiles = Array.from(files);
            
            if (mediaFiles.length === 0) {
                alert("Please select media files (videos or audio)");
                return;
            }

            mediaFiles.forEach((file) => {
                const card = document.createElement("div");
                card.className = "media-card";
                
                const mediaInfo = getMediaIcon(file.name);
                
                // Icon
                const icon = document.createElement("div");
                icon.className = `media-icon ${mediaInfo.cssClass}`;
                icon.innerHTML = `<i class="fas ${mediaInfo.icon}"></i>`;
                
                // Name
                const name = document.createElement("div");
                name.className = "media-name";
                name.textContent = file.name;
                
                // Size
                const size = document.createElement("div");
                size.className = "media-size";
                size.textContent = formatFileSize(file.size);
                
                // Type badge
                const type = document.createElement("div");
                type.className = "media-type";
                type.textContent = mediaInfo.type;
                
                card.appendChild(icon);
                card.appendChild(name);
                card.appendChild(size);
                card.appendChild(type);
                mediaGrid.appendChild(card);
            });
        }

        // ----- ADD FOLDER (same as images page) -----
        function createFolderCard() {
            const folderCount = mediaGrid.querySelectorAll('.folder-card').length + 1;
            const folderName = `Folder ${folderCount}`;

            const card = document.createElement('div');
            card.className = 'folder-card';
            const icon = document.createElement('i');
            icon.className = 'fas fa-folder';
            const label = document.createElement('span');
            label.textContent = folderName;

            card.appendChild(icon);
            card.appendChild(label);
            mediaGrid.appendChild(card);
        }

        // ----- event listeners -----
        addBtn.addEventListener("click", function (e) {
            e.stopPropagation();
            fileInput.click();
        });

        fileInput.addEventListener("change", function (e) {
            const files = e.target.files;
            if (!files || files.length === 0) return;
            renderMediaFiles(files);
            fileInput.value = "";
        });

        // drag & drop - same as images page
        mediaGrid.addEventListener("dragover", function (e) {
            e.preventDefault();
            this.style.backgroundColor = "#f0f4ff";
        });
        mediaGrid.addEventListener("dragleave", function (e) {
            this.style.backgroundColor = "#f9fafb";
        });
        mediaGrid.addEventListener("drop", function (e) {
            e.preventDefault();
            this.style.backgroundColor = "#f9fafb";
            const files = e.dataTransfer.files;
            if (files && files.length > 0) {
                renderMediaFiles(files);
            }
        });

        // ----- ADD FOLDER BUTTON (same as images page) -----
        addFolderBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            createFolderCard();
        });
    });
    </script>
</body>
</html>
