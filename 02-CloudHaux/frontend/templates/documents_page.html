<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudHaux · Documents</title>
    <link rel="stylesheet" href="../static/css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .documents_viewer {
            width: 100%;
            min-height: 400px;
            padding: 30px;
            border: 1px solid #d9d9d9;
            border-radius: 16px;
            background: white;
            display: flex;
            flex-direction: column;
        }

        .documents_header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: none;
            flex-wrap: wrap;
            gap: 12px;
        }

        .documents_header h2 {
            font-size: 1.3rem;
            color: #111827;
            margin: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ADD FOLDER BUTTON (icon only) - matches images page */
        .add-folder-btn {
            background: transparent;
            border: none;
            font-size: 1.8rem;
            color: #1e293b;
            cursor: pointer;
            padding: 0 6px;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            width: 44px;
            height: 44px;
            background: #f1f5f9;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }

        .add-folder-btn i {
            font-size: 1.6rem;
            color: #334155;
        }

        .add-folder-btn:hover {
            background: #e2e8f0;
            transform: scale(1.04);
            color: #0f172a;
        }

        .add-folder-btn:active {
            transform: scale(0.94);
        }

        .documents_grid {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: flex-start;
            justify-content: flex-start;
            background: #f9fafb;
            border-radius: 12px;
            padding: 24px;
            min-height: 400px;
            border: 1px solid #e5e7eb;
            transition: 0.2s;
        }

        /* ----- FOLDER CARD — same as images page ----- */
        .folder-card {
            width: 125px;
            height: 100px;
            border-radius: 12px;
            background: #eef2f6;
            border: 1px solid #d1d9e6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #1e293b;
            font-size: 0.85rem;
            font-weight: 500;
            transition: 0.2s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            cursor: default;
            gap: 4px;
            position: relative;
        }

        .folder-card i {
            font-size: 2.8rem;
            color: #475569;
            margin-bottom: 2px;
        }

        .folder-card span {
            background: #dce3ec;
            padding: 2px 14px;
            border-radius: 30px;
            font-size: 0.7rem;
            color: #1e293b;
            letter-spacing: 0.3px;
        }

        .folder-card:hover {
            background: #e2e8f0;
            border-color: #94a3b8;
        }

        .folder-card .folder-remove {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            font-size: 12px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .folder-card:hover .folder-remove {
            display: flex;
        }

        .folder-card .folder-remove:hover {
            background: #dc2626;
            transform: scale(1.1);
        }

        .folder-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        .folder-overlay.active {
            display: flex;
        }

        .folder-modal {
            background: white;
            border-radius: 16px;
            padding: 30px;
            max-width: 700px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideUp 0.3s ease;
        }

        .folder-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e5e7eb;
        }

        .folder-modal-header h3 {
            font-size: 1.2rem;
            color: #111827;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .folder-modal-header h3 i {
            color: #f59e0b;
        }

        .folder-modal-close {
            background: none;
            border: none;
            font-size: 24px;
            color: #6b7280;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 8px;
            transition: 0.2s;
        }

        .folder-modal-close:hover {
            background: #f3f4f6;
            color: #111827;
        }

        .file-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            background: #f9fafb;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            margin-bottom: 8px;
            transition: 0.2s;
        }

        .file-item:hover {
            background: #f3f4f6;
            border-color: #7c3aed;
        }

        .file-item i {
            font-size: 18px;
            color: #6b7280;
            width: 24px;
            text-align: center;
        }

        .file-item .file-name {
            flex: 1;
            font-size: 13px;
            color: #374151;
        }

        .file-item .file-size {
            font-size: 12px;
            color: #6b7280;
            background: white;
            padding: 2px 10px;
            border-radius: 12px;
        }

        .uploading-indicator {
            display: none;
            padding: 20px;
            text-align: center;
            color: #6b7280;
            font-size: 14px;
        }

        .uploading-indicator.active {
            display: block;
        }

        .uploading-indicator i {
            font-size: 24px;
            color: #3b82f6;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @media (max-width: 768px) {
            .documents_grid {
                min-height: 300px;
                padding: 16px;
            }
            .folder-card {
                width: 100px;
                height: 100px;
            }
            .add-folder-btn {
                width: 38px;
                height: 38px;
                font-size: 1.4rem;
            }
            .add-folder-btn i {
                font-size: 1.3rem;
            }
            .folder-modal {
                padding: 20px;
                max-width: 95%;
            }
        }

        @media (max-width: 480px) {
            .documents_grid {
                min-height: 200px;
                gap: 12px;
                padding: 12px;
            }
            .documents_header h2 {
                font-size: 1rem;
            }
            .folder-card {
                width: 80px;
                height: 80px;
            }
            .folder-card i {
                font-size: 2rem;
            }
            .file-item {
                padding: 8px 10px;
                font-size: 12px;
            }
            .file-item .file-name {
                font-size: 11px;
            }
            .add-folder-btn {
                width: 34px;
                height: 34px;
            }
            .add-folder-btn i {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="logo">CloudHaux</div>
        <div class="search-container">
            <input type="search" placeholder="Search files...">
            <i class="fas fa-search search-icon"></i>
        </div>
        <div class="profile">
            <svg viewBox="0 0 24 24">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
        </div>
    </header>

    <nav class="left_nav_bar">
        <button type="button" class="add_file_btn" id="addFileBtn">
            <i class="fas fa-plus" style="margin-right: 8px;"></i> Add Files
        </button>
        <input type="file" id="fileInput" webkitdirectory multiple style="display:none;">
        <a href="#all_files">All Files</a>
        <a href="#recent_files">Recent</a>
        <a href="#favorites">Favorites</a>
        <a href="#trash">Trash</a>
    </nav>

    <main class="dashboard_content">
        <div class="main_content">
            <section class="documents_viewer">
                <div class="documents_header">
                    <div class="header-left">
                        <h2>📄 Documents</h2>
                    </div>
                    <div class="header-actions">
                        <button class="add-folder-btn" id="addFolderBtn" title="Create new folder">
                            <i class="fas fa-folder-plus"></i>
                        </button>
                    </div>
                </div>
                <div class="uploading-indicator" id="uploadingIndicator">
                    <i class="fas fa-spinner"></i> Uploading files...
                </div>
                <div class="documents_grid" id="documentsGrid"></div>
            </section>
        </div>

        <aside class="right_panel">
            <div class="button_group">
                <button class="category_btn images" onclick="window.location.href='images_page.html'">
                    <i class="fas fa-image"></i> Images
                </button>
                <button class="category_btn documents" onclick="window.location.href='documents_page.html'">
                    <i class="fas fa-file-alt"></i> Documents
                </button>
                <button class="category_btn media_files" onclick="window.location.href='media_page.html'">
                    <i class="fas fa-video"></i> Media
                </button>
                <button class="category_btn audio_files" onclick="window.location.href='audio_page.html'">
                    <i class="fas fa-music"></i> Audio
                </button>
                <button class="category_btn safe_vault" onclick="window.location.href='dashboard.html'">
                    <i class="fas fa-lock"></i> Safe Vault
                </button>
            </div>
        </aside>
    </main>

    <div class="folder-overlay" id="folderOverlay">
        <div class="folder-modal">
            <div class="folder-modal-header">
                <h3><i class="fas fa-folder"></i> <span id="modalFolderName">Folder</span></h3>
                <button class="folder-modal-close" id="modalCloseBtn">&times;</button>
            </div>
            <div id="modalFileList"></div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        "use strict";

        const fileInput = document.getElementById("fileInput");
        const addBtn = document.getElementById("addFileBtn");
        const documentsGrid = document.getElementById("documentsGrid");
        const uploadIndicator = document.getElementById("uploadingIndicator");
        const addFolderBtn = document.getElementById("addFolderBtn");
        
        const folderOverlay = document.getElementById("folderOverlay");
        const modalCloseBtn = document.getElementById("modalCloseBtn");
        const modalFolderName = document.getElementById("modalFolderName");
        const modalFileList = document.getElementById("modalFileList");

        const folderStore = {};

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function getFileIcon(fileName) {
            const ext = fileName.split('.').pop().toLowerCase();
            const icons = {
                'pdf': 'fa-file-pdf',
                'doc': 'fa-file-word',
                'docx': 'fa-file-word',
                'txt': 'fa-file-alt',
                'xls': 'fa-file-excel',
                'xlsx': 'fa-file-excel',
                'csv': 'fa-file-csv',
                'ppt': 'fa-file-powerpoint',
                'pptx': 'fa-file-powerpoint',
                'js': 'fa-file-code',
                'html': 'fa-file-code',
                'htm': 'fa-file-code',
                'css': 'fa-file-code',
                'json': 'fa-file-code',
                'xml': 'fa-file-code',
                'py': 'fa-file-code',
                'java': 'fa-file-code',
                'cpp': 'fa-file-code',
                'c': 'fa-file-code',
                'php': 'fa-file-code',
                'rb': 'fa-file-code',
                'go': 'fa-file-code',
                'rs': 'fa-file-code',
                'swift': 'fa-file-code',
                'kt': 'fa-file-code',
                'md': 'fa-file-alt',
                'zip': 'fa-file-archive',
                'rar': 'fa-file-archive',
                '7z': 'fa-file-archive'
            };
            return icons[ext] || 'fa-file';
        }

        function removeItem(card) {
            const folderName = card.dataset.folderName;
            if (folderName && folderStore[folderName]) {
                delete folderStore[folderName];
            }
            card.style.transition = '0.2s';
            card.style.transform = 'scale(0.8)';
            card.style.opacity = '0';
            setTimeout(() => {
                card.remove();
            }, 200);
        }

        function openFolder(folderName, files) {
            modalFolderName.textContent = folderName;
            modalFileList.innerHTML = '';
            
            const sortedFiles = [...files].sort((a, b) => a.name.localeCompare(b.name));
            
            sortedFiles.forEach(file => {
                const fileItem = document.createElement("div");
                fileItem.className = "file-item";
                
                const icon = document.createElement("i");
                icon.className = 'fas ' + getFileIcon(file.name);
                
                const name = document.createElement("span");
                name.className = "file-name";
                name.textContent = file.name;
                
                const size = document.createElement("span");
                size.className = "file-size";
                size.textContent = formatFileSize(file.size);
                
                fileItem.appendChild(icon);
                fileItem.appendChild(name);
                fileItem.appendChild(size);
                modalFileList.appendChild(fileItem);
            });
            
            folderOverlay.classList.add('active');
        }

        function closeModal() {
            folderOverlay.classList.remove('active');
        }

        function createFolderCard(folderName, files) {
            const card = document.createElement("div");
            card.className = "folder-card";
            card.dataset.folderName = folderName;
            
            const removeBtn = document.createElement("button");
            removeBtn.className = "folder-remove";
            removeBtn.innerHTML = '<i class="fas fa-times"></i>';
            removeBtn.title = "Remove folder";
            removeBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                removeItem(card);
            });
            
            const icon = document.createElement("i");
            icon.className = "fas fa-folder";
            
            const name = document.createElement("span");
            name.textContent = folderName;
            
            card.appendChild(removeBtn);
            card.appendChild(icon);
            card.appendChild(name);
            
            return card;
        }

        function processFiles(files) {
            const fileArray = Array.from(files);
            const folders = {};
            
            fileArray.forEach(file => {
                if (file.webkitRelativePath) {
                    const pathParts = file.webkitRelativePath.split('/');
                    const folderName = pathParts[0];
                    
                    if (!folders[folderName]) {
                        folders[folderName] = [];
                    }
                    folders[folderName].push(file);
                }
            });
            
            Object.keys(folders).forEach(folderName => {
                folderStore[folderName] = folders[folderName];
                const folderCard = createFolderCard(folderName, folders[folderName]);
                documentsGrid.appendChild(folderCard);
            });
        }

        // Create empty folder
        function createEmptyFolder() {
            const folderCount = documentsGrid.querySelectorAll('.folder-card').length + 1;
            const folderName = `Folder ${folderCount}`;
            
            const emptyFiles = [];
            folderStore[folderName] = emptyFiles;
            const folderCard = createFolderCard(folderName, emptyFiles);
            documentsGrid.appendChild(folderCard);
        }

        modalCloseBtn.addEventListener('click', closeModal);
        folderOverlay.addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        addBtn.addEventListener("click", function(e) {
            e.stopPropagation();
            fileInput.click();
        });

        // Add folder button
        addFolderBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            createEmptyFolder();
        });

        fileInput.addEventListener("change", function(e) {
            const files = e.target.files;
            if (!files || files.length === 0) return;
            
            uploadIndicator.classList.add('active');
            
            setTimeout(() => {
                processFiles(files);
                uploadIndicator.classList.remove('active');
                fileInput.value = "";
            }, 300);
        });

        documentsGrid.addEventListener("dragover", function(e) {
            e.preventDefault();
            this.style.backgroundColor = "#f0f4ff";
        });
        documentsGrid.addEventListener("dragleave", function(e) {
            this.style.backgroundColor = "#f9fafb";
        });
        documentsGrid.addEventListener("drop", function(e) {
            e.preventDefault();
            this.style.backgroundColor = "#f9fafb";
            const files = e.dataTransfer.files;
            if (files && files.length > 0) {
                uploadIndicator.classList.add('active');
                setTimeout(() => {
                    processFiles(files);
                    uploadIndicator.classList.remove('active');
                }, 300);
            }
        });
    });
    </script>
</body>
</html>
