<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudHaux · Images</title>
    <link rel="stylesheet" href="../static/css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* ----- IMAGES PAGE SPECIFIC STYLES ----- */
        .images_viewer {
            width: 100%;
            min-height: 400px;
            padding: 30px;
            border: 1px solid #d9d9d9;
            border-radius: 16px;
            background: white;
            display: flex;
            flex-direction: column;
        }

        .images_header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: none;
            flex-wrap: wrap;
            gap: 12px;
        }

        .images_header h2 {
            font-size: 1.3rem;
            color: #111827;
            margin: 0;
        }

        /* ADD FOLDER BUTTON (icon only) */
        .add-folder-btn {
            background: transparent;
            border: none;
            font-size: 1.8rem;
            color: #1e293b;
            cursor: pointer;
            padding: 0 6px;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            width: 44px;
            height: 44px;
            background: #f1f5f9;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }

        .add-folder-btn i {
            font-size: 1.6rem;
            color: #334155;
        }

        .add-folder-btn:hover {
            background: #e2e8f0;
            transform: scale(1.04);
            color: #0f172a;
        }

        .add-folder-btn:active {
            transform: scale(0.94);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .images_grid {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: flex-start;
            justify-content: flex-start;
            background: #f9fafb;
            border-radius: 12px;
            padding: 24px;
            min-height: 400px;
            border: 1px solid #e5e7eb;
            transition: 0.2s;
        }

        /* image card */
        .image-card {
            width: 140px;
            height: 140px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
            background: white;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: default;
        }

        .image-card:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 14px rgba(0,0,0,0.08);
        }

        .image-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* ----- FOLDER CARD — gray bg made smaller & softer ----- */
        .folder-card {
            width: 125px;
            height: 100px;
            border-radius: 12px;
            /* smaller, lighter gray background */
            background: #eef2f6;        /* was #eef2f6, keep light */
            border: 1px solid #d1d9e6;  /* softer border */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #1e293b;
            font-size: 0.85rem;
            font-weight: 500;
            transition: 0.2s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            cursor: default;
            gap: 4px;
        }

        .folder-card i {
            font-size: 2.8rem;
            color: #475569;
            margin-bottom: 2px;
        }

        /* label background also softer */
        .folder-card span {
            background: #dce3ec;   /* lighter than before */
            padding: 2px 14px;
            border-radius: 30px;
            font-size: 0.7rem;
            color: #1e293b;
            letter-spacing: 0.3px;
        }

        .folder-card:hover {
            background: #e2e8f0;
            border-color: #94a3b8;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .images_grid {
                min-height: 300px;
                padding: 16px;
            }
            .image-card {
                width: 100px;
                height: 100px;
            }
            .folder-card {
                width: 100px;
                height: 100px;
            }
            .add-folder-btn {
                width: 38px;
                height: 38px;
                font-size: 1.4rem;
            }
            .add-folder-btn i {
                font-size: 1.3rem;
            }
        }

        @media (max-width: 480px) {
            .images_grid {
                min-height: 200px;
                gap: 12px;
                padding: 12px;
            }
            .images_header h2 {
                font-size: 1rem;
            }
            .image-card {
                width: 80px;
                height: 80px;
            }
            .folder-card {
                width: 80px;
                height: 80px;
            }
            .folder-card i {
                font-size: 2rem;
            }
            .add-folder-btn {
                width: 34px;
                height: 34px;
            }
            .add-folder-btn i {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <!-- ===== TOPBAR ===== -->
    <header class="topbar">
        <div class="logo">CloudHaux</div>
        <div class="search-container">
            <input type="search" placeholder="Search files...">
            <i class="fas fa-search search-icon"></i>
        </div>
        <div class="profile">
            <svg viewBox="0 0 24 24">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
        </div>
    </header>

    <!-- ===== LEFT NAV ===== -->
    <nav class="left_nav_bar">
        <button type="button" class="add_file_btn" id="addFileBtn">+ Add Files</button>
        <a href="#all_files">All Files</a>
        <a href="#recent_files">Recent</a>
        <a href="#favorites">Favorites</a>
        <a href="#trash">Trash</a>
    </nav>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="dashboard_content">
        <div class="main_content">
            <section class="images_viewer">
                <div class="images_header">
                    <div class="header-left">
                        <h2>Images</h2>
                    </div>
                    <div class="header-actions">
                        <!-- ADD FOLDER BUTTON : icon only (folder + plus) -->
                        <button class="add-folder-btn" id="addFolderBtn" title="Create new folder">
                            <i class="fas fa-folder-plus"></i>
                        </button>
                    </div>
                </div>
                <div class="images_grid" id="imageGrid"></div>
            </section>
        </div>

        <!-- ===== RIGHT PANEL ===== -->
        <aside class="right_panel">
            <div class="button_group">
                <button class="category_btn images" onclick="window.location.href='images_page.html'">
                    <i class="fas fa-image"></i> Images
                </button>
                <button class="category_btn documents" onclick="window.location.href='documents_page.html'">
                    <i class="fas fa-file-alt"></i> Documents
                </button>
                <button class="category_btn media_files" onclick="window.location.href='media_page.html'">
                    <i class="fas fa-video"></i> Media
                </button>
                <button class="category_btn audio_files" onclick="window.location.href='audio_page.html'">
                    <i class="fas fa-music"></i> Audio
                </button>
                <button class="category_btn safe_vault" onclick="window.location.href='dashboard.html'">
                    <i class="fas fa-lock"></i> Safe Vault
                </button>
            </div>
        </aside>
    </main>

    <!-- hidden file input -->
    <input type="file" id="fileInput" accept="image/*" multiple style="display:none;">

    <!-- ===== JAVASCRIPT - Image upload + folder creation ===== -->
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        "use strict";

        const fileInput = document.getElementById("fileInput");
        const addBtn = document.getElementById("addFileBtn");
        const imageGrid = document.getElementById("imageGrid");
        const addFolderBtn = document.getElementById("addFolderBtn");

        if (!fileInput || !addBtn || !imageGrid || !addFolderBtn) {
            console.error('Elements not found');
            return;
        }

        // ----- render images (from FileList) -----
        function renderImages(files) {
            const imageFiles = Array.from(files).filter((file) =>
                file.type.startsWith("image/")
            );
            
            if (imageFiles.length === 0) {
                alert("Please select image files (JPEG, PNG, GIF, etc.)");
                return;
            }

            imageFiles.forEach((file) => {
                const reader = new FileReader();
                reader.onload = function (loadEvent) {
                    const imgSrc = loadEvent.target.result;
                    const card = document.createElement("div");
                    card.className = "image-card";
                    const img = document.createElement("img");
                    img.src = imgSrc;
                    img.alt = file.name || "image";
                    card.appendChild(img);
                    imageGrid.appendChild(card);
                };
                reader.readAsDataURL(file);
            });
        }

        // ----- ADD FOLDER (creates a folder-card) -----
        function createFolderCard() {
            const folderCount = imageGrid.querySelectorAll('.folder-card').length + 1;
            const folderName = `Folder ${folderCount}`;

            const card = document.createElement('div');
            card.className = 'folder-card';
            const icon = document.createElement('i');
            icon.className = 'fas fa-folder';
            const label = document.createElement('span');
            label.textContent = folderName;

            card.appendChild(icon);
            card.appendChild(label);
            imageGrid.appendChild(card);
        }

        // ----- event listeners -----
        addBtn.addEventListener("click", function (e) {
            e.stopPropagation();
            fileInput.click();
        });

        fileInput.addEventListener("change", function (e) {
            const files = e.target.files;
            if (!files || files.length === 0) return;
            renderImages(files);
            fileInput.value = "";
        });

        // drag & drop images
        imageGrid.addEventListener("dragover", function (e) {
            e.preventDefault();
            this.style.backgroundColor = "#f0f4ff";
        });
        imageGrid.addEventListener("dragleave", function (e) {
            this.style.backgroundColor = "#f9fafb";
        });
        imageGrid.addEventListener("drop", function (e) {
            e.preventDefault();
            this.style.backgroundColor = "#f9fafb";
            const files = e.dataTransfer.files;
            if (files && files.length > 0) {
                renderImages(files);
            }
        });

        // ----- ADD FOLDER BUTTON (icon only) -----
        addFolderBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            createFolderCard();
        });
    });
    </script>
</body>
</html>
