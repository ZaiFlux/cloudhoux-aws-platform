<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudHaux Dashboard</title>
    <link rel="stylesheet" href="../static/css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* Custom Context Menu Styles */
        .custom-context-menu {
            position: fixed;
            z-index: 10000;
            min-width: 180px;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            padding: 6px;
            display: none;
        }
        .custom-context-menu.open { display: block; }
        .ccm-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 12px;
            border-radius: 7px;
            font-size: 0.85rem;
            color: #1f2937;
            cursor: pointer;
        }
        .ccm-item i { width: 16px; text-align: center; color: #475569; }
        .ccm-item:hover { background: #f1f5f9; }
        .ccm-item.ccm-danger { color: #dc2626; }
        .ccm-item.ccm-danger i { color: #dc2626; }
        .ccm-item.ccm-danger:hover { background: #fee2e2; }
        .ccm-separator { height: 1px; background: #eef0f3; margin: 5px 4px; }

        /* File item styles */
        .file-item {
            cursor: grab;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: #f9fafb;
            border-radius: 6px;
            border: 1px solid #e5e7eb;
            margin-bottom: 6px;
            transition: transform 0.2s, box-shadow 0.2s, background 0.2s, border-color 0.2s;
            position: relative;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        .file-item:active {
            cursor: grabbing;
        }
        .file-item:hover {
            background: #f3f4f6;
            border-color: #7c3aed;
        }
        .file-item.dragging {
            opacity: 0.6;
            transform: scale(0.95);
            border-color: #7c3aed;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.15);
            z-index: 1000;
            cursor: grabbing;
        }
        .file-item.drag-over {
            border-color: #7c3aed;
            background: #f0f4ff;
            transform: scale(1.02);
            box-shadow: 0 2px 8px rgba(124, 58, 237, 0.1);
        }
        .file-item i {
            font-size: 16px;
            color: #6b7280;
            width: 20px;
            text-align: center;
            flex-shrink: 0;
        }
        .file-item .file-name {
            flex: 1;
            font-size: 13px;
            color: #374151;
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 4px;
            transition: 0.2s;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .file-item .file-name:hover {
            background: #e5e7eb;
        }
        .file-item .file-size {
            font-size: 11px;
            color: #6b7280;
            background: white;
            padding: 1px 8px;
            border-radius: 10px;
            flex-shrink: 0;
        }
        .file-name-input {
            background: white;
            border: 2px solid #3b82f6;
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 13px;
            color: #1e293b;
            outline: none;
            flex: 1;
            font-family: inherit;
            font-weight: 500;
            min-width: 60px;
        }
        .file-name-input:focus {
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        /* Drag placeholder */
        .drag-placeholder {
            border: 2px dashed #7c3aed;
            border-radius: 6px;
            padding: 8px 12px;
            margin-bottom: 6px;
            background: #f8f4ff;
            height: 42px;
            opacity: 0.5;
            transition: all 0.2s;
        }

        /* Compact sections */
        #recentFileList, #favoritesFileList, #fileList {
            max-height: 400px;
            overflow-y: auto;
            min-height: 60px;
        }

        /* search highlight */
        .highlight-match {
            background: #fef08a;
            padding: 0 2px;
            border-radius: 3px;
            font-weight: 600;
        }
        .clear-search-btn {
            background: transparent;
            border: none;
            color: #6b7280;
            font-size: 0.75rem;
            margin-left: 12px;
            cursor: pointer;
            padding: 2px 10px;
            border-radius: 20px;
            display: none;
        }
        .clear-search-btn:hover {
            background: #f1f5f9;
        }
        .section-header {
            display: flex;
            align-items: center;
        }

        /* Upload status indicator */
        .upload-status {
            font-size: 12px;
            color: #6b7280;
            padding: 4px 12px;
            background: #f3f4f6;
            border-radius: 20px;
            display: none;
            margin-left: 12px;
        }
        .upload-status.active {
            display: inline-block;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Drop zone highlight */
        #fileList.drag-over-zone {
            background: #f8f4ff;
            border: 2px dashed #7c3aed;
            border-radius: 8px;
            padding: 4px;
        }

        /* Toast notification */
        .toast-notification {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #1e293b;
            color: white;
            padding: 14px 24px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
            font-size: 14px;
            z-index: 99999;
            transform: translateY(100px);
            opacity: 0;
            transition: transform 0.4s ease, opacity 0.4s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .toast-notification.show {
            transform: translateY(0);
            opacity: 1;
        }
        .toast-notification .toast-icon {
            font-size: 18px;
        }
        .toast-notification .toast-undo {
            background: rgba(255,255,255,0.15);
            border: none;
            color: white;
            padding: 4px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }
        .toast-notification .toast-undo:hover {
            background: rgba(255,255,255,0.25);
        }
        .toast-notification .toast-close {
            background: none;
            border: none;
            color: rgba(255,255,255,0.6);
            cursor: pointer;
            font-size: 18px;
            padding: 0 4px;
        }
        .toast-notification .toast-close:hover {
            color: white;
        }

        /* Trash count badge */
        .trash-count {
            background: #ef4444;
            color: white;
            border-radius: 50%;
            padding: 1px 8px;
            font-size: 11px;
            margin-left: 6px;
            display: inline-block;
        }

        .left_nav_bar a {
            position: relative;
        }

        /* No matches message */
        .no-matches-message {
            display: none;
            color: #6b7280;
            font-size: 0.9rem;
            padding: 20px;
            text-align: center;
            background: #f9fafb;
            border-radius: 8px;
            border: 1px dashed #d1d5db;
            margin: 10px 0;
        }
        .no-matches-message i {
            display: block;
            font-size: 28px;
            color: #9aa8b9;
            margin-bottom: 8px;
        }
        .no-matches-message.show {
            display: block;
        }
        
        /* Search results wrapper */
        .search-results-container {
            position: relative;
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="logo">CloudHaux</div>
        <div class="search-container">
            <input type="search" id="globalSearch" placeholder="Search files...">
            <i class="fas fa-search search-icon"></i>
        </div>
        <div class="profile">
            <a href="profile_page.html">
                <svg viewBox="0 0 24 24">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
            </a>
        </div>
    </header>

    <nav class="left_nav_bar">
        <button type="button" class="add_file_btn" id="addFileBtn">+ Add Files</button>
        <input type="file" id="fileInput" hidden multiple>
        <a href="#all_files">All Files</a>
        <a href="#recent_files">Recent</a>
        <a href="#favorites">Favorites</a>
        <a href="trash_page.html" id="trashLink">Trash</a>
    </nav>

    <main class="dashboard_content">
        <div class="main_content">
            <!-- No matches message that appears under the search box -->
            <div class="no-matches-message" id="noMatchesMessage">
                <i class="fas fa-search"></i>
                No matches found for "<span id="searchQueryDisplay"></span>"
            </div>

            <section id="recent_files" class="recent_files">
                <h2>Recent Files</h2>
                <div id="recentFileList"></div>
            </section>
            <section id="favorites" class="favorites">
                <h2>Favorites</h2>
                <div id="favoritesFileList"></div>
            </section>
            <section id="all_files" class="all_files">
                <div class="section-header">
                    <h2>All Files</h2>
                    <span class="upload-status" id="uploadStatus">Uploading...</span>
                    <button class="clear-search-btn" id="clearSearchBtn">✕ clear</button>
                </div>
                <div id="fileList"></div>
            </section>
        </div>

        <aside class="right_panel">
            <div class="button_group">
                <button class="category_btn images" id="imagesBtn">
                    <i class="fas fa-image"></i> Images
                </button>
                <button class="category_btn documents" id="documentsBtn">
                    <i class="fas fa-file-alt"></i> Documents
                </button>
                <button class="category_btn media_files" id="mediaBtn">
                    <i class="fas fa-video"></i> Media
                </button>
                <button class="category_btn audio_files" id="audioBtn">
                    <i class="fas fa-music"></i> Audio
                </button>
                <button class="category_btn safe_vault" id="safeVaultBtn">
                    <i class="fas fa-lock"></i> Safe Vault
                </button>
            </div>
        </aside>
    </main>

    <!-- Custom Context Menu -->
    <div class="custom-context-menu" id="customContextMenu">
        <div class="ccm-item" id="ccmOpen"><i class="fas fa-eye"></i> Open</div>
        <div class="ccm-item" id="ccmShare"><i class="fas fa-share-alt"></i> Share</div>
        <div class="ccm-item" id="ccmMove"><i class="fas fa-folder-open"></i> Move to</div>
        <div class="ccm-item" id="ccmFavorite"><i class="fas fa-star"></i> Add to Favorites</div>
        <div class="ccm-separator"></div>
        <div class="ccm-item ccm-danger" id="ccmDelete"><i class="fas fa-trash"></i> Move to Trash</div>
    </div>

    <!-- Toast Notification -->
    <div class="toast-notification" id="toastNotification">
        <span class="toast-icon">🗑️</span>
        <span id="toastMessage">File moved to trash</span>
        <button class="toast-undo" id="toastUndoBtn">Undo</button>
        <button class="toast-close" id="toastCloseBtn">×</button>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        "use strict";

        const fileInput = document.getElementById("fileInput");
        const addBtn = document.getElementById("addFileBtn");
        const fileList = document.getElementById("fileList");
        const recentFileList = document.getElementById("recentFileList");
        const favoritesFileList = document.getElementById("favoritesFileList");
        const searchInput = document.getElementById("globalSearch");
        const clearSearchBtn = document.getElementById("clearSearchBtn");
        const uploadStatus = document.getElementById("uploadStatus");
        const noMatchesMessage = document.getElementById("noMatchesMessage");
        const searchQueryDisplay = document.getElementById("searchQueryDisplay");

        // Use a shared global variable for trash (no localStorage)
        if (!window.trashFiles) {
            window.trashFiles = [];
        }
        
        let allFiles = [];
        let favoriteFiles = [];
        let recentFiles = [];
        
        // Store for undo functionality
        let lastDeletedFile = null;
        let lastDeletedElement = null;
        let toastTimeout = null;

        const contextMenu = document.getElementById('customContextMenu');
        let contextTarget = null;
        let contextTargetFile = null;

        // Toast elements
        const toast = document.getElementById('toastNotification');
        const toastMessage = document.getElementById('toastMessage');
        const toastUndoBtn = document.getElementById('toastUndoBtn');
        const toastCloseBtn = document.getElementById('toastCloseBtn');

        // ---------- Toast functions ----------
        function showToast(message, fileData, element) {
            toastMessage.textContent = message;
            toast.classList.add('show');
            
            lastDeletedFile = fileData;
            lastDeletedElement = element;
            
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                hideToast();
            }, 5000);
        }

        function hideToast() {
            toast.classList.remove('show');
            clearTimeout(toastTimeout);
            lastDeletedFile = null;
            lastDeletedElement = null;
        }

        toastCloseBtn.addEventListener('click', hideToast);
        
        toastUndoBtn.addEventListener('click', function() {
            if (lastDeletedFile && lastDeletedElement) {
                restoreFromTrash(lastDeletedFile, lastDeletedElement);
                hideToast();
            }
        });

        // ---------- Trash functions ----------
        function moveToTrash(fileData, element) {
            const trashItem = {
                ...fileData,
                deletedAt: new Date().toISOString()
            };
            window.trashFiles.push(trashItem);
            
            const fileId = fileData.id;
            
            const index = allFiles.findIndex(f => f.id === fileId);
            if (index !== -1) {
                allFiles.splice(index, 1);
            }
            
            const favIndex = favoriteFiles.findIndex(f => f.id === fileId);
            if (favIndex !== -1) {
                favoriteFiles.splice(favIndex, 1);
            }
            
            const recIndex = recentFiles.findIndex(f => f.id === fileId);
            if (recIndex !== -1) {
                recentFiles.splice(recIndex, 1);
            }
            
            if (element) {
                element.style.transition = '0.3s';
                element.style.transform = 'scale(0.8)';
                element.style.opacity = '0';
                setTimeout(() => {
                    element.remove();
                    const q = searchInput.value.trim();
                    if (q) performSearch(q);
                    else renderAllSections('');
                }, 300);
            }
            
            showToast(`"${fileData.name}" moved to trash`, fileData, element);
            updateTrashCount();
        }

        function restoreFromTrash(fileData, element) {
            const trashIndex = window.trashFiles.findIndex(f => f.id === fileData.id);
            if (trashIndex !== -1) {
                window.trashFiles.splice(trashIndex, 1);
            }
            
            const restoredFile = {
                id: fileData.id || Date.now() + Math.random().toString(36).substr(2, 5),
                name: fileData.name,
                size: fileData.size || 0,
                type: fileData.type || '',
                lastModified: fileData.lastModified || Date.now(),
                webkitRelativePath: fileData.webkitRelativePath || fileData.name
            };
            
            const exists = allFiles.some(f => f.id === restoredFile.id);
            if (!exists) {
                allFiles.push(restoredFile);
            }
            
            const q = searchInput.value.trim();
            if (q) performSearch(q);
            else renderAllSections('');
            
            updateTrashCount();
        }

        function updateTrashCount() {
            const trashLink = document.getElementById('trashLink');
            if (trashLink) {
                const count = window.trashFiles.length;
                const existingBadge = trashLink.querySelector('.trash-count');
                if (existingBadge) existingBadge.remove();
                
                if (count > 0) {
                    const badge = document.createElement('span');
                    badge.className = 'trash-count';
                    badge.textContent = count;
                    trashLink.appendChild(badge);
                }
            }
        }

        // ---------- DRAG & DROP REORDERING ----------
        let draggedItem = null;
        let dragOverItem = null;
        let dragStartIndex = -1;
        let dragEndIndex = -1;

        function makeFileDraggable(element) {
            element.draggable = true;
            
            element.addEventListener('dragstart', function(e) {
                draggedItem = this;
                dragStartIndex = Array.from(this.parentNode.children).indexOf(this);
                this.classList.add('dragging');
                
                const fileId = this.dataset.fileId;
                const fileData = allFiles.find(f => f.id === fileId);
                if (fileData) {
                    e.dataTransfer.setData('text/plain', JSON.stringify({
                        id: fileId,
                        index: dragStartIndex
                    }));
                }
                e.dataTransfer.effectAllowed = 'move';
                
                const ghost = this.cloneNode(true);
                ghost.style.opacity = '0.5';
                ghost.style.position = 'absolute';
                ghost.style.top = '-1000px';
                document.body.appendChild(ghost);
                e.dataTransfer.setDragImage(ghost, 20, 20);
                setTimeout(() => document.body.removeChild(ghost), 0);
            });

            element.addEventListener('dragend', function(e) {
                this.classList.remove('dragging');
                
                document.querySelectorAll('.file-item.drag-over').forEach(el => {
                    el.classList.remove('drag-over');
                });
                fileList.classList.remove('drag-over-zone');
                
                const placeholder = document.querySelector('.drag-placeholder');
                if (placeholder) placeholder.remove();
                
                draggedItem = null;
                dragOverItem = null;
                dragStartIndex = -1;
                dragEndIndex = -1;
            });

            element.addEventListener('dragover', function(e) {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                
                if (this === draggedItem) return;
                
                document.querySelectorAll('.file-item.drag-over').forEach(el => {
                    el.classList.remove('drag-over');
                });
                
                this.classList.add('drag-over');
                dragOverItem = this;
                
                const placeholder = document.querySelector('.drag-placeholder');
                if (!placeholder) {
                    const ph = document.createElement('div');
                    ph.className = 'drag-placeholder';
                    this.parentNode.insertBefore(ph, this);
                } else {
                    this.parentNode.insertBefore(placeholder, this);
                }
            });

            element.addEventListener('dragleave', function(e) {
                if (!this.contains(e.relatedTarget)) {
                    this.classList.remove('drag-over');
                    const placeholder = document.querySelector('.drag-placeholder');
                    if (placeholder && placeholder.parentNode) {
                        placeholder.remove();
                    }
                }
            });

            element.addEventListener('drop', function(e) {
                e.preventDefault();
                this.classList.remove('drag-over');
                
                const placeholder = document.querySelector('.drag-placeholder');
                if (placeholder) placeholder.remove();
                
                if (draggedItem && draggedItem !== this) {
                    dragEndIndex = Array.from(this.parentNode.children).indexOf(this);
                    
                    const fileId = draggedItem.dataset.fileId;
                    const fileData = allFiles.find(f => f.id === fileId);
                    
                    if (fileData) {
                        const currentIndex = allFiles.findIndex(f => f.id === fileId);
                        const targetId = this.dataset.fileId;
                        const targetIndex = allFiles.findIndex(f => f.id === targetId);
                        
                        if (currentIndex !== -1 && targetIndex !== -1 && currentIndex !== targetIndex) {
                            const [movedItem] = allFiles.splice(currentIndex, 1);
                            allFiles.splice(targetIndex, 0, movedItem);
                            
                            const q = searchInput.value.trim();
                            if (q) performSearch(q);
                            else renderAllSections('');
                        }
                    }
                }
                
                dragEndIndex = -1;
            });
        }

        // ---------- context menu ----------
        function openContextMenu(x, y, targetElement, fileData) {
            contextTarget = targetElement;
            contextTargetFile = fileData;
            const maxX = window.innerWidth - 190;
            const maxY = window.innerHeight - 120;
            contextMenu.style.left = Math.min(x, maxX) + 'px';
            contextMenu.style.top = Math.min(y, maxY) + 'px';
            contextMenu.classList.add('open');
        }

        function closeContextMenu() {
            contextMenu.classList.remove('open');
            contextTarget = null;
            contextTargetFile = null;
        }

        function attachContextMenu(element, fileData) {
            element.addEventListener('contextmenu', function(e) {
                e.preventDefault();
                e.stopPropagation();
                openContextMenu(e.clientX, e.clientY, element, fileData);
            });
        }

        // ---------- rename ----------
        function makeFileNameEditable(nameSpan, fileData, fileElement) {
            const currentName = nameSpan.textContent;
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'file-name-input';
            input.value = currentName;
            nameSpan.replaceWith(input);
            input.focus();
            input.select();

            function saveRename() {
                const newName = input.value.trim() || currentName;
                if (fileData) fileData.name = newName;
                const newSpan = document.createElement('span');
                newSpan.className = 'file-name';
                newSpan.textContent = newName;
                newSpan.addEventListener('click', function(e) {
                    e.stopPropagation();
                    makeFileNameEditable(newSpan, fileData, fileElement);
                });
                input.replaceWith(newSpan);
                const q = searchInput.value.trim();
                if (q) performSearch(q);
                else renderAllSections('');
            }

            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
                else if (e.key === 'Escape') {
                    const newSpan = document.createElement('span');
                    newSpan.className = 'file-name';
                    newSpan.textContent = currentName;
                    newSpan.addEventListener('click', function(e) {
                        e.stopPropagation();
                        makeFileNameEditable(newSpan, fileData, fileElement);
                    });
                    input.replaceWith(newSpan);
                }
            });
            input.addEventListener('blur', saveRename);
        }

        // ---------- context menu actions ----------
        document.getElementById('ccmOpen').addEventListener('click', function(e) {
            e.stopPropagation();
            if (contextTargetFile) alert('Opening: ' + contextTargetFile.name);
            closeContextMenu();
        });
        document.getElementById('ccmShare').addEventListener('click', function(e) {
            e.stopPropagation();
            if (contextTargetFile) alert('Share: ' + contextTargetFile.name);
            closeContextMenu();
        });
        document.getElementById('ccmMove').addEventListener('click', function(e) {
            e.stopPropagation();
            if (contextTargetFile) alert('Move: ' + contextTargetFile.name);
            closeContextMenu();
        });
        document.getElementById('ccmFavorite').addEventListener('click', function(e) {
            e.stopPropagation();
            if (contextTargetFile && contextTargetFile.id) {
                if (!favoriteFiles.some(f => f.id === contextTargetFile.id)) {
                    favoriteFiles.push(contextTargetFile);
                    renderFavorites(searchInput.value.trim());
                }
            }
            closeContextMenu();
        });
        
        document.getElementById('ccmDelete').addEventListener('click', function(e) {
            e.stopPropagation();
            if (contextTargetFile && contextTargetFile.id) {
                moveToTrash(contextTargetFile, contextTarget);
            }
            closeContextMenu();
        });

        document.addEventListener('click', function(e) {
            if (!contextMenu.contains(e.target)) closeContextMenu();
        });
        document.addEventListener('scroll', closeContextMenu, true);
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeContextMenu();
        });

        // ---------- helpers ----------
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function getFileIcon(fileName) {
            const ext = fileName.split('.').pop().toLowerCase();
            const icons = {
                'jpg': 'fa-file-image','jpeg': 'fa-file-image','png': 'fa-file-image','gif': 'fa-file-image',
                'svg': 'fa-file-image','bmp': 'fa-file-image','webp': 'fa-file-image',
                'pdf': 'fa-file-pdf','doc': 'fa-file-word','docx': 'fa-file-word',
                'txt': 'fa-file-alt','xls': 'fa-file-excel','xlsx': 'fa-file-excel',
                'csv': 'fa-file-csv','ppt': 'fa-file-powerpoint','pptx': 'fa-file-powerpoint',
                'js': 'fa-file-code','html': 'fa-file-code','htm': 'fa-file-code','css': 'fa-file-code',
                'json': 'fa-file-code','xml': 'fa-file-code','py': 'fa-file-code','java': 'fa-file-code',
                'cpp': 'fa-file-code','c': 'fa-file-code','php': 'fa-file-code','rb': 'fa-file-code',
                'go': 'fa-file-code','rs': 'fa-file-code','swift': 'fa-file-code','kt': 'fa-file-code',
                'md': 'fa-file-alt','zip': 'fa-file-archive','rar': 'fa-file-archive','7z': 'fa-file-archive',
                'mp4': 'fa-file-video','avi': 'fa-file-video','mkv': 'fa-file-video','mov': 'fa-file-video',
                'wmv': 'fa-file-video','flv': 'fa-file-video','mp3': 'fa-file-audio','wav': 'fa-file-audio',
                'wma': 'fa-file-audio','aac': 'fa-file-audio','flac': 'fa-file-audio'
            };
            return icons[ext] || 'fa-file';
        }

        // ---------- create file element ----------
        function createFileElement(file, highlightText = '') {
            const div = document.createElement("div");
            div.className = "file-item";
            div.dataset.fileId = file.id;

            const icon = document.createElement("i");
            icon.className = 'fas ' + getFileIcon(file.name);

            const name = document.createElement("span");
            name.className = "file-name";

            if (highlightText && highlightText.length > 0) {
                const lowerName = file.name.toLowerCase();
                const lowerQuery = highlightText.toLowerCase();
                if (lowerName.includes(lowerQuery)) {
                    const idx = lowerName.indexOf(lowerQuery);
                    const before = file.name.slice(0, idx);
                    const match = file.name.slice(idx, idx + highlightText.length);
                    const after = file.name.slice(idx + highlightText.length);
                    name.innerHTML = `${before}<span class="highlight-match">${match}</span>${after}`;
                } else {
                    name.textContent = file.name;
                }
            } else {
                name.textContent = file.name;
            }

            name.addEventListener('click', function(e) {
                e.stopPropagation();
                makeFileNameEditable(name, file, div);
            });

            const size = document.createElement("span");
            size.className = "file-size";
            size.textContent = formatFileSize(file.size);

            div.appendChild(icon);
            div.appendChild(name);
            div.appendChild(size);

            makeFileDraggable(div);
            attachContextMenu(div, file);

            return div;
        }

        // ---------- render functions ----------
        function renderAllFiles(highlight = '') {
            fileList.innerHTML = '';
            if (allFiles.length === 0) {
                fileList.innerHTML = '<div style="color: #9aa8b9; padding: 1rem; text-align: center; font-size: 0.9rem;">Drop files here or click "+ Add Files"</div>';
                return;
            }
            const fragment = document.createDocumentFragment();
            allFiles.forEach(file => {
                fragment.appendChild(createFileElement(file, highlight));
            });
            fileList.appendChild(fragment);
        }

        function renderFavorites(highlight = '') {
            favoritesFileList.innerHTML = '';
            if (favoriteFiles.length === 0) {
                favoritesFileList.innerHTML = '<div style="color: #9aa8b9; padding: 0.5rem 0; font-size: 0.85rem;">No favorites yet.</div>';
                return;
            }
            const fragment = document.createDocumentFragment();
            favoriteFiles.forEach(file => {
                const el = createFileElement(file, highlight);
                el.draggable = false;
                fragment.appendChild(el);
            });
            favoritesFileList.appendChild(fragment);
        }

        function renderRecent(highlight = '') {
            recentFileList.innerHTML = '';
            const recent = recentFiles.slice(0, 5);
            if (recent.length === 0) {
                recentFileList.innerHTML = '<div style="color: #9aa8b9; padding: 0.5rem 0; font-size: 0.85rem;">No recent files.</div>';
                return;
            }
            const fragment = document.createDocumentFragment();
            recent.forEach(file => {
                const el = createFileElement(file, highlight);
                el.draggable = false;
                fragment.appendChild(el);
            });
            recentFileList.appendChild(fragment);
        }

        // ---------- Check if any files match the search ----------
        function hasSearchMatches(query) {
            if (!query || query.trim() === '') return true;
            const q = query.toLowerCase().trim();
            return allFiles.some(file => file.name.toLowerCase().includes(q));
        }

        function renderAllSections(highlight = '') {
            renderAllFiles(highlight);
            renderRecent(highlight);
            renderFavorites(highlight);
            updateTrashCount();
            
            // Show/hide "no matches" message
            const q = searchInput.value.trim();
            if (q !== '') {
                const hasMatches = hasSearchMatches(q);
                if (!hasMatches) {
                    searchQueryDisplay.textContent = q;
                    noMatchesMessage.classList.add('show');
                } else {
                    noMatchesMessage.classList.remove('show');
                }
            } else {
                noMatchesMessage.classList.remove('show');
            }
        }

        // ---------- search ----------
        function performSearch(query) {
            const q = query.trim();
            if (q === '') {
                clearSearchBtn.style.display = 'none';
                renderAllSections('');
                return;
            }
            clearSearchBtn.style.display = 'inline-block';
            renderAllSections(q);
        }

        searchInput.addEventListener('input', function(e) {
            performSearch(this.value);
        });

        clearSearchBtn.addEventListener('click', function() {
            searchInput.value = '';
            clearSearchBtn.style.display = 'none';
            noMatchesMessage.classList.remove('show');
            renderAllSections('');
            searchInput.focus();
        });

                // ---------- file processing ----------
        function processFiles(files) {
            const fileArray = Array.from(files);
            const totalFiles = fileArray.length;
            
            if (totalFiles === 0) return;
            
            uploadStatus.textContent = `Uploading ${totalFiles} files...`;
            uploadStatus.style.display = 'inline-block';
            uploadStatus.classList.add('active');
            
            const CHUNK_SIZE = 10;
            let processedCount = 0;
            
            function processChunk(startIndex) {
                const endIndex = Math.min(startIndex + CHUNK_SIZE, totalFiles);
                
                for (let i = startIndex; i < endIndex; i++) {
                    const file = fileArray[i];
                    const fileData = {
                        id: Date.now() + Math.random().toString(36).substr(2, 5) + i,
                        name: file.name,
                        size: file.size,
                        type: file.type,
                        lastModified: file.lastModified,
                        webkitRelativePath: file.webkitRelativePath || file.name
                    };
                    allFiles.push(fileData);
                    recentFiles.unshift(fileData);
                    if (recentFiles.length > 20) recentFiles.pop();
                    processedCount++;
                }
                
                uploadStatus.textContent = `Uploading ${processedCount}/${totalFiles}...`;
                
                const q = searchInput.value.trim();
                if (q) performSearch(q);
                else renderAllSections('');
                
                if (endIndex < totalFiles) {
                    requestAnimationFrame(() => {
                        setTimeout(() => processChunk(endIndex), 50);
                    });
                } else {
                    uploadStatus.textContent = `✓ ${totalFiles} files uploaded`;
                    setTimeout(() => {
                        uploadStatus.classList.remove('active');
                        setTimeout(() => {
                            uploadStatus.textContent = '';
                            uploadStatus.style.display = 'none';
                        }, 2000);
                    }, 800);
                    const q2 = searchInput.value.trim();
                    if (q2) performSearch(q2);
                    else renderAllSections('');
                }
            }
            
            processChunk(0);
        }

        // ---------- event listeners ----------
        addBtn.addEventListener("click", function(e) {
            e.stopPropagation();
            fileInput.value = '';
            fileInput.click();
        });

        fileInput.addEventListener("change", function(e) {
            const files = e.target.files;
            if (!files || files.length === 0) return;
            
            uploadStatus.style.display = 'inline-block';
            uploadStatus.textContent = 'Preparing...';
            uploadStatus.classList.add('active');
            
            setTimeout(() => {
                processFiles(files);
                fileInput.value = "";
            }, 100);
        });

        // FILE UPLOAD DRAG AND DROP
        fileList.addEventListener("dragover", function(e) {
            e.preventDefault();
            e.stopPropagation();
            if (!draggedItem) {
                this.classList.add('drag-over-zone');
            }
        });

        fileList.addEventListener("dragleave", function(e) {
            e.preventDefault();
            e.stopPropagation();
            if (!this.contains(e.relatedTarget)) {
                this.classList.remove('drag-over-zone');
            }
        });

        fileList.addEventListener("drop", function(e) {
            e.preventDefault();
            e.stopPropagation();
            this.classList.remove('drag-over-zone');
            
            if (!draggedItem) {
                const files = e.dataTransfer.files;
                if (files && files.length > 0) {
                    uploadStatus.style.display = 'inline-block';
                    uploadStatus.textContent = 'Preparing...';
                    uploadStatus.classList.add('active');
                    setTimeout(() => {
                        processFiles(files);
                    }, 100);
                }
            }
        });

        // ---------- category buttons ----------
        document.getElementById('imagesBtn').addEventListener('click', function() {
            window.location.href = 'images_page.html';
        });
        document.getElementById('documentsBtn').addEventListener('click', function() {
            window.location.href = 'documents_page.html';
        });
        document.getElementById('mediaBtn').addEventListener('click', function() {
            window.location.href = 'media_page.html';
        });
        document.getElementById('audioBtn').addEventListener('click', function() {
            window.location.href = 'audio_page.html';
        });
        document.getElementById('safeVaultBtn').addEventListener('click', function() {
            window.location.href = 'dashboard.html';
        });

        // ---------- INIT ----------
        renderAllSections('');
        clearSearchBtn.style.display = 'none';
        uploadStatus.style.display = 'none';
        updateTrashCount();

        console.log('✅ Dashboard loaded with drag-and-drop reordering!');
        console.log('📁 Drag files to reorder them. Drag outside to cancel.');
        console.log('🗑️ Deleted files go to trash. Use Undo to restore.');
        console.log(`📊 ${window.trashFiles.length} files in trash`);
        
    });
    </script>
</body>
